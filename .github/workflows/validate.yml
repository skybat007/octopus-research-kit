name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - release_github_cn
      - release_github_en

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate research artifacts
        run: npm run research:validate

      - name: Check release safety
        run: npm run release:check

      - name: Check whitespace
        run: git diff --check
