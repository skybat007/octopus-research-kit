  <script>
    window.RESEARCH_DOCS = [{"file":"README.md","label":"总览文档","content":"# Claude Code 技术调研\n\nStatus: draft\nOwner: cheng / Codex\nLast Updated: 2026-05-25\n\n## 调研摘要\n\n本轮调研对象是 `/Users/cheng/IdeaProjects/claude-code`，它不是 Anthropic 官方仓库，而是一个面向安全研究的 Claude Code source snapshot。仓库 README 说明该快照来自 npm distribution 中公开可访问的 source map，并声明用途是 educational、defensive security 和 software supply-chain analysis。[C-001]\n\n从源码看，Claude Code 的架构核心可以概括为：多入口命令路由 + 统一 setup/trust 边界 + React/Ink REPL + stateful `QueryEngine` + `queryLoop` 编排 + `Tool` contract + 权限流水线 + Skills/Plugins/MCP 扩展面 + session transcript 持久化。它不是一个只围绕单次 prompt 的 CLI，而是把本地交互、headless SDK、remote session、bridge 和 direct-connect 都接入同一套消息、工具和权限语义。[C-003][C-004][C-006][C-007][C-008][C-009][C-010][C-015]\n\n本轮已补充 Claude Code 官方文档互证；源码验证部分仍只做静态分析，没有启动 CLI、没有跑测试、没有访问真实 API。\n\n## 文件导航\n\n| 文件 | 说明 |\n|---|---|\n| research-brief.md | 调研目标、范围、问题和交付物 |\n| external-research.md | Claude Code 官方资料、快照来源和外部观点验证关系 |\n| research-questions.md | 从官方资料生成的源码验证问题 |\n| source-map.md | 仓库结构、入口、核心模块和阅读顺序 |\n| dashboard.html | 浏览器阅读入口，导航 Markdown、可视化图和辅助材料 |\n| docs.html | UTF-8 文档阅读器，避免浏览器直接打开 Markdown 乱码 |\n| references/source-inventory.json | 确定性源码扫描索引，辅助定位入口、测试、示例、构建和配置 |\n| architecture.md | 技术架构、模块边界、依赖方向和核心链路 |\n| visual/architecture.html | HTML 可视化结构图，展示入口路由、Conversation Runtime、Tool、权限流水线和扩展面 |\n| visual/architecture.visual.js | 可视化图数据，承接 Markdown 结论和证据链接 |\n| visual/evidence.html | 可点击证据解释页，展示架构语境和源码/文档片段 |\n| visual/evidence.visual.js | 从 evidence-index.md 和 architecture.visual.js 抽取的证据解释数据 |\n| key-abstractions.md | 核心抽象、接口、数据结构和生命周期对象 |\n| extension-points.md | Skills、Plugins、MCP、Hook、Command 等扩展机制 |\n| runtime-flows.md | 入口启动、REPL turn、工具执行、MCP、session、remote 流程 |\n| design-philosophy.md | 设计思想和关键取舍 |\n| comparison.md | 与 Hermes Agent、OpenClaw 和常见 Agent CLI 的对照 |\n| adoption-notes.md | 学习借鉴笔记、适用约束和待验证点 |\n| evidence-index.md | 证据索引 |\n| research-review.md | 调研审查 |\n\n## 当前结论\n\n- Claude Code 官方文档描述的是当前产品能力，本地仓库是非官方 source snapshot；因此本轮把官方资料用于解释产品语义，把源码用于验证 snapshot 中的真实实现。[C-001][EXT-CC-001]\n- Claude Code snapshot 首先是一个模式路由器：`main()` 在真正进入 Commander 前先处理 Windows 安全环境、direct-connect URL、deep link、assistant command、SSH command、headless/interactive 判定和 client type。[C-003]\n- `setup()` 和 `renderAndRun()` 把运行环境、工作目录、trust、API key、MCP approvals、telemetry 等前置边界放在 query 之前，说明安全和上下文隔离不是工具调用时才临时判断。[C-005]\n- `QueryEngine` 是会话级状态拥有者，`queryLoop` 是 turn 内编排器；两者之间通过消息、system/user context、tool context、budget、fallback、permission callback 和 streaming events 协作。[C-007][C-008]\n- `Tool` 是最关键的协议对象，不只是 `name + call`：它还携带 schema、权限、并发、只读、破坏性、渲染、MCP/LSP、defer、strict 等语义。[C-009]\n- 权限系统被做成独立流水线：tool execution、hooks、permission context、interactive handler、bridge/remote callbacks、speculative classifier 都可能参与一次 tool decision。[C-010]\n- 扩展面分层清晰：Slash command、Skill、Plugin、MCP tool/resource、Hook、remote/bridge session 各自有加载和执行协议，而不是混成一个大插件入口。[C-011][C-012][C-015]\n\n## 待确认\n\n- 未验证本地依赖是否完整，也未运行 `bun`、CLI 或测试。\n- 已补充 Claude Code 官方文档互证，但官方当前行为和本地非官方 snapshot 仍需要严格区分。\n- direct-connect server 子命令引用的部分 server-side 文件在本地快照中不存在，本轮只能分析 client/manager 和入口引用。[C-004][C-015]\n- React/Ink UI 的部分源码经过编译器处理，可读性弱于普通手写 TSX，本轮重点放在状态和调用链。\n"},{"file":"research-brief.md","label":"调研简报","content":"# 调研简报\n\n## 1. 调研对象\n\n| 项 | 内容 |\n|---|---|\n| 项目 | Claude Code source snapshot |\n| 本地路径 | `/Users/cheng/IdeaProjects/claude-code` |\n| 远程来源 | `https://github.com/jarmuine/claude-code.git` |\n| branch/commit | `main`, `4b9d30f7953273e567a18eb819f4eddd45fcc877` |\n| 代码规模 | `src` 下约 1902 个文件 |\n| 主要技术 | TypeScript, Bun, React + Ink, CLI, WebSocket, MCP |\n| 快照属性 | 非官方源码快照，README 声明用于安全研究和供应链分析 |\n| 官方文档 | https://code.claude.com/docs |\n| 外部资料范围 | Claude Code 官方 docs、非官方 snapshot README/GitHub；本轮未采用第三方分析文章 |\n\n## 2. 调研目标\n\n理解 Claude Code 的技术架构和设计思想，重点回答：\n\n- 它如何把 CLI、REPL、headless SDK、remote、bridge、direct-connect 等入口统一到同一套运行模型？\n- `QueryEngine`、`queryLoop`、Tool、权限、上下文、session transcript 之间如何协作？\n- Skills、Plugins、MCP、Commands、Hooks 分别承担什么扩展职责？\n- 哪些设计思想值得用于学习 Agent CLI、工具编排和权限系统？\n\n## 3. 范围\n\n本轮覆盖：\n\n- 启动入口、命令注册、运行模式选择\n- setup/trust/onboarding/API key/MCP approval 等运行前边界\n- REPL 到 query 的主流程\n- `QueryEngine` 和 `queryLoop`\n- Tool contract、tool pool、tool execution、permission pipeline\n- Commands、Skills、Plugins、MCP\n- session id、transcript、context、API client\n- bridge、remote session、direct-connect 的会话通道\n\n本轮不覆盖：\n\n- 每个内置工具的完整实现细节\n- 全量 UI 组件渲染\n- 官方产品能力判断\n- 真实模型 API 行为、性能压测或安全审计结论\n- 任何后续工程动作方案\n\n## 4. 交付物\n\n- `source-map.md`\n- `external-research.md`\n- `research-questions.md`\n- `architecture.md`\n- `key-abstractions.md`\n- `extension-points.md`\n- `runtime-flows.md`\n- `design-philosophy.md`\n- `comparison.md`\n- `adoption-notes.md`\n- `evidence-index.md`\n- `research-review.md`\n\n## 5. 方法\n\n- 固定本地 snapshot、branch、commit 和调研日期。\n- 补充 Claude Code 官方文档调研，并把官方观点转成源码验证问题。\n- 从 README、入口文件、核心对象、工具系统、扩展系统、session 和 remote 通道向内追踪。\n- 所有关键结论用 `evidence-index.md` 中的证据编号约束。\n- 对推断和未验证点单独标注，避免把源码阅读结论包装成运行时事实。\n"},{"file":"external-research.md","label":"外部资料","content":"# 外部资料调研\n\n## 1. 官方资料\n\n| 资料 | 链接或路径 | 主要内容 | 对本次调研的价值 | 可信度等级 |\n|---|---|---|---|---|\n| Claude Code Overview | https://code.claude.com/docs/en/overview | Claude Code 是 agentic coding tool，可在 terminal、IDE、desktop、browser 等界面使用 | 提供官方产品定位，用于与本地 source snapshot 区分 | A |\n| How Claude Code works | https://code.claude.com/docs/en/how-claude-code-works | agentic loop、tools、sessions、context、permissions、interfaces | 将官方 agent loop 与本地 `queryLoop`、Tool、session 证据互证 | A |\n| Configure permissions | https://code.claude.com/docs/en/permissions | permission rules、modes、deny/ask/allow 优先级、managed settings | 验证本地 permission pipeline 的产品语义 | A |\n| MCP docs | https://code.claude.com/docs/en/mcp | MCP servers 连接外部工具、resources、tool search、managed config | 验证本地 MCP client/tool wrapper 设计 | A |\n| Skills docs | https://code.claude.com/docs/en/skills | Skills、custom commands、bundled skills、on-demand loading、frontmatter | 验证本地 commands/skills/plugin skill 加载 | A |\n| Hooks reference | https://code.claude.com/docs/en/hooks | hook events、configuration、PreToolUse、PermissionRequest、PostToolUse、agent hooks | 验证本地 hook/permission/event 体系 | A |\n\n## 2. 项目协作资料\n\n| 资料 | 链接或路径 | 主要观点 | 时间/版本 | 可信度等级 | 是否需要源码验证 |\n|---|---|---|---|---|---|\n| 本地 source snapshot README | `/Users/cheng/IdeaProjects/claude-code/README.md` | 声明该仓库不是官方 Anthropic repo，而是 security research source snapshot | 本地快照，2026-05-25 | S/A | 已验证 |\n| Snapshot GitHub 仓库 | https://github.com/jarmuine/claude-code | 公开镜像/快照来源，不等同官方当前源码 | 2026-05-25 查询 | C | 是 |\n\n## 3. 社区与第三方资料\n\n本轮只把 `jarmuine/claude-code` 作为非官方 source snapshot 背景，不使用第三方分析文章支撑核心结论。官方当前行为以 Claude Code docs 为准，本地实现结论以 source snapshot 为准。\n\n## 4. 外部资料中的关键观点\n\n### EXT-CC-001: Claude Code 是跨界面的 agentic coding tool\n\n来源：\n\n- Claude Code Overview\n- How Claude Code works\n\n说明：\n\n- 官方资料说明 Claude Code 可在 terminal、IDE、desktop、browser 等界面运行，底层 agentic loop、tools 和 capabilities 保持一致。\n\n是否已被源码验证：\n\n- 本地快照验证了 CLI、REPL、headless SDK、remote、bridge、direct-connect 等入口，但官方当前 web/desktop/IDE 行为不能由该 snapshot 完整证明。\n\n对应源码证据：\n\n- [evidence-index.md](./evidence-index.md) `C-003`, `C-004`, `C-006`, `C-015`, `INF-001`\n\n### EXT-CC-002: Agentic loop 由上下文、动作和验证循环组成\n\n来源：\n\n- How Claude Code works\n\n说明：\n\n- 官方资料将 loop 描述为 gather context、take action、verify results，工具结果反馈给下一步决策。\n\n是否已被源码验证：\n\n- 已由 `queryLoop`、Tool execution、context 和 transcript 证据验证主要结构。\n\n对应源码证据：\n\n- `C-006`, `C-007`, `C-008`, `C-009`, `C-010`, `C-013`\n\n### EXT-CC-003: 权限由规则、模式和 hooks 共同控制\n\n来源：\n\n- Configure permissions\n- Hooks reference\n\n说明：\n\n- 官方资料说明 deny/ask/allow rules、permission modes、PreToolUse hook 都参与权限控制。\n\n是否已被源码验证：\n\n- 已由 `ToolPermissionContext`、`useCanUseTool`、PermissionContext、interactiveHandler 和 tool execution 证据验证。\n\n对应源码证据：\n\n- `C-009`, `C-010`\n\n### EXT-CC-004: MCP、Skills、Hooks 是不同扩展层\n\n来源：\n\n- MCP docs\n- Skills docs\n- Extend Claude Code\n- Hooks reference\n\n说明：\n\n- 官方资料区分 MCP 外部工具连接、Skill 按需加载知识/流程、Hook 生命周期自动化。\n\n是否已被源码验证：\n\n- 已验证 MCP client、skills/commands/plugin command 和 hooks/permission event 的本地实现；Plugin 与官方当前 product 行为仍可能随版本变化。\n\n对应源码证据：\n\n- `C-011`, `C-012`, `C-010`, `INF-003`\n\n### EXT-CC-005: Session 是本地 JSONL 可恢复记录\n\n来源：\n\n- How Claude Code works\n\n说明：\n\n- 官方资料说明 Claude Code 会把会话写到本地 JSONL，用于 rewind、resume、fork。\n\n是否已被源码验证：\n\n- 已由 sessionStorage 和 bootstrap state 证据验证 snapshot 中的 session/transcript 结构。\n\n对应源码证据：\n\n- `C-013`, `INF-004`\n\n## 5. 外部资料与源码不一致的地方\n\n| 外部资料说法 | 源码实际情况 | 判断 | 后续处理 |\n|---|---|---|---|\n| 官方 docs 描述当前 Claude Code 产品 | 本地仓库是非官方 source snapshot，且缺少部分 direct-connect server-side 文件 | 不能把 snapshot 视作官方当前实现 | 所有源码结论限定为本地快照 |\n| 官方 docs 覆盖 web/desktop/IDE/Slack/CI 等界面 | 本轮源码重点验证 CLI/REPL/headless/bridge/direct-connect/remote client pieces | 部分验证 | 对官方当前多界面行为保持外部事实，不写成源码事实 |\n| 官方 docs 说明 hooks/skills/MCP 当前能力 | 本地 snapshot 中相关实现存在，但可能与当前发布版本有差异 | 大体互证，仍需版本差异检查 | 若要追最新行为，应补官方 changelog/release 差异 |\n\n## 6. 对调研方向的影响\n\n外部资料帮助确认本轮应重点保留：\n\n- `queryLoop` 与官方 agentic loop 的对应关系\n- Tool contract 与权限模式的真实实现\n- MCP/Skills/Hooks 的分层扩展模型\n- Session/transcript 与 resume/fork 语义\n- 非官方 snapshot 与官方产品行为的边界\n"},{"file":"research-questions.md","label":"研究问题","content":"# 研究问题\n\n## 1. 问题清单\n\n| 编号 | 问题 | 来源 | 为什么重要 | 需要验证的源码方向 | 状态 |\n|---|---|---|---|---|---|\n| RQ-CC-001 | 官方 agentic loop 在本地 snapshot 中对应哪些对象？ | EXT-CC-002 | 决定如何把官方概念映射到源码 | `QueryEngine`, `queryLoop`, Tool execution, context | 已验证 |\n| RQ-CC-002 | Claude Code 多界面/多入口是否复用同一 runtime 语义？ | EXT-CC-001 | 决定 CLI/remote/SDK 是否是同一架构 | `main.tsx`, REPL, bridge, remote, direct-connect | 部分验证 |\n| RQ-CC-003 | 权限规则、模式和 hook 是否在源码中形成独立流水线？ | EXT-CC-003 | 决定安全模型是否只是 prompt 约束 | `ToolPermissionContext`, `useCanUseTool`, `toolExecution`, hooks | 已验证 |\n| RQ-CC-004 | MCP、Skills、Hooks 是否是分层扩展模型？ | EXT-CC-004 | 决定扩展点是否应分开理解 | MCP client、commands、skills、plugin loader、hooks | 已验证 snapshot |\n| RQ-CC-005 | Session JSONL/resume/fork 语义在源码中如何体现？ | EXT-CC-005 | 决定长期状态是否只是 UI history | `bootstrap/state.ts`, `sessionStorage.ts` | 已验证 snapshot |\n\n## 2. 详细问题\n\n### RQ-CC-001: 官方 agentic loop 对应哪些源码对象？\n\n外部资料来源：\n\n- https://code.claude.com/docs/en/how-claude-code-works\n\n需要源码验证：\n\n- gather context、take action、verify results 是否可映射到 REPL context loading、queryLoop、Tool execution 和 transcript。\n\n验证结果：\n\n- 已验证主要结构。\n\n源码证据：\n\n- `C-006`, `C-007`, `C-008`, `C-009`, `C-010`, `C-013`\n\n### RQ-CC-002: 多界面/多入口是否复用同一 runtime 语义？\n\n外部资料来源：\n\n- https://code.claude.com/docs/en/overview\n- https://code.claude.com/docs/en/how-claude-code-works\n\n需要源码验证：\n\n- CLI、REPL、headless SDK、remote、bridge、direct-connect 是否进入统一 query/message/permission 语义。\n\n验证结果：\n\n- 部分验证。本地 snapshot 验证了 CLI/REPL/headless/bridge/remote/direct-connect client pieces；官方当前 web/desktop/IDE/Slack/CI 不能由该 snapshot 完整确认。\n\n源码证据：\n\n- `C-003`, `C-004`, `C-006`, `C-015`, `INF-001`\n\n### RQ-CC-003: 权限是否是独立流水线？\n\n外部资料来源：\n\n- https://code.claude.com/docs/en/permissions\n- https://code.claude.com/docs/en/hooks\n\n需要源码验证：\n\n- deny/ask/allow、permission modes、PreToolUse/PermissionRequest 等是否对应源码中的 context、handler 和 tool execution path。\n\n验证结果：\n\n- 已验证。\n\n源码证据：\n\n- `C-009`, `C-010`\n\n### RQ-CC-004: MCP、Skills、Hooks 是否分层？\n\n外部资料来源：\n\n- https://code.claude.com/docs/en/mcp\n- https://code.claude.com/docs/en/skills\n- https://code.claude.com/docs/en/features-overview\n\n需要源码验证：\n\n- MCP 是否包装成 Tool。\n- Skill/command/plugin 是否进入 command/tool 语义。\n- Hook 是否作为 lifecycle/permission/control extension 处理。\n\n验证结果：\n\n- 已验证本地 snapshot 中的主要结构。\n\n源码证据：\n\n- `C-010`, `C-011`, `C-012`, `INF-003`\n\n## 3. 外部观点验证状态\n\n| 外部观点 | 对应问题 | 验证状态 | 证据 |\n|---|---|---|---|\n| Agentic loop 由模型和工具共同驱动 | RQ-CC-001 | 已验证 | `C-006`-`C-010` |\n| 多界面共用 agentic loop | RQ-CC-002 | 部分验证 | `C-003`, `C-004`, `C-006`, `C-015` |\n| 权限由规则、模式、hook 控制 | RQ-CC-003 | 已验证 | `C-009`, `C-010` |\n| MCP/Skills/Hooks 是不同扩展层 | RQ-CC-004 | 已验证 snapshot | `C-010`-`C-012` |\n| Sessions 写入本地 JSONL | RQ-CC-005 | 已验证 snapshot | `C-013` |\n\n## 4. 待继续确认\n\n- 官方当前 changelog 与本地 snapshot 的差异。\n- direct-connect server-side 文件缺失导致的完整性缺口。\n- 官方 web/desktop/IDE/Slack/CI 界面的源码对应关系。\n"},{"file":"source-map.md","label":"源码地图","content":"# 源码地图\n\n## 1. 快照定位\n\n仓库 README 将该项目定位为 Claude Code 的 source snapshot，用于安全研究；它说明快照来自 npm 包中公开可访问的 source map，并明确不是 Anthropic 官方 repository。[C-001] 因此，本轮源码阅读只代表本地快照，不代表官方当前实现。\n\n本地快照：\n\n| 项 | 内容 |\n|---|---|\n| 路径 | `/Users/cheng/IdeaProjects/claude-code` |\n| branch | `main` |\n| commit | `4b9d30f7953273e567a18eb819f4eddd45fcc877` |\n| remote | `https://github.com/jarmuine/claude-code.git` |\n| `src` 文件数 | 约 1902 |\n| source-inventory | `references/source-inventory.json`，1915 个文件 |\n\n## 2. 顶层阅读入口\n\n| 文件/目录 | 作用 |\n|---|---|\n| `README.md` | 快照来源、范围、目录说明和用途声明 |\n| `src/main.tsx` | CLI 主入口、Commander 命令注册、运行模式路由 |\n| `src/setup.ts` | 运行环境初始化、cwd、UDS messaging、worktree 和终端恢复 |\n| `src/interactiveHelpers.tsx` | React/Ink 渲染启动、trust/API key/MCP approvals/onboarding |\n| `src/replLauncher.tsx` | 动态加载 `App` 和 `REPL` |\n| `src/screens/REPL.tsx` | 交互式 REPL 状态、工具上下文、query 发起 |\n| `src/QueryEngine.ts` | 会话级 query 生命周期和状态管理 |\n| `src/query.ts` | turn 内主循环、模型调用、工具调用、compact、fallback |\n\n## 3. 核心模块地图\n\n| 领域 | 关键位置 | 说明 |\n|---|---|---|\n| 入口和命令 | `src/main.tsx`, `src/commands.ts` | 主命令、子命令、Slash command、Skill command 加载 |\n| UI/REPL | `src/screens/REPL.tsx`, `src/components`, `src/ink`, `src/hooks` | React/Ink 交互界面、hooks、权限弹窗和输入状态 |\n| Query | `src/QueryEngine.ts`, `src/query.ts`, `src/query/deps.ts` | 会话状态、turn 编排、依赖注入 |\n| Tool | `src/Tool.ts`, `src/tools.ts`, `src/services/tools` | Tool contract、工具池、执行、权限和并发 |\n| Permissions | `src/hooks/useCanUseTool.tsx`, `src/hooks/toolPermission` | 权限上下文、交互处理、hook 和 bridge callback |\n| Skills | `src/skills`, `src/skills/loadSkillsDir.ts` | Skill discovery、Skill command、动态加载 |\n| Plugins | `src/plugins`, `src/utils/plugins` | plugin manifest、command、agent、hook、marketplace |\n| MCP | `src/services/mcp` | MCP client、tool/resource/command/skill discovery、远程工具调用 |\n| Session | `src/bootstrap/state.ts`, `src/utils/sessionStorage.ts` | session id、project dir、transcript、remote persistence |\n| Context/API | `src/context.ts`, `src/services/api` | git/user/system context、模型 client、provider 环境变量 |\n| Remote | `src/bridge`, `src/remote`, `src/server` | bridge worker、remote CCR session、direct-connect client pieces |\n\n## 4. 推荐阅读顺序\n\n1. `README.md`：先确认这是 security research snapshot，而不是官方源码仓库。[C-001]\n2. `src/main.tsx`：理解运行模式路由、Commander surface 和子命令集合。[C-003][C-004]\n3. `src/setup.ts` + `src/interactiveHelpers.tsx`：理解运行前边界、trust、API key 和 MCP approvals。[C-005]\n4. `src/replLauncher.tsx` + `src/screens/REPL.tsx`：理解交互式用户 turn 如何进入 query。[C-006]\n5. `src/QueryEngine.ts` + `src/query.ts`：理解会话状态和 turn 内模型/工具编排。[C-007][C-008]\n6. `src/Tool.ts` + `src/tools.ts` + `src/services/tools`：理解 tool contract、pool assembly、执行和权限。[C-009][C-010]\n7. `src/commands.ts` + `src/utils/plugins` + `src/skills`：理解命令、Skill 和 Plugin 扩展面。[C-011]\n8. `src/services/mcp`：理解 MCP 如何映射成 Tool contract。[C-012]\n9. `src/bootstrap/state.ts` + `src/utils/sessionStorage.ts`：理解 session 和 transcript。[C-013]\n10. `src/bridge` + `src/remote` + `src/server`：理解远程会话通道。[C-015]\n\n## 5. 快照缺口\n\n`src/main.tsx` 的 direct-connect `server` 子命令会动态引用 `server/server.js`、`sessionManager.js`、`backends/dangerousBackend.js` 等 server-side 文件，但本地 `src/server` 目录只包含 `directConnectManager.ts`、`types.ts`、`createDirectConnectSession.ts`。因此 direct-connect 的 client-side 和入口引用可以分析，server-side 内部不能从当前快照完整确认。[C-004][C-015]\n"},{"file":"architecture.md","label":"架构文档","content":"# 技术架构\n\n## 1. 总览\n\nClaude Code 的架构不是简单的 “CLI 调模型”。它先通过 `main()` 做运行模式路由，再由 `setup()` 和交互初始化建立 trust、cwd、terminal、MCP approval、API key 等边界；交互式路径进入 React/Ink REPL，headless/SDK/remote 路径进入结构化 IO；最终都围绕 `QueryEngine`、`queryLoop`、Tool contract、permission pipeline 和 transcript storage 组织。[C-003][C-005][C-006][C-007][C-008][C-009][C-010][C-013]\n\n新版外部资料阶段补充了官方产品语义：官方文档把 Claude Code 描述为 agentic coding tool，核心由 agentic loop、tools、permissions、MCP、Skills、Hooks 和 session history 组成。本地非官方 source snapshot 可以验证这些概念中的 CLI/REPL/headless/remote/permission/MCP/session 实现片段，但不能证明官方当前所有界面行为。[EXT-CC-001][EXT-CC-002][EXT-CC-003][EXT-CC-004][EXT-CC-005]\n\n可视化补充：[visual/architecture.html](./visual/architecture.html)，图数据见 [visual/architecture.visual.js](./visual/architecture.visual.js)。证据解释页：[visual/evidence.html](./visual/evidence.html)，数据见 [visual/evidence.visual.js](./visual/evidence.visual.js)。该 HTML 图只展示本文和证据索引中已经沉淀的结构关系。\n\n```mermaid\nflowchart TD\n  A[\"CLI argv / cc URL / SSH / SDK / Bridge / Direct Connect\"] --\u003e B[\"src/main.tsx mode router\"]\n  B --\u003e C[\"Commander commands and preAction init\"]\n  C --\u003e D[\"setup: cwd, terminal, UDS, worktree\"]\n  D --\u003e E[\"interactiveHelpers: trust, onboarding, API key, MCP approvals\"]\n  E --\u003e F[\"React/Ink App + REPL\"]\n  B --\u003e G[\"Headless / SDK / remote structured IO\"]\n  F --\u003e H[\"QueryEngine\"]\n  G --\u003e H\n  H --\u003e I[\"queryLoop\"]\n  I --\u003e J[\"Model streaming client\"]\n  I --\u003e K[\"Tool pool\"]\n  K --\u003e L[\"Built-in tools\"]\n  K --\u003e M[\"MCP tools/resources\"]\n  K --\u003e N[\"Skills / Plugin commands\"]\n  I --\u003e O[\"Permission pipeline\"]\n  O --\u003e P[\"Hooks / interactive dialog / bridge or remote callback\"]\n  I --\u003e Q[\"Session transcript and context\"]\n```\n\n## 2. 分层结构\n\n### Entry Layer\n\n`src/main.tsx` 在 Commander 解析之前处理多种特殊入口：direct-connect URL、deep link、assistant command、SSH command、headless 判定、interactive flag、client type 和 settings eager load。[C-003] 之后 `run()` 创建 Commander program，注册默认命令和大量 options，并在 `preAction` 中做初始化、sink、inline plugins、policy/settings sync 等工作。[C-004]\n\n这一层的设计价值是：运行模式差异尽量在入口阶段归一，后续 query 层不用到处识别 argv 形态。\n\n### Setup And Trust Layer\n\n`setup()` 处理 Node 版本、custom session、UDS messaging server、terminal restore、cwd 设置和 worktree 检查。[C-005] `renderAndRun()` 及其周边逻辑把 onboarding、workspace trust、GrowthBook、system context prefetch、MCP approvals、外部 `CLAUDE.md` include warning、telemetry、API key、bypass permission dialog 和 auto-mode opt-in 放在进入 REPL 之前。[C-005]\n\n这一层把 “能否信任当前工作区、能否调用外部能力、是否允许危险模式” 前置为运行前边界。\n\n### Interaction Layer\n\n`replLauncher.tsx` 动态加载 `App` 和 `REPL`。[C-006] `REPL` 保存 initial messages、MCP、tools、file history、agents、thinking、direct-connect、ssh 等交互状态，并在发起 query 前重新组装 tool permission context、tool pool、system prompt、user context 和 system context。[C-006]\n\n这一层让 UI 保持丰富状态，但将真正的推理和工具编排交给 query 层。\n\n### Conversation Layer\n\n`QueryEngine` 是会话级生命周期对象。配置中包含 cwd、tools、commands、MCP clients、agents、permission callback、AppState getter/setter、read cache、prompts、model、fallback、budget、schema、SDK status、abort controller 等。[C-007] 每次 `submitMessage()` 开始一个 turn，会持久化 session，包装 permission callback，并调用 `query(...)`。[C-007]\n\n`queryLoop` 是 turn 内主循环：追加 system context、auto-compact、调用模型、处理 stream event、执行工具、处理 fallback、刷新 tools、消耗 memory/skill prefetch，并在结束时产出结果或错误事件。[C-008]\n\n### Tool And Permission Layer\n\n`Tool` contract 包含 schema、call、permission、并发、只读、破坏性、渲染、open-world、MCP/LSP、defer、strict、result size、matcher、prompt 等大量语义。[C-009] `tools.ts` 是 built-in tool 的 source of truth，并通过 feature/env gate、deny rules、simple mode、dedup 和稳定排序生成 tool pool。[C-009]\n\ntool execution 先解析 tool name 和 input schema，再进入 hooks、permission decision、speculative classifier、interactive permission、bridge/remote callback，最后才调用 `tool.call(...)`。[C-010]\n\n### Extension Layer\n\n扩展面包括：\n\n- Slash command 与 Skill command。[C-011]\n- Plugin manifest、plugin command、plugin skill、plugin hooks、marketplace。[C-011]\n- MCP tool、resource、command、skill discovery。[C-012]\n- Remote/bridge/direct-connect 控制请求中的 permission callback。[C-015]\n\n这些扩展面最终会映射到 command、tool、permission 或 session message 语义，而不是每个入口各自维护一套执行模型。\n\n### State And Context Layer\n\n`bootstrap/state.ts` 维护 session id、parent session 和 project root。[C-013] `sessionStorage.ts` 管理 transcript 路径、50MB raw read cap、append buffering、UUID dedup、sidechain transcript 和 remote persistence。[C-013] `context.ts` 生成 git/user/system context，并对 git status、CLAUDE.md、current date 等做 memoization。[C-014]\n\n## 3. 依赖方向\n\n整体依赖方向是：\n\n入口/REPL 依赖 QueryEngine；QueryEngine 依赖 queryLoop；queryLoop 通过 `QueryDeps` 依赖模型调用和 compact 能力；queryLoop 使用 Tool contract 和 ToolUseContext 调用工具；工具执行再回调 permission pipeline、hooks、MCP client、session/context。[C-007][C-008][C-009][C-010][C-012]\n\n这种方向让模型 loop 不直接知道每一种 UI、插件或远程通道细节，只关心 messages、tools、permissions、events 和 state。\n\n## 4. 核心架构判断\n\n- 架构中心是 conversation runtime，而不是 UI。\n- Tool 是系统内最重要的扩展协议对象。\n- 权限不是工具的附属方法，而是跨 hooks、UI、remote、classifier 的决策流水线。\n- session transcript 是长期状态基础设施，不只是日志。\n- MCP、Plugin、Skill 被统一到 tool/command/resource 语义，是扩展面收敛的关键。\n"},{"file":"runtime-flows.md","label":"运行流程","content":"# 运行流程\n\n## Flow 1: CLI 启动到运行模式选择\n\n1. `main()` 首先设置 Windows `NoDefaultCurrentDirectoryInExePath=1`，降低命令执行时从当前目录解析可执行文件的风险。[C-003]\n2. 注册早期 warning handler 和 SIGINT 行为。[C-003]\n3. 如果命中 direct-connect URL、deep link、assistant command、SSH command，会在 Commander 前重写 argv 或进入专门流程。[C-003]\n4. 通过 `-p`、`--init-only`、`--sdk-url`、TTY 状态判断是否 non-interactive，并设置 interactive flag 和 client type。[C-003]\n5. `run()` 创建 Commander program，在 `preAction` 中等待 MDM/keychain prefetch、`init()`、process title、sinks、inline plugins、settings/policy sync 等初始化动作。[C-004]\n6. default command 注册 `--print`、`--bare`、output/input format、permission、tools、MCP、system prompt、resume/continue、model、add-dir、ide、session、plugin-dir 等 options。[C-004]\n\n## Flow 2: 交互式 REPL 发起一个 turn\n\n1. `setup()` 检查 Node 版本、custom session、UDS messaging、terminal restore，并在 cwd-dependent 代码前调用 `setCwd(cwd)`。[C-005]\n2. `renderAndRun()` 渲染 React/Ink root，执行 onboarding、workspace trust、GrowthBook reset/init、system context prefetch、MCP approvals、API key 和 bypass permission dialog。[C-005]\n3. `replLauncher.tsx` 动态加载 `App` 和 `REPL`。[C-006]\n4. `REPL` 在发起 query 前读取最新 store state，调用 `assembleToolPool(state.toolPermissionContext, state.mcp.tools)`，并合并/filter tools、agent tools。[C-006]\n5. `REPL` 并行加载 default system prompt、user context、system context，构造 effective system prompt，然后 `for await` 消费 `query(...)` 事件。[C-006]\n\n```mermaid\nsequenceDiagram\n  participant User\n  participant REPL\n  participant Query\n  participant Model\n  participant Tools\n  User-\u003e\u003eREPL: 输入消息\n  REPL-\u003e\u003eREPL: 组装 tools/context/system prompt\n  REPL-\u003e\u003eQuery: query(...)\n  Query-\u003e\u003eModel: streaming request\n  Model--\u003e\u003eQuery: assistant/tool_use chunks\n  Query-\u003e\u003eTools: run tool calls\n  Tools--\u003e\u003eQuery: tool results\n  Query--\u003e\u003eREPL: streaming events\n  REPL--\u003e\u003eUser: 渲染输出\n```\n\n## Flow 3: `QueryEngine.submitMessage()` 到 `queryLoop`\n\n1. `submitMessage()` 清理 discovered skills，设置 cwd，并持久化 session。[C-007]\n2. 它包装 `canUseTool`，用于记录 permission denials。[C-007]\n3. 调用 `query(...)`，传入 messages、system/user/system context、tool context、fallback、query source、max turns、task budget 等。[C-007]\n4. `query()` 委托给 `queryLoop`，并跟踪 command lifecycle 消耗。[C-008]\n5. `queryLoop` 初始化 budget tracker 和 state，启动 memory prefetch 与 skill discovery prefetch，并发出 `stream_request_start`。[C-008]\n6. loop 中追加 system context，必要时 auto-compact，随后调用模型 streaming。[C-008]\n7. 如果产生 tool use，进入 tool execution path；如果模型失败，根据 fallback/retry/error 规则产出事件。[C-008]\n8. turn 结束后，`QueryEngine` 记录 transcript、compact boundary、assistant/user messages，并产出最终结果。[C-007]\n\n## Flow 4: Tool 调用和权限决策\n\n1. `runToolUse` 在当前 tool pool 中查找 tool，支持 alias fallback；找不到时返回 tool use error。[C-010]\n2. 执行 input zod validation 和 tool-specific validation。[C-010]\n3. 启动 speculative Bash classifier，同时运行 hooks/dialog 相关流程。[C-010]\n4. PreToolUse hooks 可以修改 messages、permission、input、prevent、stop 或增加 context。[C-010]\n5. permission decision 可能来自已有规则、hook、用户交互、coordinator、swarm worker、bridge callback、classifier 等。[C-010]\n6. deny path 返回 tool result，并可能运行 PermissionDenied hooks；allow path 记录 telemetry/span/activity，调用 `tool.call(...)`。[C-010]\n7. `runTools` 会把连续 concurrency-safe tool calls 分组并发执行；非只读或不安全工具保持串行，batch 结束后再应用 context modifier。[C-010]\n\n## Flow 5: MCP tool discovery 和调用\n\n1. MCP service 读取所有配置，区分 disabled/active、本地/远程和 auth 状态。[C-012]\n2. 对 active clients 并行连接，抓取 tools、commands、skills、resources。[C-012]\n3. MCP tool 被包装为 Claude Code `Tool`，保留 schema、description、权限提示、readOnly/concurrency/destructive/openWorld hints。[C-012]\n4. 调用 MCP tool 时会确保 client 已连接，执行 timeout race，并对长运行请求每 30 秒记录日志。[C-012]\n\n## Flow 6: Session 和 transcript\n\n1. `getSessionId` 和 `switchSession` 维护 session identity、parent session 和 project dir。[C-013]\n2. transcript path 位于 Claude config home 的 project dir 下，并使用 sessionProjectDir 保持当前 session 路径。[C-013]\n3. `appendEntry` 会在 transcript materialized 前 buffer，写入 metadata，处理 sidechain agent transcript 和 remote persistence。[C-013]\n4. `recordTranscript` 清理 messages，按 UUID 去重，同时保留 parent chain。[C-013]\n\n## Flow 7: Bridge / Remote / Direct-Connect\n\nBridge:\n\n1. `runBridgeLoop` 维护 active sessions、session tokens、timers、worktree、heartbeat、status display 和 cleanup。[C-015]\n2. `createSessionSpawner` 启动 child CLI，参数包含 `--print --sdk-url --session-id --input-format stream-json --output-format stream-json --replay-user-messages`。[C-015]\n3. child stdout 按 NDJSON 解析 activity、control_request 和 first user message；permission request 会转交 bridge callback。[C-015]\n\nRemote:\n\n1. `RemoteSessionManager` 通过 WebSocket 接收 SDK/control messages，通过 HTTP POST 发送用户消息。[C-015]\n2. permission request 放入 pending map，响应后通过 WebSocket 发送 control response。[C-015]\n\nDirect-connect:\n\n1. `createDirectConnectSession` POST `/sessions`，获取 session id、ws url 和 work dir。[C-015]\n2. `DirectConnectSessionManager` 连接 WebSocket，转发 SDK messages，处理 `control_request can_use_tool`，并用 stream-json 格式发送用户消息。[C-015]\n"},{"file":"key-abstractions.md","label":"核心抽象","content":"# 核心抽象\n\n## 1. `QueryEngine`\n\n`QueryEngine` 是一次 conversation 的状态拥有者。它的配置包含 cwd、tools、commands、MCP clients、agents、permission callback、AppState getter/setter、initial messages、read cache、prompts、model、fallback、thinking、max turns、budget、schema、SDK status、abort controller 等。[C-007]\n\n关键职责：\n\n- 为每个 `submitMessage()` 创建新的 turn。\n- 在 turn 开始时设置 cwd、持久化 session、包装 permission callback。\n- 调用 `query(...)` 并消费 streaming events。\n- 记录 assistant/user/compact boundary 和 transcript。\n- 聚合最终结果、usage、cost、duration、turn count、stop reason、permission denials 等。[C-007]\n\n设计含义：会话级状态集中在一个对象里，turn 内细节交给 `queryLoop`，避免 UI 或 CLI 直接承担模型循环状态。\n\n## 2. `queryLoop`\n\n`queryLoop` 是 turn 内编排器。它接收不可变入参和可变 `State`，启动 budget tracker、memory prefetch、skill discovery prefetch，追加 system context，判断 auto-compact，调用模型 streaming，执行工具，处理 fallback/retry/error，并在每一轮刷新 tools。[C-008]\n\n它的重要边界：\n\n- 模型调用通过 `QueryDeps` 注入，便于隔离 production deps 和测试 deps。[C-014]\n- compact、microcompact、fallback、tool execution、hook stop、abort、queued command、attachments 都在 loop 中被串起来。[C-008]\n- tool result 和 tool summary 可以流式返回，主 loop 继续控制下一轮模型调用。[C-008]\n\n## 3. `Tool`\n\n`Tool` 不是简单函数。它是一个协议对象，包含：\n\n- identity：`name`、`aliases`、`userFacingName`\n- model exposure：`description`、`prompt`、`inputSchema`、`inputJSONSchema`\n- execution：`call`、`validateInput`、`maxResultSize`\n- permission：`checkPermissions`、`isReadOnly`、`isDestructive`、`needsPermissions`\n- scheduling：`isConcurrencySafe`\n- UI/render：`renderToolUseMessage`、`renderResultForAssistant`、`renderToolResultMessage`\n- integration hints：MCP、LSP、open-world、search、interrupt、defer、strict 等[C-009]\n\n`buildTool` 为未声明的属性提供默认值，其中并发、只读、破坏性等默认偏保守。[C-009]\n\n## 4. `ToolUseContext`\n\n`ToolUseContext` 是工具执行所需的运行时上下文，覆盖 commands、model、tools、MCP clients/resources、non-interactive、agents、budgets、prompts、query source、refreshTools、abort controller、read file state、AppState、elicitation、UI callbacks、notifications、nested memory/skills、SDK status、agent id/type、messages 和限制信息等。[C-009]\n\n设计含义：工具调用不直接从全局对象捞状态，而是通过一个显式 context 获得能力和边界。\n\n## 5. `ToolPermissionContext`\n\n`ToolPermissionContext` 记录权限模式、额外目录、allow/deny/ask rules、bypass、auto-mode、危险规则剥离、是否避免 prompts、自动检查等待策略、pre-plan mode 等。[C-009]\n\n它是 “策略输入”，而不是 “决策结果”。实际决策由 `hasPermissionsToUseTool`、hooks、interactive handler、bridge/remote callbacks 和 classifier 共同完成。[C-010]\n\n## 6. Command And Skill\n\n`commands.ts` 维护内置命令、remote safe command、bridge safe command、availability requirement、dynamic skill commands 和 slash command tool skills。[C-011] `getSkills` 与 `loadSkillsDir` 从 managed/user/project/additional dirs、plugin skills 和 bundled skills 中加载 Skill，并支持 bare 模式下只加载显式 add-dir。[C-011]\n\n设计含义：Skill 被视为 command/tool prompt 资产的一部分，而不是单独的“文档目录”。\n\n## 7. Plugin\n\nplugin loader 负责从 marketplace 和 session-only dirs 发现、加载、校验 plugin；plugin 可以提供 `plugin.json`、commands、agents、hooks 等结构，并处理 manifest validation、duplicate name、enable/disable state 和 error collection。[C-011]\n\nplugin command loader 会把 markdown frontmatter 转成 Command，支持 allowed tools、argument hint/names、when_to_use、version、model、effort、shell、plugin variables、user config、`CLAUDE_SKILL_DIR` 和 `SESSION_ID` 替换。[C-011]\n\n## 8. MCP Tool\n\nMCP client discovery 会连接本地/远程 MCP server，抓取 tools、commands、skills、resources，并把 MCP tool 映射为 Claude Code 的 `Tool` contract。映射时保留 description、schema、readOnly/concurrency/destructive/openWorld hints、permission passthrough、progress 和 timeout。[C-012]\n\n设计含义：MCP 是外部能力来源，但进入 runtime 后仍受统一 Tool 和 permission 语义约束。\n\n## 9. Session And Transcript\n\n`bootstrap/state.ts` 提供 session id、parent session、project dir 和 project root 管理。[C-013] `sessionStorage.ts` 将 transcript 放在 Claude config home 的 project dir 下，支持 append buffering、metadata entries、UUID dedup、sidechain transcript 和 remote persistence。[C-013]\n\n设计含义：session 是 conversation identity，transcript 是可恢复、可同步、可去重的事实记录。\n\n## 10. Remote Session Managers\n\nbridge 使用 child process 跑 headless CLI，并通过 stdin/stdout NDJSON、access token、permission request 和 activity extraction 与外部环境协作。[C-015] `RemoteSessionManager` 通过 WebSocket 接收 CCR 消息、HTTP POST 发送用户消息，并维护 pending permission requests。[C-015] direct-connect manager 则连接 server WebSocket，转发 SDK messages 和 permission control request。[C-015]\n\n这三类通道都复用结构化消息和权限请求，而不是绕开主 runtime。\n"},{"file":"extension-points.md","label":"扩展点","content":"# 扩展点\n\n## 1. Slash Commands\n\n`commands.ts` 维护内置命令、availability requirement、remote safe command 和 bridge safe command，并从 skills、plugins、workflow、commands 等来源并行加载命令。[C-011]\n\n关键机制：\n\n- `loadAllCommands` 并行加载不同命令来源。\n- `getCommands` 根据 availability 和 enabled 状态过滤。\n- bridge safe command 会允许 prompt command、阻止 local-jsx，并只放行 allowlist 本地命令。[C-011]\n\n适合学习的点：命令扩展不只需要注册表，还需要按运行环境声明哪些命令可见、可调用、可远程调用。\n\n## 2. Skills\n\nSkill 来源包括 managed、user、project、additional dirs、legacy commands、plugin skills、bundled skills 等。[C-011] `loadSkillsDir` 会并行加载、按文件 identity 去重，并把 conditional skills 留给后续激活。[C-011]\n\nSkill 在 Claude Code 中更接近“可触发的能力说明和 prompt 资产”，最终会进入 command/tool 生态，而不是独立于 runtime 的说明文件。\n\n## 3. Plugins\n\nplugin loader 支持 marketplace 和 session-only dirs，校验 manifest，处理 hooks config、重复名称、enable/disable state 和错误收集。[C-011]\n\nplugin command 支持：\n\n- markdown frontmatter 转 Command。\n- allowed tools、argument hint/names、when_to_use、version、name、model、effort、disable、userInvocable、shell。\n- args、plugin variables、user config、`CLAUDE_SKILL_DIR`、`SESSION_ID` 替换。\n- 通过 allowed tool context 执行 shell command。[C-011]\n\nplugin schema 对 marketplace name 有保留名、冒充阻断、非 ASCII 限制和 official GitHub org validation。[C-011]\n\n## 4. MCP\n\nMCP 是最完整的外部能力接入面。`getMcpToolsCommandsAndResources` 会加载所有 MCP configs，区分 disabled/active、本地/远程、auth needs、连接、tools/commands/skills/resources，并用不同并发限制处理本地与远程连接。[C-012]\n\nMCP tool 会被包装成 Claude Code `Tool`：\n\n- schema 和 description 被清洗后暴露给模型。\n- readOnly、concurrency、destructive、openWorld hints 会影响工具语义。\n- permission passthrough 需要显式 allow rule。\n- call path 支持 progress、timeout 和 elicitation retry。[C-012]\n\n## 5. Hooks And Permission Requests\n\ntool execution 在真正调用工具前运行 PreToolUse hooks；hook 可以修改 messages、permission、input，也可以 prevent、stop 或添加 context。[C-010] permission context 又支持 hook allow、user allow、deny abort、decision persistence 和日志。[C-010]\n\n交互式 permission handler 会同时协调 hook、classifier、用户弹窗、bridge callback 等来源，并用 resolve-once 防止重复决策。[C-010]\n\n## 6. Model/API Providers\n\n`getAnthropicClient` 支持 Direct API、Bedrock、Foundry、Vertex 等环境变量路径，并设置 session、container、remote、client app 等默认 headers。[C-014] query layer 通过 `QueryDeps` 注入模型调用函数，核心 loop 不直接绑定到某个客户端构造细节。[C-014]\n\n## 7. Remote And Bridge Channels\n\nbridge 通过 `createSessionSpawner` 启动 child CLI，传入 `--print --sdk-url --session-id --input-format stream-json --output-format stream-json`，并使用 stdout NDJSON 解析 activity 和 permission request。[C-015]\n\nremote session 使用 WebSocket 订阅消息，HTTP POST 发送用户消息，pending map 管理 permission request/response。[C-015]\n\ndirect-connect manager 使用 WebSocket 收消息，把 `control_request can_use_tool` 转成 permission callback，把 SDK messages 转发给上层，并用 `stream-json` 格式发送用户消息。[C-015]\n\n## 8. 扩展边界总结\n\nClaude Code 的扩展机制不是“一切都是 plugin”。它把扩展拆成多种 contract：\n\n- 用户命令：Command\n- 能力说明：Skill\n- 外部能力源：MCP\n- 工具执行单元：Tool\n- 权限前置控制：Hook/PermissionRequest\n- 远程会话：structured message protocol\n\n这种拆分让每类扩展可以有自己的安全边界和加载策略，同时在 query runtime 内统一成工具、命令、消息和权限事件。\n"},{"file":"design-philosophy.md","label":"设计思想","content":"# 设计思想\n\n## 1. 模式先行，入口归一\n\n官方文档把 Claude Code 描述为跨 terminal、IDE、desktop、browser 等界面的 agentic coding tool；本地 source snapshot 中，`main()` 在 Commander 之前处理 direct-connect、deep link、assistant、SSH、headless、interactive、client type 等入口差异。[C-003][EXT-CC-001] 这说明 snapshot 倾向把运行模式差异集中在入口层消化，让后面的 query runtime 面对统一的消息、工具和 session 语义。\n\n取舍：入口层会变复杂，但核心 loop 更少被 argv、TTY、远程协议污染。\n\n## 2. Trust 和环境边界前置\n\n`setup()` 与 `renderAndRun()` 把 cwd、terminal、workspace trust、API key、MCP approvals、telemetry、bypass dialog 等放在 REPL 和 query 之前。[C-005] 这体现出一个明确思想：Agent 不是等到工具即将执行时才考虑安全边界，而是在运行上下文建立阶段先决定“这个工作区和当前模式可不可信”。\n\n取舍：启动路径更长，但安全状态更稳定。\n\n## 3. 会话状态和 turn 编排分离\n\n`QueryEngine` 拥有 conversation 级状态，`queryLoop` 负责 turn 内模型、工具、compact、fallback 和 events。[C-007][C-008] 这是一种很适合复杂 Agent 的分工：会话身份、transcript 和 UI 状态不被塞进模型 loop；模型 loop 也不需要管理所有长期状态。\n\n取舍：对象之间传参多，需要清晰的 context contract。\n\n## 4. Tool 是协议对象，不是回调函数\n\n`Tool` contract 包含 schema、权限、并发、只读、破坏性、渲染、MCP、LSP、defer、strict、matcher、prompt 等语义。[C-009] 这说明系统把工具看成“给模型、UI、权限系统、调度器共同消费的协议对象”。\n\n取舍：定义一个 tool 的成本更高，但后续可以被模型、权限、UI、MCP、并发调度统一处理。\n\n## 5. 权限是流水线，不是单点判断\n\n官方 permissions/hooks 文档描述了 rules、modes、PreToolUse、PermissionRequest 等权限控制面；源码里的 tool execution 会依次经过 validation、hooks、permission decision、interactive handler、bridge/remote callback、classifier 和 telemetry。[C-010][EXT-CC-003] Permission context 也有 resolve-once、防重复决策、更新规则和日志记录。[C-010]\n\n取舍：流程长，但可以兼容本地交互、远程会话、自动模式和 hook policy。\n\n## 6. 扩展面分层，而不是全部塞进 plugin\n\nClaude Code 同时存在 Command、Skill、Plugin、MCP、Hook、remote control request 等扩展面。[C-011][C-012][C-015] 这些扩展最终会映射到工具、命令、资源、消息或权限请求，但加载和安全策略不同。\n\n取舍：学习成本更高，但每类扩展可以有更贴近自身风险的边界。\n\n## 7. Prompt-cache 和工具顺序也是架构约束\n\n`tools.ts` 是 built-in tool 的 source of truth，并显式关注 prompt-cache 同步和工具排序稳定性；tool pool 会按 built-in/MCP 等分区稳定排序。[C-009] 这说明 Claude Code 把模型提示的稳定性当成工程约束，而不是后期微调。\n\n取舍：工具注册顺序不能随意漂移，扩展加载需要更细的去重和排序规则。\n\n## 8. 上下文是快照，不是随用随读\n\n`context.ts` 对 git status、CLAUDE.md、当前日期等做 memoization，并限制 git status 文本长度。[C-014] REPL 在 query 前并行加载 system/user context。[C-006]\n\n取舍：减少重复 IO 和 token 波动，但需要清楚缓存何时失效。\n\n## 9. 远程通道复用结构化消息\n\nbridge child CLI、remote CCR session 和 direct-connect 都围绕 stream-json、SDK messages、control_request、permission response 组织。[C-015] 这让本地和远程会话可以共享较多 runtime 语义。\n\n取舍：协议层更重，但 permission、activity、message forwarding 更一致。\n\n## 10. 失败隔离优先于“全链路强一致”\n\n源码中可以看到 settings/policy sync、remote server settings、tool summary、hook、MCP connect、remote persistence 等多处非主流程能力被异步、缓存、重试或 fail-open/fail-soft 处理。[C-004][C-008][C-010][C-012][C-013]\n\n取舍：体验更不容易被外围能力拖垮，但需要日志和 evidence 才能排查边缘问题。\n"},{"file":"comparison.md","label":"横向对比","content":"# 横向对比\n\n## 1. 对照对象\n\n本文件把 Claude Code 与本项目已调研的 Hermes Agent、OpenClaw，以及常见 Agent CLI 设计做架构维度对照。Claude Code 结论均来自本轮证据；其他项目仅作为理解参照，不作为 Claude Code 的事实来源。\n\n## 2. 架构定位\n\n| 维度 | Claude Code | Hermes Agent | OpenClaw | 常见 Agent CLI |\n|---|---|---|---|---|\n| 核心定位 | 终端/SDK/远程会话统一的 coding agent runtime | 本地优先、多入口 Agent runtime 与 gateway | Skill/workflow/角色协作平台 | 单 CLI 或简单 chat loop |\n| 入口复杂度 | 高，`main()` 负责多模式路由和大量子命令[C-003][C-004] | 高，CLI/TUI/Gateway/ACP/cron 多入口 | 高，Skill/任务/通知/工作流多入口 | 通常中低 |\n| 核心运行对象 | `QueryEngine` + `queryLoop`[C-007][C-008] | `AIAgent` + conversation loop | Skill runtime/workflow/session | 一个 loop 或 service |\n| 工具抽象 | `Tool` contract 极厚，含权限、渲染、并发、MCP 等[C-009] | ToolRegistry + model tool schema | Skill 工具与平台服务 | function/tool call wrapper |\n| 权限模型 | 独立 permission pipeline，支持 hooks、UI、bridge、remote[C-010] | 审批/hook/toolset 组合 | 运行态权限与平台安全约束 | 多为 allowlist 或简单确认 |\n| 扩展机制 | Command/Skill/Plugin/MCP/Hook 分层[C-011][C-012] | Plugin/Provider/Memory/Gateway Platform 分层 | Skills/workflows/platform APIs | plugin 或 config |\n| 会话状态 | session id、transcript、sidechain、remote persistence[C-013] | session store/memory/gateway session | 会话上下文和任务记录 | history file 或内存 |\n| 远程会话 | bridge、remote CCR、direct-connect[C-015] | gateway/ACP/TUI bridge | OpenClaw 平台会话/通知 | 通常弱或没有 |\n\n## 3. Claude Code 的突出点\n\n### Tool contract 语义最厚\n\nHermes Agent 的工具系统偏 registry-first；Claude Code 则把更多调度、权限、渲染、MCP 和 UI 提示语义放进 `Tool` contract。[C-009] 这让一个工具可以同时服务模型、权限系统、UI 和远程通道。\n\n### 权限流水线最细\n\nClaude Code 的权限不是只在 registry 层判断，而是在 tool execution path 中串起 validation、hooks、interactive handler、classifier、bridge/remote callbacks 和 decision persistence。[C-010] 对 coding agent 来说，这种结构更适合处理读写文件、执行命令、Web/MCP 等高风险能力。\n\n### 远程和本地复用消息语义\n\nbridge 使用 child CLI + stream-json，remote session 使用 WebSocket + HTTP POST，direct-connect 使用 WebSocket + stream-json；三者都显式处理 SDK messages 和 permission control request。[C-015] 这比单纯把远程当成 HTTP API 更接近“远程化同一个 runtime”。\n\n### Prompt-cache 稳定性被前置\n\ntool pool 组装中显式考虑 source of truth、deny filter、simple mode、dedup 和稳定排序。[C-009] 这说明模型上下文成本和稳定性直接影响架构设计。\n\n## 4. Claude Code 的复杂度成本\n\n- `main.tsx` 非常大，入口、命令、模式和子命令都集中在一个文件，阅读门槛高。[C-003][C-004]\n- `Tool` contract 功能丰富，学习成本高；新增工具需要理解 schema、permission、rendering、concurrency 等多个维度。[C-009]\n- permission path 横跨 tool execution、hooks、React hook、permission context、interactive handler、bridge/remote callback，调试时需要按链路追踪。[C-010]\n- direct-connect server-side 文件在当前快照中不完整，部分能力只能确认入口引用和 client-side 行为。[C-004][C-015]\n\n## 5. 学习优先级\n\n1. 先学 `QueryEngine` 和 `queryLoop` 的会话/turn 分工。\n2. 再学 `Tool` contract 如何让模型、权限、UI 和调度共享语义。\n3. 再学 permission pipeline 如何兼容本地、远程和自动模式。\n4. 最后学 Skills/Plugins/MCP 如何分别进入 command/tool/resource 语义。\n"},{"file":"adoption-notes.md","label":"学习借鉴","content":"# 学习借鉴笔记\n\n## 1. 最值得学习的设计\n\n### 会话对象与 turn loop 分离\n\n`QueryEngine` 管会话级状态，`queryLoop` 管单个 turn 的模型/工具编排。[C-007][C-008] 这个分工适合学习复杂 Agent 如何避免 UI、session、模型循环互相缠绕。\n\n学习重点：\n\n- 会话 identity、transcript、read cache、permission denials 应放在会话对象。\n- 模型调用、工具调用、compact、fallback 应放在 turn loop。\n- 二者之间通过明确的 config/context/event 协议协作。\n\n### Tool contract 承载多方语义\n\n`Tool` 同时服务模型 schema、权限、并发、UI 渲染、MCP、LSP 和结果大小控制。[C-009] 这比单纯 `function call` 更适合复杂工具生态。\n\n学习重点：\n\n- 工具定义时就声明读写风险、并发安全、展示方式和权限策略。\n- 工具池组装时做 deny filter、feature gate、去重和稳定排序。\n- 外部工具进入系统后也转成统一 Tool 语义。\n\n### 权限决策流水线\n\ntool execution 先 validation，再 hooks，再 permission decision，再执行。[C-010] 交互、远程 callback、classifier、hook 都是可组合的决策来源。\n\n学习重点：\n\n- permission decision 应记录来源和结果。\n- 用户交互与远程 permission request 都需要 resolve-once。\n- deny path 也要返回结构化结果，便于模型理解下一步。\n\n### 上下文快照与缓存\n\n`context.ts` 对 git status、CLAUDE.md、current date 做 memoization，REPL 在 query 前并行加载上下文。[C-006][C-014]\n\n学习重点：\n\n- 上下文生成需要可控长度和缓存策略。\n- query 前统一构造 effective system prompt，减少 turn 内随机 IO。\n\n### 扩展面分层\n\nCommand、Skill、Plugin、MCP、Hook、remote control request 各自有 contract，再统一进入 command/tool/message/permission 语义。[C-011][C-012][C-015]\n\n学习重点：\n\n- 不同风险等级的扩展不必强塞进同一种 plugin。\n- 外部能力源进入 runtime 后应统一受工具池和权限系统约束。\n\n## 2. 需要谨慎学习的设计\n\n- 大型入口文件可以集中模式路由，但也会提高阅读成本；适合先学“前置归一”的思想，不必照搬文件组织。[C-003][C-004]\n- 厚 Tool contract 能力强，但需要完整工具生态支撑；小项目可以先学 schema、permission、readOnly、concurrency 四个核心维度。[C-009]\n- 远程/bridge/direct-connect 协议很有参考价值，但涉及认证、session、WebSocket、permission callback 和 child process 管理，应先理解消息语义，再看实现细节。[C-015]\n- plugin marketplace name 的安全校验值得学习，但它依赖特定发布和信任模型。[C-011]\n\n## 3. 不宜直接套用的部分\n\n- 非官方 snapshot 中不完整的 server-side direct-connect 实现不能作为完整设计依据。[C-004][C-015]\n- 与 Anthropic/Claude 平台强绑定的 API header、OAuth、remote CCR、GrowthBook、policy sync 等不宜脱离生态单独使用。[C-004][C-014][C-015]\n- React/Ink 编译后形态较重，学习 UI 状态流即可，不必把组件实现细节作为通用范式。\n\n## 4. 后续可继续深挖的问题\n\n- `src/services/api/claude.ts` 中 streaming、fallback、token limit、error taxonomy 的完整细节。\n- Bash、Edit、Read、Write、Agent、Skill 等代表性 built-in tool 的实现差异。\n- Plugin hook 与 MCP permission passthrough 在复杂组合下的优先级。\n- transcript 与 remote persistence 在异常中断时的恢复行为。\n- prompt-cache 稳定排序对工具扩展的实际影响。\n"},{"file":"evidence-index.md","label":"证据索引","content":"# 证据索引\n\n## 1. 版本信息\n\n本文件也可以理解为 Evidence Log，用于约束关键结论必须有证据。\n\n| 项 | 内容 |\n|---|---|\n| 代码来源 | `https://github.com/jarmuine/claude-code.git` |\n| 本地路径 | `/Users/cheng/IdeaProjects/claude-code` |\n| branch/tag/commit | branch `main`, commit `4b9d30f7953273e567a18eb819f4eddd45fcc877` |\n| 调研日期 | 2026-05-25 |\n| 本轮方法 | 静态源码和仓库文档分析 |\n\n## 2. 证据索引\n\n| 编号 | 结论 | 证据类型 | 位置 | 置信度 | 备注 |\n|---|---|---|---|---|---|\n| \u003ca id=\"C-001\"\u003e\u003c/a\u003eC-001 | 仓库 README 声明这是 Claude Code source snapshot for security research，不是 Anthropic 官方 repo；快照来自 npm distribution 中公开可访问的 source map；README 描述 CLI 用途、公开日期、技术栈和大致规模 | doc fact | `/Users/cheng/IdeaProjects/claude-code/README.md:1-3`, `README.md:23-35`, `README.md:41-49`, `README.md:55-94` | 高 | 快照定位 |\n| \u003ca id=\"C-002\"\u003e\u003c/a\u003eC-002 | 本地快照为 branch `main`、commit `4b9d30f7953273e567a18eb819f4eddd45fcc877`、remote `https://github.com/jarmuine/claude-code.git`，`src` 约 1902 个文件 | source fact | `git -C /Users/cheng/IdeaProjects/claude-code rev-parse HEAD`, `git -C /Users/cheng/IdeaProjects/claude-code remote get-url origin`, `rg --files /Users/cheng/IdeaProjects/claude-code/src \\| wc -l` | 高 | 命令证据 |\n| \u003ca id=\"C-003\"\u003e\u003c/a\u003eC-003 | `main()` 在 Commander 前处 a\u003eINF-002 | C-009, C-010, C-012 | Tool contract 是内置工具、MCP 工具和权限系统的共同协议层 | 抽样一个 built-in tool 与一个 MCP tool 对比实际 prompt/schema |\n| \u003ca id=\"INF-003\"\u003e\u003c/a\u003eINF-003 | C-011, C-012, C-015 | Skills、Plugins、MCP、remote control request 被分成不同扩展 contract，最终映射到 command/tool/message/permission | 动态加载一个 plugin skill，观察 command/tool pool 变化 |\n| \u003ca id=\"INF-004\"\u003e\u003c/a\u003eINF-004 | C-013, C-015 | transcript 与 remote persistence 是跨本地/远程会话一致性的基础 | 中断 headless session 后检查 transcript 和 remote event 状态 |\n\n## 4. 待确认\n\n- 本地依赖和构建脚本完整性。\n- `src/services/api/claude.ts` 中 streaming/fallback/error taxonomy 的完整细节。\n- direct-connect server-side 内部实现，因为当前快照缺少部分被入口引用的 server files。\n- 各 built-in tool 的具体权限策略和异常处理差异。\n\n## 5. 外部资料证据补充\n\n| 结论编号 | 结论 | 证据类型 | 可信度等级 | 来源 | 是否已源码验证 | 置信度 | 备注 |\n|---|---|---|---|---|---|---|---|\n| \u003ca id=\"EXT-CC-001\"\u003e\u003c/a\u003eEXT-CC-001 | 官方文档将 Claude Code 定位为可在 terminal、IDE、desktop、browser 等界面使用的 agentic coding tool | 官方事实 | A | https://code.claude.com/docs/en/overview, https://code.claude.com/docs/en/how-claude-code-works | 部分 | 高 | 本地 snapshot 只验证 CLI/REPL/headless/remote/bridge/direct-connect client pieces |\n| \u003ca id=\"EXT-CC-002\"\u003e\u003c/a\u003eEXT-CC-002 | 官方文档描述 agentic loop：收集上下文、采取行动、验证结果，工具结果反馈下一步决策 | 官方事实 | A | https://code.claude.com/docs/en/how-claude-code-works | 是 | 高 | 对应 `C-006`-`C-010`, `C-013` |\n| \u003ca id=\"EXT-CC-003\"\u003e\u003c/a\u003eEXT-CC-003 | 官方权限文档说明 permission rules、modes、deny/ask/allow 优先级和 hooks 共同影响工具授权 | 官方事实 | A | https://code.claude.com/docs/en/permissions, https://code.claude.com/docs/en/hooks | 是 | 高 | 对应 `C-009`, `C-010` |\n| \u003ca id=\"EXT-CC-004\"\u003e\u003c/a\u003eEXT-CC-004 | 官方文档将 MCP、Skills、Hooks 作为不同扩展层：外部工具连接、按需知识/流程、生命周期自动化 | 官方事实 | A | https://code.claude.com/docs/en/mcp, https://code.claude.com/docs/en/skills, https://code.claude.com/docs/en/hooks | 是 | 高 | 对应 `C-010`, `C-011`, `C-012` |\n| \u003ca id=\"EXT-CC-005\"\u003e\u003c/a\u003eEXT-CC-005 | 官方文档说明 sessions 写入本地 JSONL 并用于 resume/fork/rewind 等语义 | 官方事实 | A | https://code.claude.com/docs/en/how-claude-code-works | 是 | 高 | 对应 `C-013`, `INF-004` |\n"},{"file":"research-review.md","label":"调研审查","content":"# 调研审查\n\n## 1. 覆盖检查\n\n| 项 | 状态 | 说明 |\n|---|---|---|\n| 版本信息 | 已覆盖 | 本地路径、remote、branch、commit 和调研日期已记录。[C-002] |\n| 快照属性 | 已覆盖 | README 明确这是非官方 security research snapshot。[C-001] |\n| 外部资料 | 已覆盖 | external-research.md 已覆盖 Claude Code 官方 overview/how-it-works/permissions/MCP/skills/hooks 文档。 |\n| 研究问题 | 已覆盖 | research-questions.md 已记录 RQ-CC-001 到 RQ-CC-005，并区分官方当前行为和本地 snapshot。 |\n| Source inventory | 已覆盖 | references/source-inventory.json 已生成，覆盖 1915 个文件。 |\n| Dashboard | 已覆盖 | dashboard.html 已生成阅读入口。 |\n| Source map | 已覆盖 | 已整理入口、核心模块、扩展模块、状态和远程通道。 |\n| 主运行流 | 已覆盖 | CLI 启动、REPL turn、QueryEngine、queryLoop、tool execution、MCP、session、remote flows 已追踪。 |\n| 可视化架构图 | 已覆盖 | visual/architecture.html 负责渲染，visual/architecture.visual.js 承接图数据与证据链接；visual/evidence.html 提供可点击证据查看。 |\n| 核心抽象 | 已覆盖 | QueryEngine、queryLoop、Tool、ToolUseContext、PermissionContext、Command、Skill、Plugin、MCP、Session。 |\n| 扩展点 | 已覆盖 | Commands、Skills、Plugins、MCP、Hooks、Model/API providers、Remote/Bridge。 |\n| 设计思想 | 已覆盖 | 模式归一、trust 前置、Tool 协议、权限流水线、扩展分层、prompt-cache 稳定性。 |\n| 证据索引 | 已覆盖 | 15 条本地证据、5 条外部资料证据、4 条推断链路。 |\n| 自动校验 | 已覆盖 | `validate-research.js research/claude-code` 已通过。 |\n| 运行验证 | 未覆盖 | 本轮未启动 CLI、未跑测试、未访问模型 API。 |\n\n## 2. 置信度\n\n高置信度：\n\n- 仓库属性和 snapshot 定位来自 README。[C-001]\n- CLI 入口、命令面、setup/trust、REPL、QueryEngine、queryLoop、Tool、permissions、MCP、session 和 remote 通道均有明确源码证据。[C-003]-[C-015]\n\n中置信度：\n\n- “多入口收敛到同一 conversation runtime” 是由入口、REPL、SDK、bridge、remote 和 query 层共同推断得出，仍需要运行样例验证。[INF-001]\n- “Tool contract 是共同协议层” 源码证据充分，但不同 tool 的具体行为仍需抽样。[INF-002]\n\n低置信度或未确认：\n\n- direct-connect server-side 内部机制，因为当前快照缺少部分被入口引用的文件。[C-004][C-015]\n- 真实 Anthropic/Claude 平台侧协议和当前官方行为只能由官方 docs 说明，不能由本地非官方 snapshot 完整证明。\n- 性能、错误恢复、权限交互体验和模型成本表现。\n\n## 3. 质量风险\n\n- 本地仓库有未跟踪 `.gitignore`、`.idea/`、`docs/`，但本轮只读取源码和 README，没有依赖这些未跟踪内容作为结论。\n- `src/main.tsx` 文件很大，入口细节多；本轮抓取的是架构关键段落，非逐行审计。\n- React/Ink 部分源码存在编译器痕迹，本轮没有深入每个 UI component 的渲染状态。\n- 部分结论是静态推断，已经在 `evidence-index.md` 中标记为 INF。\n- 外部资料已补充官方产品语义，但所有源码实现结论仍限定为本地 snapshot。\n\n## 4. 下一步深挖建议\n\n- 抽样 5 个代表性 built-in tools：`Bash`、`Read`、`Edit`、`Write`、`Agent`。\n- 深入 `src/services/api/claude.ts`，补齐模型 streaming、fallback、token limit 和 error taxonomy。\n- 跑一个最小 headless `--print --output-format stream-json` 示例，验证 `QueryEngine`、transcript 和 tool permission 的 live behavior。\n- 抽样一个 plugin command、一个 skill、一个 MCP tool，验证它们进入 tool/command pool 的差异。\n"},{"file":"references/source-inventory.json","label":"源码清单","content":"{\n  \"schemaVersion\": 1,\n  \"generatedAt\": \"2026-05-28T08:08:39.984Z\",\n  \"researchName\": \"claude-code\",\n  \"researchDir\": \"research/claude-code\",\n  \"status\": \"ok\",\n  \"projectRoot\": \"/Users/cheng/IdeaProjects/claude-code\",\n  \"remote\": \"https://github.com/jarmuine/claude-code.git\",\n  \"branch\": \"main\",\n  \"commit\": \"4b9d30f7953273e567a18eb819f4eddd45fcc877\",\n  \"versionHint\": \"branch main, commit 4b9d30f7953273e567a18eb819f4eddd45fcc877\",\n  \"fileCount\": 1915,\n  \"languages\": [\n    {\n      \"language\": \"TypeScript\",\n      \"count\": 1332\n    },\n    {\n      \"language\": \"TypeScript React\",\n      \"count\": 552\n    },\n    {\n      \"language\": \"JavaScript\",\n      \"count\": 18\n    },\n    {\n      \"language\": \"Markdown\",\n      \"count\": 5\n    },\n    {\n      \"language\": \"XML\",\n      \"count\": 4\n    },\n    {\n      \"language\": \"Other\",\n      \"count\": 2\n    },\n    {\n      \"language\": \"DB\",\n      \"count\": 1\n    },\n    {\n      \"language\": \"IML\",\n      \"count\": 1\n    }\n  ],\n  \"topLevel\": [\n    {\n      \"path\": \"src\",\n      \"fileCount\": 1902,\n      \"samples\": [\n        \"src/QueryEngine.ts\",\n        \"src/Task.ts\",\n        \"src/Tool.ts\",\n        \"src/assistant/sess             items.push(lines[i].replace(/^\s*\d+\.\s+/, ''));
            i += 1;

        if (/^>\s?/.test(line)) {
          const quote = [];
          while (i < lines.length && /^>\s?/.test(lines[i])) {
            quote.push(lines[i].replace(/^>\s?/, ''));
            i += 1;
          }
          out.push('<blockquote>' + quote.map(inline).join('<br>') + '</blockquote>');
          continue;
        }
        const para = [];
        while (i < lines.length && lines[i].trim() && !isBlockStart(lines, i)) {
          para.push(lines[i]);
          i += 1;
        }
        out.push('<p>' + inline(para.join(' ')) + '</p>');
      }
      return out.join('\n');
    }

    function isBlockStart(lines, idx) {
      const line = lines[idx] || '';
      return /^\s*\x60\x60\x60/.test(line) || /^(#{1,4})\s+/.test(line) || /^\s*\|/.test(line) || /^\s*[-*]\s+/.test(line) || /^\s*\d+\.\s+/.test(line) || /^>\s?/.test(line);
    }

    function isTableStart(lines, idx) {
      return /^\s*\|/.test(lines[idx] || '') && idx + 1 < lines.length && /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[idx + 1] || '');
    }

    function renderTable(tableLines) {
      const rows = tableLines.filter((_, idx) => idx !== 1).map(splitRow);
      if (!rows.length) return '';
      const header = rows[0].map(cell => '<th>' + inline(cell) + '</th>').join('');
      const body = rows.slice(1).map(row => '<tr>' + row.map(cell => '<td>' + inline(cell) + '</td>').join('') + '</tr>').join('');
      return '<table><thead><tr>' + header + '</tr></thead><tbody>' + body + '</tbody></table>';
    }

    function splitRow(row) {
      let value = row.trim();
      if (value.startsWith('|')) value = value.slice(1);
      if (value.endsWith('|')) value = value.slice(0, -1);
      return value.split('|').map(cell => cell.trim());
    }

    function inline(value) {
      let html = escapeHtml(value);
      html = html.replace(/&lt;a\s+id=&quot;([^&]+)&quot;&gt;&lt;\/a&gt;/g, '<a id="$1"></a>');
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, text, href) => '<a href="' + escapeAttr(rewriteHref(href)) + '">' + escapeHtml(text) + '</a>');
      html = html.replace(/\x60([^\x60]+)\x60/g, '<code>$1</code>');
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      return html;
    }

    function rewriteHref(href) {
      if (/^(https?:|mailto:|#)/.test(href)) return href;
      const hashIndex = href.indexOf('#');
      const hash = hashIndex >= 0 ? href.slice(hashIndex) : '';
      const clean = hashIndex >= 0 ? href.slice(0, hashIndex) : href;
      if (docs.has(clean)) return './docs.html?doc=' + encodeURIComponent(clean) + hash;
      return href;
    }

    function stripAnchorText(value) {
      return value.replace(/<a\s+id="[^"]+"><\/a>/g, '').replace(new RegExp('[#\\x60*_]', 'g'), '').trim();
    }

    function slug(value) {
      return stripAnchorText(value).toLowerCase().replace(/\s+/g, '-').replace(/[^\w\u4e00-\u9fa5-]/g, '');
    }

    function formatJson(value) {
      try { return JSON.stringify(JSON.parse(value), null, 2); } catch { return value; }
    }

    function escapeHtml(value) {
      return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(new RegExp('\\x60', 'g'), '&#96;');
    }
  </script>
</body>
</html>
