<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code 可视化架构图</title>
<style>
:root {
  --bg: #f7f8fb;
  --panel: #ffffff;
  --text: #172033;
  --muted: #667085;
  --line: #a8b3c5;
  --entry: #2563eb;
  --core: #059669;
  --runtime: #7c3aed;
  --extension: #d97706;
  --state: #db2777;
  --infra: #0891b2;
  --risk: #e11d48;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; }
button { font: inherit; }
.topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; min-height: 72px; display: flex; align-items: center; gap: 18px; padding: 12px 18px; background: rgba(255,255,255,.96); border-bottom: 1px solid #e3e8f2; box-shadow: 0 4px 18px rgba(20,32,51,.05); }
.brand { min-width: 300px; }
.brand h1 { margin: 0 0 3px; font-size: 18px; line-height: 1.2; }
.brand p { margin: 0; color: var(--muted); font-size: 12px; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab { border: 1px solid transparent; background: transparent; color: var(--muted); padding: 7px 12px; border-radius: 7px; cursor: pointer; }
.tab:hover { color: var(--text); background: #eef2f8; }
.tab.active { color: var(--entry); background: #e8f0ff; border-color: #bfd4ff; }
.workspace { position: fixed; top: 72px; left: 0; right: 330px; bottom: 0; overflow: hidden; cursor: grab; }
.workspace.dragging { cursor: grabbing; }
.stage { position: absolute; transform-origin: 0 0; }
.side { position: fixed; top: 72px; right: 0; bottom: 0; width: 330px; padding: 16px; overflow: auto; background: rgba(255,255,255,.94); border-left: 1px solid #e3e8f2; }
.side h2 { margin: 0 0 8px; font-size: 16px; }
.side p { margin: 0 0 12px; color: var(--muted); font-size: 13px; line-height: 1.55; }
.side .note { padding: 10px 12px; background: #f1f5f9; border: 1px solid #dbe3ef; border-radius: 8px; color: #334155; font-size: 12px; line-height: 1.55; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; margin: 14px 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.dot { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.zoom { position: fixed; left: 16px; bottom: 16px; z-index: 15; display: flex; gap: 7px; padding: 7px; background: rgba(255,255,255,.9); border: 1px solid #e3e8f2; border-radius: 9px; box-shadow: 0 8px 22px rgba(19,33,68,.08); }
.zoom button { width: 34px; height: 32px; border: 1px solid #d8e0ec; border-radius: 7px; background: #fff; color: var(--muted); cursor: pointer; }
.zoom button:hover { color: var(--text); background: #eef2f8; }
svg { display: block; }
.node { cursor: pointer; }
.node rect { stroke-width: 1.4; filter: drop-shadow(0 5px 10px rgba(19,33,68,.08)); }
.node text { pointer-events: none; }
.label { font-size: 14px; font-weight: 700; fill: var(--text); }
.sub { font-size: 11px; fill: var(--muted); }
.ev { font-size: 10px; fill: var(--muted); font-family: "SF Mono", Consolas, monospace; }
.edge { fill: none; stroke: var(--line); stroke-width: 1.5; marker-end: url(#arrow); }
.edge.flow { stroke-dasharray: 7 5; animation: dash 1.4s linear infinite; }
.edge.weak { stroke-dasharray: 3 6; }
.edge.risk { stroke: var(--risk); }
.edge-label { font-size: 11px; fill: #475569; paint-order: stroke; stroke: #f7f8fb; stroke-width: 4px; }
@keyframes dash { to { stroke-dashoffset: -24; } }
.tip { position: fixed; z-index: 50; max-width: 380px; opacity: 0; pointer-events: none; padding: 10px 12px; background: #142033; color: #f8fafc; border-radius: 8px; font-size: 12px; line-height: 1.5; transition: opacity .12s; box-shadow: 0 12px 28px rgba(15,23,42,.22); }
.tip.show { opacity: 1; }
.tip strong { display: block; margin-bottom: 4px; }
.tip code { color: #bfdbfe; }
@media (max-width: 1020px) {
  .topbar { align-items: flex-start; flex-direction: column; gap: 8px; }
  .workspace { top: 122px; right: 0; bottom: 220px; }
  .side { top: auto; left: 0; width: 100%; height: 220px; border-left: 0; border-top: 1px solid #e3e8f2; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1>Claude Code 可视化架构图</h1>
    <p>HTML 结构图，作为 architecture.md 和 runtime-flows.md 的视觉补充。</p>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main class="workspace" id="workspace">
  <div class="stage" id="stage"></div>
</main>

<aside class="side">
  <h2 id="viewTitle"></h2>
  <p id="viewDesc"></p>
  <div class="legend" id="legend"></div>
  <div class="note">节点内的证据编号对应 <code>evidence-index.md</code>。本图基于本地非官方 source snapshot 的静态分析；官方当前产品行为和本地 snapshot 行为需要继续区分。</div>
</aside>

<div class="zoom">
  <button type="button" data-zoom="1.15">+</button>
  <button type="button" data-zoom="0.87">-</button>
  <button type="button" id="fit">fit</button>
</div>
<div class="tip" id="tip"></div>

<script>
const colors = {
  entry: '#2563eb',
  core: '#059669',
  runtime: '#7c3aed',
  extension: '#d97706',
  state: '#db2777',
  infra: '#0891b2',
  risk: '#e11d48'
};

const legend = [
  ['entry', '入口/界面'],
  ['core', '会话核心'],
  ['runtime', '模型与工具循环'],
  ['extension', '扩展能力'],
  ['state', '状态/上下文'],
  ['infra', '远程/基础设施']
];

const views = [
  {
    id: 'overview',
    label: '架构总览',
    title: '多入口路由 + Trust 前置 + Conversation Runtime',
    desc: 'Claude Code snapshot 的核心不是单次 CLI prompt，而是把本地交互、headless SDK、remote、bridge 和 direct-connect 收敛到同一套消息、工具、权限和 session 语义。',
    width: 1400,
    height: 850,
    nodes: [
      n('entry', '多入口模式路由', 'argv / URL / SSH / SDK / Bridge', 'C-003 C-004 INF-001', 60, 115, 230, 88, 'src/main.tsx 在 Commander 前处理 direct-connect、deep link、assistant、SSH、headless/interactive 和 client type。', 'entry'),
      n('setup', 'Setup And Trust', 'cwd / trust / API key / MCP approvals', 'C-005', 395, 115, 255, 88, 'setup/renderAndRun 把 workspace trust、API key、MCP approvals、telemetry 和 bypass dialog 放在 query 之前。', 'entry'),
      n('repl', 'React/Ink REPL', 'App / REPL / interactive state', 'C-006', 60, 330, 230, 86, '交互式路径保存 UI、MCP、tools、file history、agents、thinking 等状态，再组装 query 上下文。', 'entry'),
      n('remote', 'Headless / Remote IO', 'stream-json / bridge / direct-connect', 'C-015 INF-001', 60, 520, 230, 86, 'headless、bridge、remote 和 direct-connect 使用结构化消息和 permission control request。', 'infra'),
      n('engine', 'QueryEngine', 'conversation state owner', 'C-007', 450, 315, 230, 92, '会话级生命周期对象，拥有 initial messages、tools、commands、MCP clients、permission callback、budget 和 AppState。', 'core'),
      n('loop', 'queryLoop', 'turn orchestration', 'C-008 EXT-CC-002', 800, 315, 230, 92, 'turn 内主循环，处理 system context、auto-compact、model streaming、tool execution、fallback、刷新 tools。', 'runtime'),
      n('model', 'Model Client / QueryDeps', 'streaming / fallback / compact', 'C-014', 1110, 185, 210, 82, '模型调用通过 QueryDeps 注入，减少 queryLoop 对具体 API provider 的直接绑定。', 'runtime'),
      n('tools', 'Tool Contract', 'schema / permission / render / hints', 'C-009', 1110, 355, 210, 88, 'Tool 不是简单回调，携带 schema、权限、并发、只读、破坏性、渲染、MCP/LSP、defer、strict 等语义。', 'extension'),
      n('permission', 'Permission Pipeline', 'hooks / UI / remote / classifier', 'C-010 EXT-CC-003', 800, 545, 230, 88, 'tool execution 会经过 validation、hooks、permission decision、interactive handler、bridge/remote callbacks 和 classifier。', 'extension'),
      n('extensions', 'Skills / Plugins / MCP / Hooks', 'command / tool / resource / event', 'C-011 C-012 INF-003', 1110, 545, 210, 88, '扩展面分层：Skill、Plugin、MCP、Hook、remote control request 最终映射到 command/tool/permission/session 语义。', 'extension'),
      n('state', 'Session And Context', 'transcript / project root / CLAUDE.md / git', 'C-013 C-014 EXT-CC-005', 450, 650, 580, 88, 'sessionStorage、bootstrap state 和 context memoization 共同构成长期状态与上下文快照。', 'state')
    ],
    edges: [
      e('entry', 'setup', '模式归一'),
      e('setup', 'repl', '交互路径'),
      e('setup', 'remote', '结构化 IO'),
      e('repl', 'engine', 'submitMessage'),
      e('remote', 'engine', 'SDK message'),
      e('engine', 'loop', 'turn'),
      e('loop', 'model', '模型流'),
      e('loop', 'tools', '工具调用', 'flow'),
      e('tools', 'permission', '执行前决策'),
      e('extensions', 'tools', '注册/包装能力', 'weak'),
      e('permission', 'extensions', 'hooks/MCP/remote', 'weak'),
      e('loop', 'state', '读写上下文'),
      e('engine', 'state', '持久化会话')
    ]
  },
  {
    id: 'turn',
    label: 'Turn 主链路',
    title: '一次用户输入进入 QueryEngine 和 queryLoop 的主路径',
    desc: '这个视图把 REPL/headless 差异收敛后的 Agent turn 展开，重点看 context、model streaming、tool execution、permission 和 transcript。',
    width: 1340,
    height: 680,
    nodes: [
      n('t1', 'User Input / SDK Message', 'interactive or stream-json', 'C-006 C-015', 55, 285, 205, 78, '输入可能来自 REPL，也可能来自 headless/bridge/remote/direct-connect。', 'entry'),
      n('t2', 'Context Assembly', 'tools / prompts / system context', 'C-006 C-014', 315, 285, 195, 78, 'REPL 或 headless 路径在 query 前组装 tool permission context、tool pool、system/user context。', 'state'),
      n('t3', 'QueryEngine.submitMessage', 'session state + permission wrapper', 'C-007', 565, 285, 215, 78, 'submitMessage 持久化 session，包装 permission callback，并调用 query。', 'core'),
      n('t4', 'queryLoop', 'budget / compact / streaming', 'C-008', 835, 285, 185, 78, 'turn 内编排模型、工具、fallback、error、auto-compact 和 streaming events。', 'runtime'),
      n('t5', 'Model Streaming', 'QueryDeps', 'C-014', 1085, 185, 175, 78, '模型调用经 QueryDeps 注入，支持 provider 差异和 fallback。', 'runtime'),
      n('t6', 'Tool Execution', 'ToolUseContext', 'C-009 C-010', 1085, 385, 175, 78, '工具执行携带 commands、MCP clients/resources、budgets、prompts、AppState、messages 等上下文。', 'extension'),
      n('t7', 'Transcript / Result', 'JSONL / usage / stop reason', 'C-013', 565, 500, 215, 78, '记录 transcript、metadata、usage、cost、duration、stop reason 和 permission denials。', 'state')
    ],
    edges: [
      e('t1', 't2', '输入'),
      e('t2', 't3', '上下文'),
      e('t3', 't4', '启动 turn'),
      e('t4', 't5', '模型流', 'flow'),
      e('t5', 't4', 'stream event', 'weak'),
      e('t4', 't6', 'tool use', 'flow'),
      e('t6', 't4', 'tool result', 'weak'),
      e('t4', 't7', '结束/记录'),
      e('t3', 't7', '会话状态', 'weak')
    ]
  },
  {
    id: 'permission',
    label: '权限与扩展',
    title: 'Tool contract 下的权限流水线和分层扩展面',
    desc: 'Claude Code 最值得单独看的部分是：外部能力进入 runtime 后，会被包装成 Tool/Command/Resource，再由统一权限与 hook 语义处理。',
    width: 1360,
    height: 760,
    nodes: [
      n('p1', 'Built-in Tools', 'tools.ts source of truth', 'C-009', 70, 115, 190, 78, '内置工具通过 feature/env gate、deny rules、simple mode、dedup 和稳定排序进入 tool pool。', 'extension'),
      n('p2', 'MCP Tools / Resources', 'remote and local servers', 'C-012 EXT-CC-004', 70, 275, 190, 78, 'MCP discovery 连接 server，获取 tools、commands、skills、resources，并映射为 Claude Code Tool。', 'extension'),
      n('p3', 'Skills / Plugin Commands', 'markdown / manifest / hooks', 'C-011 INF-003', 70, 435, 190, 78, 'Skill、Plugin command、plugin hooks、marketplace 都有自己的加载和校验策略。', 'extension'),
      n('tool', 'Unified Tool Contract', 'schema + permission + hints', 'C-009', 405, 265, 250, 92, '不同能力源进入 runtime 后统一成 Tool/Command/Resource 语义，供模型、UI、权限、调度共同消费。', 'core'),
      n('validate', 'Validation And Hooks', 'schema / PreToolUse / prevent', 'C-010', 760, 130, 220, 78, '执行前先解析 tool name、input schema，并运行 PreToolUse hooks。', 'extension'),
      n('decision', 'Permission Decision', 'rules / modes / resolve once', 'C-010 EXT-CC-003', 760, 305, 220, 78, 'permission context 支持 allow/deny/ask、hook allow、用户 allow、deny abort、decision persistence。', 'extension'),
      n('interactive', 'Decision Sources', 'UI / bridge / remote / classifier', 'C-010 C-015', 760, 480, 220, 78, '交互 handler、bridge callback、remote callback 和 speculative classifier 都可能参与 can-use-tool 决策。', 'infra'),
      n('call', 'tool.call(...)', 'execute with ToolUseContext', 'C-009 C-010', 1090, 305, 185, 78, '权限流水线完成后才真正执行工具调用，并把结果回到 queryLoop。', 'runtime')
    ],
    edges: [
      e('p1', 'tool', '内置'),
      e('p2', 'tool', '包装'),
      e('p3', 'tool', '命令/能力'),
      e('tool', 'validate', '执行前'),
      e('validate', 'decision', '策略输入'),
      e('decision', 'interactive', '需要确认', 'weak'),
      e('interactive', 'decision', '返回决策', 'weak'),
      e('decision', 'call', '允许执行', 'flow'),
      e('call', 'tool', '结果/状态', 'weak')
    ]
  },
  {
    id: 'layers',
    label: '分层视图',
    title: '从入口到状态的分层边界',
    desc: '分层图用于快速识别 Claude Code 中哪些模块属于入口路由、运行前边界、交互状态、会话核心、工具权限和持久化上下文。',
    width: 1140,
    height: 850,
    layers: [
      layer('entry', '入口路由层', 'main.tsx / Commander / direct-connect / bridge / SDK', 'C-003 C-004 C-015', ['argv', 'URL', 'SSH', 'SDK']),
      layer('entry', 'Setup 与 Trust 层', 'cwd / terminal / workspace trust / MCP approvals', 'C-005', ['cwd', 'trust', 'API key', 'MCP approval']),
      layer('entry', '交互与结构化 IO 层', 'React/Ink REPL / stream-json / remote messages', 'C-006 C-015', ['REPL', 'headless', 'bridge', 'remote']),
      layer('core', 'Conversation Core 层', 'QueryEngine owns conversation state', 'C-007', ['messages', 'tools', 'commands', 'budget']),
      layer('runtime', 'Turn Runtime 层', 'queryLoop / model streaming / compact / fallback', 'C-008 C-014', ['model', 'compact', 'fallback', 'events']),
      layer('extension', 'Tool 与权限层', 'Tool contract / permission pipeline / hooks', 'C-009 C-010', ['schema', 'permission', 'hooks', 'callback']),
      layer('extension', '扩展接入层', 'Skills / Plugins / MCP / Commands', 'C-011 C-012 INF-003', ['skills', 'plugins', 'MCP', 'commands']),
      layer('state', '状态与上下文层', 'session transcript / bootstrap state / context memoization', 'C-013 C-014', ['JSONL', 'project root', 'CLAUDE.md', 'git'])
    ]
  }
];

const state = { view: 0, scale: 1, x: 0, y: 0, dragging: false, lastX: 0, lastY: 0 };
const tabs = document.getElementById('tabs');
const stage = document.getElementById('stage');
const workspace = document.getElementById('workspace');
const tip = document.getElementById('tip');

legend.forEach(([type, text]) => {
  const item = document.createElement('span');
  item.innerHTML = `<i class="dot" style="background:${colors[type]}"></i>${text}`;
  document.getElementById('legend').appendChild(item);
});

views.forEach((view, index) => {
  const button = document.createElement('button');
  button.className = 'tab' + (index === 0 ? ' active' : '');
  button.textContent = view.label;
  button.addEventListener('click', () => render(index));
  tabs.appendChild(button);
});

document.querySelectorAll('[data-zoom]').forEach(button => {
  button.addEventListener('click', () => zoom(Number(button.dataset.zoom)));
});
document.getElementById('fit').addEventListener('click', fit);
window.addEventListener('resize', fit);

workspace.addEventListener('mousedown', event => {
  state.dragging = true;
  state.lastX = event.clientX;
  state.lastY = event.clientY;
  workspace.classList.add('dragging');
});
window.addEventListener('mouseup', () => {
  state.dragging = false;
  workspace.classList.remove('dragging');
});
window.addEventListener('mousemove', event => {
  if (!state.dragging) return;
  state.x += event.clientX - state.lastX;
  state.y += event.clientY - state.lastY;
  state.lastX = event.clientX;
  state.lastY = event.clientY;
  applyTransform();
});

render(0);

function n(id, title, sub, ev, x, y, w, h, tipText, type = id) {
  return { id, type, title, sub, ev, x, y, w, h, tip: tipText };
}

function e(from, to, label, kind = '') {
  return { from, to, label, kind };
}

function layer(type, title, sub, ev, items) {
  return { type, title, sub, ev, items };
}

function render(index) {
  state.view = index;
  const view = views[index];
  document.querySelectorAll('.tab').forEach((tab, i) => tab.classList.toggle('active', i === index));
  document.getElementById('viewTitle').textContent = view.title;
  document.getElementById('viewDesc').textContent = view.desc;
  stage.innerHTML = view.layers ? renderLayers(view) : renderGraph(view);
  stage.style.width = view.width + 'px';
  stage.style.height = view.height + 'px';
  bindTips();
  fit();
}

function renderGraph(view) {
  const nodes = Object.fromEntries(view.nodes.map(node => [node.id, node]));
  let out = svgOpen(view);
  view.edges.forEach(edge => {
    const a = center(nodes[edge.from]);
    const b = center(nodes[edge.to]);
    const klass = ['edge', edge.kind].filter(Boolean).join(' ');
    out += `<path class="${klass}" d="M${a.x},${a.y} L${b.x},${b.y}"/>`;
    out += `<text class="edge-label" x="${(a.x + b.x) / 2}" y="${(a.y + b.y) / 2 - 8}" text-anchor="middle">${esc(edge.label)}</text>`;
  });
  view.nodes.forEach(node => out += nodeSvg(node));
  return out + '</svg>';
}

function renderLayers(view) {
  let out = svgOpen(view);
  view.layers.forEach((item, index) => {
    const y = 46 + index * 96;
    const color = colors[item.type];
    out += `<g class="node" data-title="${attr(item.title)}" data-desc="${attr(item.sub)}" data-ev="${attr(item.ev)}">`;
    out += `<rect x="76" y="${y}" width="986" height="74" rx="9" fill="${color}16" stroke="${color}"/>`;
    out += `<text class="label" x="112" y="${y + 27}">${esc(item.title)}</text>`;
    out += `<text class="sub" x="112" y="${y + 47}">${esc(item.sub)}</text>`;
    out += `<text class="ev" x="112" y="${y + 64}">${esc(item.ev)}</text>`;
    item.items.forEach((label, i) => {
      const x = 465 + i * 132;
      out += `<rect x="${x}" y="${y + 20}" width="108" height="30" rx="7" fill="#fff" stroke="${color}66"/>`;
      out += `<text class="sub" x="${x + 54}" y="${y + 40}" text-anchor="middle">${esc(label)}</text>`;
    });
    out += '</g>';
    if (index < view.layers.length - 1) {
      out += `<path class="edge flow" d="M570,${y + 74} L570,${y + 96}"/>`;
    }
  });
  return out + '</svg>';
}

function svgOpen(view) {
  return `<svg width="${view.width}" height="${view.height}" viewBox="0 0 ${view.width} ${view.height}" xmlns="http://www.w3.org/2000/svg">
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2L8 5L2 8" fill="none" stroke="#8792a2" stroke-width="1.6"/></marker></defs>
    <rect width="${view.width}" height="${view.height}" fill="transparent"/>`;
}

function nodeSvg(item) {
  const color = colors[item.type] || colors.core;
  return `<g class="node" data-title="${attr(item.title)}" data-desc="${attr(item.tip)}" data-ev="${attr(item.ev)}">
    <rect x="${item.x}" y="${item.y}" width="${item.w}" height="${item.h}" rx="9" fill="${color}16" stroke="${color}"/>
    <text class="label" x="${item.x + item.w / 2}" y="${item.y + 29}" text-anchor="middle">${esc(item.title)}</text>
    <text class="sub" x="${item.x + item.w / 2}" y="${item.y + 51}" text-anchor="middle">${esc(item.sub)}</text>
    <text class="ev" x="${item.x + item.w / 2}" y="${item.y + item.h - 13}" text-anchor="middle">${esc(item.ev)}</text>
  </g>`;
}

function center(item) {
  return { x: item.x + item.w / 2, y: item.y + item.h / 2 };
}

function bindTips() {
  document.querySelectorAll('.node').forEach(node => {
    node.addEventListener('mouseenter', event => showTip(event, node));
    node.addEventListener('mousemove', event => moveTip(event));
    node.addEventListener('mouseleave', hideTip);
  });
}

function showTip(event, node) {
  tip.innerHTML = `<strong>${esc(node.dataset.title)}</strong><div>${esc(node.dataset.desc)}</div><div><code>${esc(node.dataset.ev)}</code></div>`;
  tip.classList.add('show');
  moveTip(event);
}

function moveTip(event) {
  tip.style.left = Math.min(event.clientX + 14, window.innerWidth - 400) + 'px';
  tip.style.top = Math.min(event.clientY + 14, window.innerHeight - 180) + 'px';
}

function hideTip() {
  tip.classList.remove('show');
}

function fit() {
  const view = views[state.view];
  const rect = workspace.getBoundingClientRect();
  state.scale = Math.min((rect.width - 60) / view.width, (rect.height - 60) / view.height, 1.1);
  state.x = Math.max(24, (rect.width - view.width * state.scale) / 2);
  state.y = Math.max(24, (rect.height - view.height * state.scale) / 2);
  applyTransform();
}

function zoom(factor) {
  state.scale = Math.max(.35, Math.min(2.2, state.scale * factor));
  applyTransform();
}

function applyTransform() {
  stage.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
}

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

function attr(value) {
  return esc(value);
}
</script>
</body>
