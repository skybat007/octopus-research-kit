  <script>
    window.RESEARCH_DOCS = [{"file":"README.md","label":"总览文档","content":"# Hermes Agent 技术调研\n\nStatus: draft\nLast Updated: 2026-05-25\n\n## 调研摘要\n\nHermes Agent 是 Nous Research 维护的本地优先 AI Agent 项目，产品形态覆盖 CLI、TUI、消息网关、ACP、cron、工具系统、插件系统、模型 Provider 和记忆 Provider。它的架构核心不是单一聊天入口，而是把多个用户界面和消息渠道统一接到同一个 `AIAgent` 运行时，再通过工具注册表、Provider Profile、Plugin Hook、Session Store 和 Gateway Adapter 管理差异。[H-001][H-002][H-004][H-009]\n\n本轮调研固定在本地快照 `hermes-agent`，branch `main`，commit `cae7537359c0ba8fceedc0a6423a4d9f30972100`。这是第一版架构级调研，重点覆盖入口、Agent 主循环、工具系统、插件系统、Provider、Memory、Gateway、TUI、cron 与可学习的设计思想；暂不覆盖每个具体平台 Adapter、所有工具实现、UI 细节和性能压测。\n\n## 文件导航\n\n| 文件 | 说明 |\n|---|---|\n| research-brief.md | 调研目标、范围、问题和交付物 |\n| external-research.md | 官方资料、协作资料、外部观点和源码验证关系 |\n| research-questions.md | 从外部资料生成的源码验证问题 |\n| source-map.md | 仓库结构、入口、模块和阅读顺序 |\n| dashboard.html | 浏览器阅读入口，导航 Markdown、可视化图和辅助材料 |\n| docs.html | UTF-8 文档阅读器，避免浏览器直接打开 Markdown 乱码 |\n| architecture.md | 技术架构、模块边界和依赖方向 |\n| visual/architecture.html | HTML 可视化结构图，展示多入口、Agent Core、工具、插件、Gateway 和状态边界 |\n| visual/architecture.visual.js | 可视化图数据，承接 Markdown 结论和证据链接 |\n| visual/evidence.html | 可点击证据解释页，展示架构语境和源码/文档片段 |\n| visual/evidence.visual.js | 从 evidence-index.md 和 architecture.visual.js 抽取的证据解释数据 |\n| key-abstractions.md | 核心抽象、接口、数据结构和生命周期 |\n| extension-points.md | 插件、Hook、Registry、Provider 等扩展机制 |\n| runtime-flows.md | 主流程追踪和关键状态变化 |\n| design-philosophy.md | 设计思想和关键取舍 |\n| comparison.md | 与同类 Agent Gateway/CLI 项目的对照维度 |\n| adoption-notes.md | 学习借鉴笔记 |\n| evidence-index.md | 证据索引 |\n| research-review.md | 调研审查 |\n\n## 当前结论\n\n- Hermes Agent 官方 README/docs 与本地源码共同确认主设计是“多入口，共用 Agent Core”：CLI、TUI、Gateway、ACP 和 cron 最终都围绕 `AIAgent` 与 `run_conversation` 组织。[H-003][H-004][H-013][H-014][H-015][EXT-HA-001]\n- 工具系统采用中央 `ToolRegistry` + toolset 过滤 + plugin 注册的组合，`model_tools.py` 负责把 Registry 转成模型可消费的 tool schema，并把模型 tool call 分发回 Registry。[H-005][H-006][H-007]\n- 插件系统不是单一 hook 列表，而是分层的扩展控制面：通用插件、Provider Profile、Memory Provider、Gateway Platform、Context Engine、CLI/Slash Command 和 Toolset 都有独立入口。[H-008][H-010][H-011][H-012]\n- Gateway 是最复杂的运行面：它把平台 Adapter、认证/配对、session key、agent 缓存、流式输出、重复投递保护和 cron delivery 统一在一个大文件和少量支撑模块中。[H-009][H-010][H-016]\n- 最值得学习的思想是稳定系统提示词、入口归一、注册表驱动工具、Provider 行为剥离、Profile 隔离、显式 session key、可失败但不拖垮主流程的插件 hook。[H-004][H-006][H-008][H-012]\n\n## 待确认\n\n- 尚未启动 Hermes Agent 本地 CLI/TUI/Gateway 验证 live behavior。\n- 尚未跑测试，只做了静态源码和仓库文档分析。\n- 已补充官方外部资料互证，但尚未采用独立第三方实践文章作为结论依据。\n- 尚未逐一审查每个 built-in tool、platform adapter、provider plugin 和 memory provider 的实现质量。\n- TUI 前端 `ui-tui` 的交互设计和渲染状态机只做入口级扫描，未深入组件层。\n"},{"file":"research-brief.md","label":"调研简报","content":"# 调研简报\n\n## 1. 调研对象\n\n| 项 | 内容 |\n|---|---|\n| 项目 | Hermes Agent |\n| 项目标识 | `hermes-agent` |\n| 代码来源 | `https://github.com/NousResearch/hermes-agent.git` |\n| 快照 | branch `main`, commit `cae7537359c0ba8fceedc0a6423a4d9f30972100` |\n| 包版本 | `hermes-agent` `0.14.0` |\n| 语言/运行时 | Python `\u003e=3.11`，部分 TUI/Web/Browser 相关能力使用 Node 生态 |\n| 官方文档 | GitHub README, https://hermes-agent.nousresearch.com/docs |\n| 外部资料范围 | 官方 GitHub、官方 docs、Release 文件入口；本轮未采用独立第三方文章 |\n\n## 2. 调研目标\n\n本轮目标是理解 Hermes Agent 作为开源 Agent 框架的核心技术结构，形成可复用的学习资料：\n\n- 它如何把 CLI、TUI、消息网关、ACP 和 cron 接入同一个 Agent runtime。\n- 它如何组织模型 Provider、工具、插件、记忆、会话和上下文压缩。\n- 它如何处理多渠道消息、session identity、流式输出和投递边界。\n- 它有哪些设计取舍值得学习，哪些复杂度需要保持警惕。\n\n## 3. 核心问题\n\n| 编号 | 问题 | 输出位置 |\n|---|---|---|\n| Q1 | 项目主入口、运行时入口和包结构是什么？ | source-map.md |\n| Q2 | `AIAgent` 与 `run_conversation` 如何承接多入口请求？ | architecture.md, runtime-flows.md |\n| Q3 | 工具如何注册、过滤、暴露给模型并执行？ | key-abstractions.md, runtime-flows.md |\n| Q4 | 插件、Provider、Memory、Platform 扩展点如何分层？ | extension-points.md |\n| Q5 | Gateway 如何把外部消息转成 Agent turn，并处理 session 与投递？ | runtime-flows.md |\n| Q6 | 设计思想里哪些适合用于学习 Agent 框架？ | design-philosophy.md, adoption-notes.md |\n\n## 4. 范围\n\n本轮覆盖：\n\n- 仓库结构、入口脚本、安装入口和主要目录。\n- `AIAgent` 初始化、会话循环、工具调用、上下文压缩、记忆和插件 hook。\n- `ToolRegistry`、toolset、plugin tool、slash command registry。\n- Provider Profile、Memory Provider、Gateway Platform 插件。\n- Gateway message pipeline、session model、adapter base、TUI gateway、cron scheduler。\n\n本轮不覆盖：\n\n- 每个具体工具实现的功能细节。\n- 每个平台 Adapter 的认证协议和消息 API 细节。\n- Web/TUI 前端组件层设计。\n- 性能指标、压测和真实运行日志。\n- 与业务系统结合的具体方案。\n\n## 5. 交付物\n\n| 文档 | 验收点 |\n|---|---|\n| README.md | 能快速理解项目定位和主要结论 |\n| external-research.md | 记录官方资料、协作资料、外部观点和源码验证关系 |\n| research-questions.md | 将外部观点和用户目标转成源码验证问题 |\n| source-map.md | 能指导下一位阅读者按入口和模块继续深挖 |\n| architecture.md | 能说明模块边界和依赖方向 |\n| key-abstractions.md | 能解释关键类/结构的职责和生命周期 |\n| extension-points.md | 能说明扩展点的注册、发现、执行边界 |\n| runtime-flows.md | 至少追踪 CLI、Gateway、Tool Call 三条主流程 |\n| design-philosophy.md | 提炼可学习的架构思想和代价 |\n| comparison.md | 给出同类项目对照维度和初步观察 |\n| adoption-notes.md | 形成学习借鉴清单 |\n| evidence-index.md | 每个核心结论可回溯到官方资料、源码、测试、协作资料或社区资料 |\n| research-review.md | 标注覆盖情况、风险和下一步证据缺口 |\n\n## 6. 方法\n\n- 先固定代码快照和入口信息。\n- 先补官方资料调研，将关键外部观点转成源码验证问题。\n- 使用 `rg`、`find`、`nl` 做静态源码扫描。\n- 对关键结论建立证据编号，避免只凭印象描述。\n- 区分官方事实、源码事实、仓库文档事实、协作事实、社区事实和推断。\n- 对未验证的运行行为明确标注为待确认。\n"},{"file":"external-research.md","label":"外部资料","content":"# 外部资料调研\n\n## 1. 官方资料\n\n| 资料 | 链接或路径 | 主要内容 | 对本次调研的价值 | 可信度等级 |\n|---|---|---|---|---|\n| GitHub README | https://github.com/NousResearch/hermes-agent | 项目定位、自提升 learning loop、CLI/Gateway/TUI/cron/provider/memory/skills 能力概览 | 校准产品目标和外部入口 | A |\n| Architecture docs | https://hermes-agent.nousresearch.com/docs/developer-guide/architecture | 目录结构、`run_agent.py`、`model_tools.py`、`toolsets.py`、agent internals、CLI subcommands | 与本地 source-map/architecture 互证 | A |\n| Messaging Gateway docs | https://hermes-agent.nousresearch.com/docs/user-guide/messaging | messaging sessions、allowlist 安全默认值、background delivery、service management | 验证 Gateway/session/delivery 方向 | A |\n| Plugins docs | https://hermes-agent.nousresearch.com/docs/user-guide/features/plugins | plugin.yaml + Python register，注册 tools/hooks/slash commands/platform/provider 等 | 验证插件是扩展控制面而非只读配置 | A |\n| Toolsets reference | https://hermes-agent.nousresearch.com/docs/reference/toolsets-reference | toolset 是按平台/会话/任务控制工具能力的 bundle | 验证 ToolRegistry 与 toolset 过滤结论 | A |\n| Memory Providers docs | https://hermes-agent.nousresearch.com/docs/user-guide/features/memory-providers | 8 个外部 memory providers，且一次只激活一个外部 provider | 验证 Memory Provider 边界 | A |\n| Cron docs | https://hermes-agent.nousresearch.com/docs/user-guide/features/cron/ | cron job 可加载 skills、fresh agent sessions、delivery 输出和防递归 | 验证 cron 是 gateway/runtime 扩展入口 | A |\n\n## 2. 项目协作资料\n\n| 资料 | 链接或路径 | 主要观点 | 时间/版本 | 可信度等级 | 是否需要源码验证 |\n|---|---|---|---|---|---|\n| GitHub repository file tree | https://github.com/NousResearch/hermes-agent | 公开仓库结构与本地快照目录大体一致 | 2026-05-25 查询 | B | 是 |\n| Release files | GitHub README 中列出的 `RELEASE_v0.10.0` 到 `RELEASE_v0.14.0` | 说明项目有版本化 release notes | 2026-05-25 查询 | B | 后续版本差异调研需要 |\n\n## 3. 社区与第三方资料\n\n本轮未采用独立第三方文章作为结论依据。Hermes Agent 外部资料以官方 GitHub 和 Nous Research 文档站为主。\n\n## 4. 外部资料中的关键观点\n\n### EXT-HA-001: Hermes 是多入口 self-improving agent\n\n来源：\n\n- GitHub README\n- Hermes docs 首页/Architecture docs\n\n说明：\n\n- 外部资料强调 Hermes 不只是 CLI，而是 CLI、TUI、Messaging Gateway、cron、skills、memory、providers 和 delegation 的组合。\n\n是否已被源码验证：\n\n- 已验证多入口收敛到 `AIAgent` 与 conversation loop。\n\n对应源码证据：\n\n- [evidence-index.md](./evidence-index.md) `H-001`, `H-003`, `H-004`, `H-013`, `H-014`, `H-015`, `H-016`\n\n### EXT-HA-002: Toolsets 是能力控制面\n\n来源：\n\n- Toolsets Reference\n- GitHub README documentation index\n\n说明：\n\n- 外部资料将 toolsets 描述为按平台、会话或任务控制工具可用性的 bundle。\n\n是否已被源码验证：\n\n- 已验证 `toolsets.py` 与 `model_tools.py` 的 schema/filter/dispatch 逻辑。\n\n对应源码证据：\n\n- `H-005`, `H-006`, `H-007`\n\n### EXT-HA-003: Plugin 是自定义 tools/hooks/integrations 的路径\n\n来源：\n\n- Plugins docs\n\n说明：\n\n- 外部资料说明插件可注册 tool、hook、slash command、gateway platform、provider 等。\n\n是否已被源码验证：\n\n- 已验证通用插件系统、gateway platform registry、provider profile 和 memory provider 扩展面。\n\n对应源码证据：\n\n- `H-008`, `H-010`, `H-011`, `H-012`\n\n### EXT-HA-004: Gateway 默认安全策略依赖 allowlist / pairing\n\n来源：\n\n- Messaging Gateway docs\n\n说明：\n\n- 外部资料强调 messaging gateway 默认拒绝不在 allowlist 或未 DM pairing 的用户。\n\n是否已被源码验证：\n\n- 部分验证。本轮主要验证 Gateway session/delivery 与 adapter 结构，allowlist 细节仍需平台 adapter 级深挖。\n\n对应源码证据：\n\n- `H-009`, `INF-004`\n\n### EXT-HA-005: Memory Provider 一次只激活一个外部 provider\n\n来源：\n\n- Memory Providers docs\n\n说明：\n\n- 外部资料强调 built-in memory 始终启用，但外部 provider 只能激活一个。\n\n是否已被源码验证：\n\n- 已验证 MemoryManager 与 MemoryProvider 抽象。\n\n对应源码证据：\n\n- `H-012`\n\n## 5. 外部资料与源码不一致的地方\n\n| 外部资料说法 | 源码实际情况 | 判断 | 后续处理 |\n|---|---|---|---|\n| README 强调 self-improving learning loop | 本轮源码验证了 skills/memory/session/search 等支撑结构，但未验证学习触发策略的 live behavior | 部分验证 | 后续需跟踪 agent-created skills 和 session search 实际流程 |\n| Messaging docs 强调 allowlist/pairing 安全默认值 | 本轮 Gateway 证据聚焦 message/session/delivery，未逐平台验证认证细节 | 部分验证 | 后续按 Telegram/Discord adapter 抽样 |\n\n## 6. 对调研方向的影响\n\n外部资料帮助确认本轮应重点保留：\n\n- 多入口到 `AIAgent` 的统一 runtime\n- ToolRegistry + toolset 的能力控制\n- 插件、Provider、Memory、Gateway Platform 分层扩展\n- Messaging Gateway 的 session/delivery/safety\n- Cron 与 background delivery\n"},{"file":"research-questions.md","label":"研究问题","content":"# 研究问题\n\n## 1. 问题清单\n\n| 编号 | 问题 | 来源 | 为什么重要 | 需要验证的源码方向 | 状态 |\n|---|---|---|---|---|---|\n| RQ-HA-001 | Hermes 的多个入口是否最终进入同一个 Agent runtime？ | EXT-HA-001 | 决定架构中心是单 runtime 还是多套系统 | CLI、TUI gateway、ACP、Gateway、cron | 已验证 |\n| RQ-HA-002 | Toolsets 是否真的是工具能力控制面？ | EXT-HA-002 | 决定工具系统如何按平台/任务收敛 | `toolsets.py`, `model_tools.py`, `ToolRegistry` | 已验证 |\n| RQ-HA-003 | Plugin 是否能注册 tools/hooks/commands/platform/provider？ | EXT-HA-003 | 决定扩展机制是否分层 | `hermes_cli/plugins.py`, gateway platform registry, providers, memory | 已验证 |\n| RQ-HA-004 | Gateway session/delivery 是否支撑 messaging 入口？ | EXT-HA-004 | 决定消息入口是否共享 Agent runtime | `gateway/run.py`, `gateway/session.py`, adapter base | 已验证结构，安全细节部分验证 |\n| RQ-HA-005 | Memory Provider 是否一次只允许一个外部 provider？ | EXT-HA-005 | 决定长期记忆边界和失败隔离 | `agent/memory_manager.py`, `agent/memory_provider.py` | 已验证 |\n| RQ-HA-006 | Cron 是否在 fresh agent session 中运行并负责 delivery？ | Cron docs | 决定 scheduler 是外挂脚本还是 Agent runtime extension | `cron/jobs.py`, `cron/scheduler.py`, gateway cron ticker | 已验证结构 |\n\n## 2. 详细问题\n\n### RQ-HA-001: 多入口是否共用 Agent runtime？\n\n外部资料来源：\n\n- GitHub README\n- Architecture docs\n\n需要源码验证：\n\n- CLI、TUI、Gateway、ACP、cron 是否构造或调用 `AIAgent` / `run_conversation`。\n\n验证结果：\n\n- 已验证。\n\n源码证据：\n\n- `H-003`, `H-004`, `H-013`, `H-014`, `H-015`, `H-016`, `INF-001`\n\n### RQ-HA-002: Toolsets 是否是工具能力控制面？\n\n外部资料来源：\n\n- Toolsets Reference\n\n需要源码验证：\n\n- 工具是否经 `ToolRegistry` 注册。\n- 模型 tool schema 是否通过 toolset/disabled toolset 过滤。\n\n验证结果：\n\n- 已验证。\n\n源码证据：\n\n- `H-005`, `H-006`, `H-007`, `INF-002`\n\n### RQ-HA-003: Plugin 扩展面是否分层？\n\n外部资料来源：\n\n- Plugins docs\n\n需要源码验证：\n\n- 插件是否可注册 tools、commands、hooks、provider-like 能力、gateway platform、memory provider。\n\n验证结果：\n\n- 已验证。\n\n源码证据：\n\n- `H-008`, `H-010`, `H-011`, `H-012`, `INF-003`\n\n### RQ-HA-004: Gateway session/delivery 是否支撑 messaging 入口？\n\n外部资料来源：\n\n- Messaging Gateway docs\n\n需要源码验证：\n\n- `MessageEvent`、`SessionContext`、adapter、delivery dedupe 和 cached/fresh agent 是否存在。\n\n验证结果：\n\n- 已验证结构。allowlist/pairing 安全细节未逐平台验证。\n\n源码证据：\n\n- `H-009`, `H-010`, `INF-004`\n\n## 3. 外部观点验证状态\n\n| 外部观点 | 对应问题 | 验证状态 | 证据 |\n|---|---|---|---|\n| 多入口共用 Agent runtime | RQ-HA-001 | 已验证 | `H-003`, `H-004`, `H-013`-`H-016` |\n| Toolsets 控制工具可用性 | RQ-HA-002 | 已验证 | `H-005`-`H-007` |\n| Plugin 注册 tools/hooks/integrations | RQ-HA-003 | 已验证 | `H-008`, `H-010`-`H-012` |\n| Gateway 默认 allowlist/pairing | RQ-HA-004 | 部分验证 | `H-009`, 待平台 adapter 安全抽样 |\n| Memory Provider 一次一个外部 provider | RQ-HA-005 | 已验证 | `H-012` |\n\n## 4. 待继续确认\n\n- agent-created skills 的实际触发和更新策略。\n- Gateway allowlist/pairing 在具体平台 adapter 中的实现差异。\n- Cron delivery 与 session history 的 live trace。\n"},{"file":"architecture.md","label":"架构文档","content":"# 技术架构\n\n## 1. 一句话架构\n\nHermes Agent 以 `AIAgent` 为运行时核心，把 CLI、TUI、Gateway、ACP 和 cron 等入口统一成对话 turn，再通过 Provider Profile 调模型、通过 ToolRegistry 执行工具、通过 Plugin Hook 注入扩展逻辑、通过 Session Store 和 Memory Provider 保持长期上下文。[H-003][H-004][H-005][H-008][H-009]\n\n新版外部资料阶段确认官方 README/docs 也以多入口 Agent、toolsets、plugins、memory providers、messaging gateway 和 cron 为主要能力面；本地源码进一步验证这些能力最终落在 `AIAgent`、`ToolRegistry`、plugin manager、gateway session 和 cron scheduler 上。[EXT-HA-001][EXT-HA-002][EXT-HA-003][EXT-HA-004][EXT-HA-005]\n\n可视化补充：[visual/architecture.html](./visual/architecture.html)，图数据见 [visual/architecture.visual.js](./visual/architecture.visual.js)。证据解释页：[visual/evidence.html](./visual/evidence.html)，数据见 [visual/evidence.visual.js](./visual/evidence.visual.js)。该 HTML 图只展示本文和证据索引中已经沉淀的结构关系。\n\n## 2. 总体结构\n\n```mermaid\nflowchart TB\n  CLI[\"CLI: hermes / cli.py\"]\n  TUI[\"TUI: ui-tui + tui_gateway\"]\n  GW[\"Gateway: platform adapters\"]\n  ACP[\"ACP adapter\"]\n  CRON[\"Cron scheduler\"]\n\n  CLI --\u003e AGENT[\"AIAgent facade\"]\n  TUI --\u003e AGENT\n  GW --\u003e AGENT\n  ACP --\u003e AGENT\n  CRON --\u003e AGENT\n\n  AGENT --\u003e LOOP[\"agent.conversation_loop\"]\n  LOOP --\u003e PROVIDERS[\"ProviderProfile + OpenAI-compatible clients\"]\n  LOOP --\u003e TOOLS[\"model_tools + ToolRegistry\"]\n  LOOP --\u003e MEMORY[\"MemoryManager + MemoryProvider\"]\n  LOOP --\u003e PLUGINS[\"PluginManager hooks\"]\n  LOOP --\u003e SESSION[\"Session DB / logs / checkpoints\"]\n  LOOP --\u003e CONTEXT[\"Context engine / compressor\"]\n\n  TOOLS --\u003e TOOLSETS[\"toolsets\"]\n  TOOLS --\u003e BUILTIN[\"tools/*.py self-register\"]\n  PLUGINS --\u003e TOOLSETS\n  PLUGINS --\u003e TOOLS\n  PLUGINS --\u003e PROVIDERS\n  PLUGINS --\u003e MEMORY\n  PLUGINS --\u003e GW\n```\n\n## 3. 分层说明\n\n| 层 | 代表模块 | 职责 |\n|---|---|---|\n| Interface | `hermes_cli/main.py`, `cli.py`, `tui_gateway`, `gateway/run.py`, `acp_adapter`, `cron` | 接收用户输入、外部消息或定时任务，转换为 Agent turn |\n| Agent facade | `run_agent.py` | 暴露 `AIAgent`，统一初始化参数、回调、平台上下文和会话选项 |\n| Conversation runtime | `agent/conversation_loop.py`, `agent/agent_init.py` | 系统提示词、上下文、模型调用、工具调用、hook、记忆、持久化 |\n| Tool plane | `tools/registry.py`, `model_tools.py`, `toolsets.py` | 工具注册、tool schema、toolset gating、dispatch |\n| Extension plane | `hermes_cli/plugins.py`, `providers`, `plugins/memory`, `gateway/platform_registry.py` | 插件发现、注册、hook、Provider、Memory、Platform |\n| Messaging plane | `gateway/run.py`, `gateway/platforms/base.py`, `gateway/session.py` | 多平台 adapter、session identity、streaming、delivery |\n| Persistence/config | `hermes_constants`, CLI config/profile/session DB/cron jobs | profile 隔离、配置加载、日志、会话、cron 数据 |\n\n## 4. 依赖方向\n\nHermes 的主要依赖方向是从入口向内收敛：\n\n- `hermes_cli/main.py` 负责命令解析、profile override、startup discovery，然后把 chat 交给 `cli.py` 或 TUI/Gateway 子系统。[H-003][H-014]\n- `run_agent.py` 中的 `AIAgent` 是门面；初始化逻辑下沉到 `agent.agent_init.init_agent`，conversation loop 下沉到 `agent.conversation_loop.run_conversation`。[H-004]\n- `agent.conversation_loop` 不直接实现具体工具，而是调用 `model_tools`，再由 `tools.registry` dispatch。[H-005][H-006]\n- 通用插件通过 `PluginContext` 注册工具、命令、hook、context engine、gateway platform；工具最终进入同一 Registry。[H-008]\n- Provider 和 Memory Provider 是专门插件通道：Provider Profile 描述模型侧行为，Memory Provider 描述长期记忆侧行为。[H-011][H-012]\n\n## 5. Agent runtime 边界\n\n`AIAgent` 的构造参数覆盖 provider/model/toolsets/callbacks/platform/session/fallback 等运行期事实，说明它被设计成多入口共享的运行单元，而不是只服务 CLI 的对象。[H-004]\n\n`agent_init` 做了大量“启动时归一化”：\n\n- 加载 tool definitions 并记录 valid tools。[H-004]\n- 建立 session ID、日志、session DB、todo、checkpoint 等状态。[H-004]\n- 加载内置 memory 和外部 memory provider。[H-012]\n- 建立 context engine 或内置 compressor，并拒绝上下文窗口太小的模型。[H-004]\n\n`conversation_loop` 则负责“每一轮 turn”：\n\n- 为 prompt caching 构建稳定 system prompt，并在后续恢复它。[H-004]\n- 进入模型调用前做上下文压缩、memory/context 注入和 plugin hook。[H-004]\n- 优先走 streaming API，必要时 fallback 到非 streaming。[H-004]\n- 处理 tool call 的 JSON 修复、校验、guardrail、dispatch 和结果回填。[H-004][H-006]\n- 收尾时保存 trajectory、session、skill review、memory sync 等。[H-004]\n\n## 6. Gateway 架构\n\nGateway 是 Hermes 最重的 interface 层，负责把多平台消息转成 Agent turn：\n\n```mermaid\nflowchart LR\n  Adapter[\"Platform Adapter\"] --\u003e Event[\"MessageEvent\"]\n  Event --\u003e Runner[\"GatewayRunner._handle_message\"]\n  Runner --\u003e Auth[\"auth / pairing / guards\"]\n  Auth --\u003e Sess[\"SessionSource -\u003e SessionContext -\u003e session key\"]\n  Sess --\u003e Cache[\"cached or fresh AIAgent\"]\n  Cache --\u003e Loop[\"agent.run_conversation\"]\n  Loop --\u003e Delivery[\"stream / final delivery\"]\n  Delivery --\u003e Adapter\n```\n\n关键点：\n\n- Adapter 把平台输入标准化成 `MessageEvent`，并用 `BasePlatformAdapter` 提供发送、streaming draft、TTS、active session 等基础能力。[H-009]\n- `SessionSource` 与 `SessionContext` 负责把 platform/chat/thread/user 等事实转成确定性 session key。[H-009]\n- `GatewayRunner` 在处理消息时先执行 gateway dispatch hook，再做认证/配对，再建立 session/agent 上下文。[H-009]\n- Gateway 会基于配置签名复用 `AIAgent`，避免每条消息都完全重新初始化。[H-009]\n- Streaming 已经投递时，会避免重复 final delivery。[H-009]\n\n## 7. TUI 与 ACP\n\nTUI 不是重新实现 Agent，而是通过 Python `tui_gateway` 做 stdio JSON-RPC bridge。`tui_gateway.entry` 保证 stdout 专用于 JSON-RPC，启动时按需发现 MCP tools，然后发出 `gateway.ready`，之后循环读取 stdin dispatch。[H-013]\n\n`tui_gateway.server` 维护 RPC method registry、session 状态、长耗时 handler 线程池、slash worker 和 prompt submit 流程；它在 `prompt.submit` 内导入 `AIAgent`，继续使用同一 Agent runtime。[H-013]\n\nACP adapter 也是类似策略：保留 stdout 给 ACP JSON-RPC，加载环境、做 MCP discovery，然后创建 `HermesACPAgent` 交给 `acp.run_agent`。[H-015]\n\n## 8. 架构风险观察\n\n- `gateway/run.py` 和 `hermes_cli/main.py` 体量很大，说明接口层复杂度尚未完全模块化。\n- 插件入口很多，学习时需要区分通用插件、Provider、Memory、Platform，不宜混为一个概念。\n- 多入口共享 Agent core 是优点，但也要求系统提示词、tool schema、profile、session identity 的稳定性很高。\n- Gateway 同时承接外部消息、agent 调度和 delivery，一旦扩展平台很多，测试矩阵会快速扩大。\n"},{"file":"runtime-flows.md","label":"运行流程","content":"# 运行流程\n\n## 1. CLI Chat 启动链路\n\n```mermaid\nsequenceDiagram\n  participant User\n  participant Main as hermes_cli.main\n  participant CLI as cli.py\n  participant Agent as AIAgent\n  participant ConvLoop as conversation_loop\n  participant Tools as model_tools/registry\n  participant Provider as Provider client\n\n  User-\u003e\u003eMain: hermes chat / default command\n  Main-\u003e\u003eMain: profile override + startup discovery\n  Main-\u003e\u003eMain: cmd_chat first-run/setup/env/tool options\n  Main-\u003e\u003eCLI: cli.main(**kwargs)\n  CLI-\u003e\u003eAgent: construct AIAgent\n  Agent-\u003e\u003eAgent: agent_init.init_agent\n  Agent-\u003e\u003eConvLoop: run_conversation\n  ConvLoop-\u003e\u003eProvider: streaming API call\n  Provider--\u003e\u003eConvLoop: text/tool calls\n  ConvLoop-\u003e\u003eTools: execute tool calls\n  Tools--\u003e\u003eConvLoop: tool results\n  ConvLoop--\u003e\u003eCLI: final result/session state\n```\n\n关键状态：\n\n- `main()` 构建 parser，并把默认命令设置为 chat。[H-003]\n- `_apply_profile_override()` 在完整 parser 前预解析 profile，设置 `HERMES_HOME`。[H-003]\n- `_prepare_agent_startup()` 做 plugin、MCP tools 和 shell hook 等 agent-running command 的启动发现。[H-003]\n- `cmd_chat()` 处理 continue/resume、first-run setup、TUI 分支、yolo/ignore rules/env pin 等，然后导入 `cli.main` 执行。[H-014]\n- `AIAgent` 构造委托 `agent_init`，`run_conversation()` 委托 `conversation_loop`。[H-004]\n\n## 2. Agent Turn 主循环\n\n```mermaid\nflowchart TD\n  Start[\"run_conversation\"] --\u003e Runtime[\"create runtime/session/log/task context\"]\n  Runtime --\u003e Prompt[\"stable system prompt restore/build\"]\n  Prompt --\u003e Compress[\"preflight context compression\"]\n  Compress --\u003e Hook1[\"pre_llm_call hook/context injection\"]\n  Hook1 --\u003e Messages[\"build API messages\"]\n  Messages --\u003e Cache[\"prompt caching sanitization\"]\n  Cache --\u003e API[\"streaming model call, fallback non-streaming\"]\n  API --\u003e HasTool{\"tool calls?\"}\n  HasTool -- yes --\u003e ToolPrep[\"validate/repair/guardrail\"]\n  ToolPrep --\u003e ToolExec[\"_execute_tool_calls -\u003e model_tools\"]\n  ToolExec --\u003e Messages\n  HasTool -- no --\u003e Done[\"completion / trajectory / session persistence\"]\n  Done --\u003e Background[\"skill review / memory sync\"]\n```\n\n关键状态：\n\n- 循环开始时建立 DB session、runtime main、logging 和 task id isolation。[H-004]\n- System prompt 在第一次构建后恢复，避免 prompt caching 被中途改变破坏。[H-004]\n- preflight context compression 在模型调用前执行。[H-004]\n- plugin/memory context 被注入当前 user message，stable system prompt 作为单独 system message prepend。[H-004]\n- 流式 API 是优先路径，非流式是 fallback。[H-004]\n- 达到 max iterations 时，会请求一次不带工具的 summary。[H-004]\n- 收尾包括 completion determination、trajectory save、cleanup、session persistence、skill review、memory sync。[H-004]\n\n## 3. Tool Call 执行链路\n\n```mermaid\nsequenceDiagram\n  participant ToolMod as tools/*.py\n  participant Registry as ToolRegistry\n  participant ModelTools as model_tools\n  participant ConvLoop as conversation_loop\n  participant LLM\n\n  ToolMod-\u003e\u003eRegistry: register(definition, handler, check_fn)\n  ModelTools-\u003e\u003eRegistry: get_definitions()\n  ModelTools-\u003e\u003eModelTools: apply toolsets / disabled toolsets / cache\n  ConvLoop-\u003e\u003eLLM: send tool schemas\n  LLM--\u003e\u003eConvLoop: tool call\n  ConvLoop-\u003e\u003eConvLoop: validate args / JSON repair / guardrail\n  ConvLoop-\u003e\u003eModelTools: handle_function_call(name, args)\n  ModelTools-\u003e\u003eModelTools: pre_tool_call hooks / ACP approvals\n  ModelTools-\u003e\u003eRegistry: dispatch(name, args)\n  Registry--\u003e\u003eModelTools: handler result\n  ModelTools-\u003e\u003eModelTools: post hooks / transform result\n  ModelTools--\u003e\u003eConvLoop: tool result message\n```\n\n关键状态：\n\n- `discover_builtin_tools()` 通过 import 触发自注册。[H-005]\n- Registry generation counter 参与 `get_tool_definitions` 缓存 key。[H-005][H-006]\n- `model_tools` 先做 toolset 过滤和 disabled subtraction，plugin tools 也走同一路径。[H-006]\n- `handle_function_call` 负责参数修正、pre_tool_call hook、ACP edit approval、registry dispatch、post hooks 和错误包装。[H-006]\n- `conversation_loop` 外层还处理 tool call JSON 修复、retry、guardrail 和 `_execute_tool_calls`。[H-004]\n\n## 4. Gateway 入站消息链路\n\n```mermaid\nsequenceDiagram\n  participant Platform\n  participant Adapter as BasePlatformAdapter\n  participant Runner as GatewayRunner\n  participant Session as gateway.session\n  participant Agent as AIAgent\n  participant ConvLoop as run_conversation\n  participant Delivery\n\n  Platform-\u003e\u003eAdapter: inbound message/event\n  Adapter-\u003e\u003eRunner: MessageEvent\n  Runner-\u003e\u003eRunner: pre_gateway_dispatch hook\n  Runner-\u003e\u003eRunner: auth / pairing / control command guards\n  Runner-\u003e\u003eSession: build SessionSource/SessionContext/session key\n  Runner-\u003e\u003eRunner: pending sentinel to avoid duplicate agent\n  Runner-\u003e\u003eAgent: cached or fresh AIAgent\n  Agent-\u003e\u003eConvLoop: run_conversation(history/task id)\n  ConvLoop--\u003e\u003eRunner: streaming/final output\n  Runner-\u003e\u003eDelivery: avoid duplicate final delivery if stream already sent\n  Delivery-\u003e\u003eAdapter: platform send/update\n```\n\n关键状态：\n\n- `GatewayRunner` 管理 platform adapters，并在 `_create_adapter` 中优先查询 plugin platform registry。[H-009][H-010]\n- `_handle_message` 先走 `pre_gateway_dispatch` hook，再执行认证/配对逻辑。[H-009]\n- Gateway 使用 pending sentinel 抢占 session，避免同一 session 重复启动 agent。[H-009]\n- `_run_agent` 在线程池中执行，支持 interrupt，并把 platform/user/session/gateway_session_key/session_db/fallback_model 传入 `AIAgent`。[H-009]\n- Gateway 基于配置签名复用 cached AIAgent，或创建 fresh AIAgent。[H-009]\n- 如果 streaming 已经投递，final delivery 会避免重复发送。[H-009]\n\n## 5. TUI RPC 链路\n\n```mermaid\nflowchart LR\n  UI[\"ui-tui\"] --\u003e STDIN[\"stdio JSON-RPC\"]\n  STDIN --\u003e Entry[\"tui_gateway.entry\"]\n  Entry --\u003e Server[\"tui_gateway.server dispatch\"]\n  Server --\u003e Method[\"method registry\"]\n  Method --\u003e Prompt[\"prompt.submit\"]\n  Prompt --\u003e Agent[\"AIAgent\"]\n  Agent --\u003e Event[\"message.delta / events\"]\n  Event --\u003e STDOUT[\"stdout JSON-RPC only\"]\n  STDOUT --\u003e UI\n```\n\n关键状态：\n\n- `entry.py` 从 sys.path 中移除 CWD shadowing 风险，安装 signal/exit 日志，并保留 stdout 给 JSON-RPC。[H-013]\n- 启动时按需 discover MCP tools，然后发送 `gateway.ready`。[H-013]\n- `server.py` 把长耗时 handler 放入线程池，避免 `approval.respond`、`session.interrupt` 等请求阻塞在 stdin 管道里。[H-013]\n- RPC 方法通过 `@method(...)` 注册，包含 session、prompt、approval、slash、tools、cron、skills、shell、browser 等。[H-013]\n- `prompt.submit` 路径会导入 `AIAgent` 并发送 `message.delta` 等事件。[H-013]\n\n## 6. Cron 执行链路\n\n```mermaid\nflowchart TD\n  Job[\"jobs.json\"] --\u003e Scheduler[\"cron.scheduler.tick\"]\n  Scheduler --\u003e Lock[\"file lock .tick.lock\"]\n  Lock --\u003e Due[\"get_due_jobs\"]\n  Due --\u003e Profile[\"optional job profile context\"]\n  Profile --\u003e Prompt[\"build job prompt + injection scan\"]\n  Prompt --\u003e Agent[\"AIAgent with cron toolsets\"]\n  Agent --\u003e Output[\"save output markdown\"]\n  Output --\u003e Delivery[\"home target delivery or silent marker\"]\n```\n\n关键状态：\n\n- cron jobs 存在 `~/.hermes/cron/jobs.json`，输出保存到 `~/.hermes/cron/output/{job_id}/{timestamp}.md`。[H-016]\n- jobs 文件修改用 in-process lock 保护，目录和文件设置 owner-only 权限。[H-016]\n- scheduler `tick()` 由 gateway 后台线程每 60 秒调用，并用文件锁避免多进程重叠。[H-016]\n- cron toolsets 先看 per-job `enabled_toolsets`，再看 platform `cron` tools config，失败时回退默认。[H-016]\n- 定时任务支持 profile context，使 job 在指定 Hermes profile 下运行，同时隔离临时环境变量变更。[H-016]\n- prompt injection scanner 会扫描组装后的 prompt，包括 skill 内容。[H-016]\n"},{"file":"key-abstractions.md","label":"核心抽象","content":"# 核心抽象\n\n## 1. `AIAgent`\n\n位置：`run_agent.py`\n\n`AIAgent` 是 Hermes 的 Agent runtime 门面。它的 docstring 明确说明负责 conversation、tool execution 和 response handling；构造参数覆盖 provider/model/toolsets/callbacks/platform/session 等多个入口都需要的上下文。[H-004]\n\n生命周期：\n\n1. 构造时委托 `agent.agent_init.init_agent` 完成复杂初始化。\n2. `run_conversation()` 委托 `agent.conversation_loop.run_conversation`。\n3. `chat()` 是一个简化接口，返回 `run_conversation` 的 final response。\n\n设计含义：\n\n- `AIAgent` 不只是 CLI 对象，而是多入口共用的运行单元。\n- 大量状态在 init 阶段归一化，降低每个入口重复处理配置和工具的机会。\n- 门面仍然很大，说明它承担了向后兼容和参数汇聚的压力。\n\n## 2. `run_conversation`\n\n位置：`agent/conversation_loop.py`\n\n`run_conversation` 是主循环抽象，文件头说明它覆盖模型调用、工具分发、重试、fallback、压缩、hook、memory/skill nudges 等逻辑。[H-004]\n\n关键职责：\n\n- 维护 turn 状态、iteration、tool call 状态和响应累积。\n- 在模型调用前稳定构造 system prompt，并注入 memory/context/plugin context。[H-004]\n- 优先 streaming，失败时走非 streaming fallback。[H-004]\n- 解析和执行 tool call，处理 JSON 修复、校验、guardrail、并发执行和错误结果。[H-004][H-006]\n- 收尾保存 trajectory、session、memory sync 和 skill review。[H-004]\n\n设计含义：\n\n- 主循环是 Agent 框架的心脏，入口层都应该尽量只做适配。\n- Hermes 把“稳定 prompt caching”当成硬约束，避免中途改变 system prompt/toolset 破坏缓存。\n\n## 3. `ToolRegistry`\n\n位置：`tools/registry.py`\n\n`ToolRegistry` 是工具注册和 dispatch 的中央抽象。built-in tools 通过模块 import 自注册；plugin tools 也通过 `PluginContext.register_tool` 进入同一个 registry。[H-005][H-008]\n\n关键机制：\n\n- `discover_builtin_tools()` 通过导入工具模块触发注册。[H-005]\n- Registry 保存 definitions、handlers、check_fn，并维护 generation counter。[H-005]\n- `register()` 支持 override 语义，并在变更时 bump generation。[H-005]\n- `get_definitions()` 可按可用性检查过滤 tool schema。[H-005]\n- `dispatch()` 负责执行 handler、处理 async bridge 和错误包装。[H-005]\n\n设计含义：\n\n- 工具入口统一后，built-in 和 plugin tools 可以复用同一 schema/dispatch 管线。\n- generation counter 与 `model_tools` 缓存配合，避免 tool schema 每轮重复构建。[H-006]\n\n## 4. Toolset\n\n位置：`toolsets.py`\n\nToolset 是“工具能力包”抽象，定义哪些工具默认启用、哪些按平台/场景启用。`model_tools.get_tool_definitions` 会结合 toolsets、disabled toolsets 和 registry generation 生成最终模型 tool schema。[H-006][H-007]\n\n关键点：\n\n- `_HERMES_CORE_TOOLS` 是核心工具集合。[H-007]\n- `TOOLSETS` 定义 shell、file、web、memory、gateway 等能力包。[H-007]\n- `validate_toolset()` 接受 built-in toolset、plugin toolset 和 registry aliases。[H-007]\n- 插件 toolset 会进入同一工具展示和过滤路径。[H-008]\n\n## 5. `CommandDef`\n\n位置：`hermes_cli/commands.py`\n\n`CommandDef` 是 slash/native command 的统一注册结构。CLI、Gateway、Slack native command 和 plugin command 都从中央 registry 派生行为。[H-007][H-008]\n\n设计含义：\n\n- 命令不是散落在多个入口里硬编码，而是先注册为数据结构，再由不同入口消费。\n- Gateway 已知命令和 plugin commands 会合并进入可识别命令集合。[H-007]\n\n## 6. `PluginManager` / `PluginContext`\n\n位置：`hermes_cli/plugins.py`\n\n通用插件系统负责发现、加载和执行插件。`PluginContext` 是插件注册能力的入口，支持工具、hook、CLI subcommand、slash command、context engine、gateway platform、provider-like 能力和只读 skill。[H-008]\n\n关键机制：\n\n- 插件来源包括 bundled、user、project、pip entrypoints。[H-008]\n- `VALID_HOOKS` 覆盖 tool、LLM/API、session、gateway dispatch、approval 等生命周期。[H-008]\n- 插件默认 opt-in，部分 backend/platform 插件可自动加载。[H-008]\n- `invoke_hook` 对单个插件失败采取 fail-open，避免扩展拖垮主流程。[H-008]\n\n## 7. `ProviderProfile`\n\n位置：`providers/base.py`\n\n`ProviderProfile` 描述模型 Provider 行为，`AIAgent` 仍负责 client construction 和 streaming。它把 Provider 差异集中到消息准备、extra body、API kwargs 等可覆盖方法上。[H-011]\n\n设计含义：\n\n- Provider 插件不需要复制 Agent loop。\n- Provider 行为是 profile 数据和少量 hooks，而不是在主循环里到处写 if/else。\n\n## 8. `MemoryProvider` / `MemoryManager`\n\n位置：`agent/memory_provider.py`, `agent/memory_manager.py`\n\n`MemoryProvider` 是外部长期记忆 Provider 的抽象，包含 availability、initialize、system prompt、prefetch、sync turn、tool schemas 和 tool call 等接口。[H-012]\n\n`MemoryManager` 同时管理内置记忆和最多一个外部 Provider，并把失败隔离在 Provider 边界内。[H-012]\n\n设计含义：\n\n- 记忆不是简单文件读写，而是能参与 prompt、prefetch、tool schema 和 turn sync 的运行时能力。\n- “一个外部 Provider”降低了多记忆系统冲突的复杂度。\n\n## 9. `MessageEvent` / `BasePlatformAdapter`\n\n位置：`gateway/platforms/base.py`\n\nGateway 平台 Adapter 把 Telegram/Slack/Discord/Email/SMS 等差异标准化为 `MessageEvent`，并通过 `BasePlatformAdapter` 提供发送、streaming draft、active session、pending message、TTS 等基础能力。[H-009]\n\n设计含义：\n\n- 平台差异应该停在 Adapter 边界，不进入 Agent core。\n- 支持 streaming delivery 需要 Adapter contract 比普通 `send(text)` 更厚。\n\n## 10. `SessionSource` / `SessionContext` / `SessionStore`\n\n位置：`gateway/session.py`\n\n`SessionSource` 表示平台、chat、thread、user、shared multi-user 等来源事实；`SessionContext` 是 gateway 构建出的 Agent 会话上下文；`SessionStore` 默认使用 SQLite，经 fallback JSONL 保存会话映射。[H-009]\n\n设计含义：\n\n- 多平台 Agent 必须先解决 session identity，再谈消息处理。\n- Hermes 的 session key 是确定性构造，适合跨平台、群聊、线程、用户级别隔离。\n"},{"file":"extension-points.md","label":"扩展点","content":"# 扩展点\n\n## 1. 扩展点总览\n\nHermes 的扩展点不是单层插件，而是多个面向不同问题的入口：\n\n| 扩展点 | 入口 | 主要用途 |\n|---|---|---|\n| Built-in tool | `tools/*.py` + `tools.registry.register` | 内置工具 |\n| Plugin tool | `PluginContext.register_tool` | 用户/项目/包插件新增工具 |\n| Toolset | `toolsets.py` + plugin toolsets | 按场景组织工具能力 |\n| Slash/CLI command | `hermes_cli/commands.py`, `PluginContext.register_slash_command` | 命令面扩展 |\n| Hook | `PluginContext.register_hook` | LLM、tool、session、gateway 等生命周期扩展 |\n| Provider Profile | `providers/*`, `plugins/model-providers/*` | 模型 Provider 差异 |\n| Memory Provider | `plugins/memory/*` | 外部长期记忆 |\n| Gateway Platform | `gateway/platform_registry.py` | 新消息平台 |\n| Context Engine | `PluginContext.register_context_engine` | 上下文压缩/注入策略 |\n| ACP/MCP/Browser/Image/Web providers | plugin/provider registration APIs | 专项能力后端 |\n\n## 2. 工具扩展\n\nBuilt-in tool 的路径：\n\n1. 新工具模块放在 `tools/`。\n2. 模块 import 时调用 `registry.register(...)` 自注册。\n3. `discover_builtin_tools()` 导入工具模块触发注册。[H-005]\n4. `model_tools.get_tool_definitions()` 从 registry 读取 schema，并受 toolset/disabled toolset 控制。[H-006]\n5. 模型产生 tool call 后，`model_tools.handle_function_call()` 走 registry dispatch。[H-006]\n\nPlugin tool 的路径：\n\n1. 插件被 `discover_plugins()` 发现并加载。\n2. 插件 `register(ctx)` 调用 `ctx.register_tool(...)`。\n3. `PluginContext` 内部委托到 `tools.registry.register`。[H-008]\n4. 后续 schema/filter/dispatch 与 built-in tool 共用同一管线。\n\n学习点：\n\n- 工具扩展的关键不是“能注册”，而是注册后必须进入同一缓存、过滤、展示和执行路径。\n- Toolset 使工具暴露变成可配置能力，而不是所有工具一律暴露给模型。\n\n## 3. Hook 扩展\n\n`VALID_HOOKS` 覆盖：\n\n- tool 前后：`pre_tool_call`, `post_tool_call`, `transform_tool_result`\n- LLM/API 前后：`pre_llm_call`, `post_llm_call`, `pre_api_request`, `post_api_response`\n- session 生命周期：session start/end、turn start/end 等\n- gateway dispatch、approval 等入口边界。[H-008]\n\n执行特点：\n\n- `invoke_hook` 对单个插件错误 fail-open，主要保证主流程不被扩展失败拖垮。[H-008]\n- `pre_tool_call` 支持 block 结果，可用于审批或安全策略。[H-008]\n- `conversation_loop` 在模型调用前后、tool call 前后、上下文注入等位置调用 hook。[H-004][H-008]\n\n风险：\n\n- Hook 面太宽会让运行时行为变得隐性，需要强约束和可观测日志。\n- Hook 修改 prompt/context/tool result 时，容易影响 prompt caching 和调试。\n\n## 4. Provider Profile\n\nProvider Profile 用于描述模型 Provider 行为，而不是为每个 Provider 复制一套 Agent loop。[H-011]\n\n注册/发现：\n\n- Provider Profile 可以来自 bundled/user plugin dirs。\n- `providers.__init__` 做 lazy discovery，支持 user override bundled。[H-011]\n- `register_provider` 注册 name/aliases，`get_provider` 和 `list_providers` 触发发现。[H-011]\n\n可扩展行为：\n\n- message preparation\n- extra body\n- API kwargs extras\n- runtime provider metadata\n- auth/models/doctor/config/transport 的下游接线说明在 `providers/README.md` 中集中描述。[H-011]\n\n## 5. Memory Provider\n\nMemory Provider 是独立扩展通道，不等同于普通 plugin hook。[H-012]\n\n生命周期：\n\n1. `plugins/memory` 从 bundled 和 user dirs 发现 provider。\n2. `agent_init` 根据 `memory.provider` 激活一个外部 provider。\n3. Provider 可贡献 system prompt、prefetch、sync_turn、tool schemas 和 tool call handler。\n4. `MemoryManager` 与内置记忆共同编排，并隔离 Provider 失败。[H-012]\n\n设计边界：\n\n- 只允许一个外部 memory provider，降低多个长期记忆系统互相覆盖/重复注入的风险。\n- Memory tool schemas 会进入 toolset gating 和 dedup 逻辑，不是无条件加入。[H-012]\n\n## 6. Gateway Platform Plugin\n\nGateway Platform 扩展用于新增消息平台。[H-010]\n\n路径：\n\n1. 插件调用 `register_gateway_platform`。\n2. 平台信息进入 `gateway/platform_registry.py`。\n3. `GatewayRunner._create_adapter` 优先查询 plugin platform registry。\n4. 未命中才回退到内置 if/elif 平台 Adapter。[H-009][H-010]\n\nPlatform entry 可描述：\n\n- adapter factory\n- env/config requirements\n- cron/notification target\n- standalone hooks\n- config validation。[H-010]\n\n`ADDING_A_PLATFORM.md` 推荐通过 plugin path 新增平台，并列出 built-in adapter 必需方法和关键模式。[H-010]\n\n## 7. Command 扩展\n\n命令扩展分两层：\n\n- 静态命令：`hermes_cli/commands.py` 的 `CommandDef` registry。\n- 插件命令：`PluginContext.register_cli_subcommand` 和 `register_slash_command`。[H-007][H-008]\n\n消费方：\n\n- CLI 交互命令。\n- Gateway known commands。\n- Slack native slash commands。\n- TUI `slash.exec` 和命令补全。[H-007][H-013]\n\n设计点：\n\n- 命令作为数据结构能被不同入口共享，避免 CLI/Gateway/TUI 分别维护命令表。\n\n## 8. Context Engine 扩展\n\n`agent_init` 支持 plugin context engine 或 built-in compressor，并把 context engine tool schemas 注入 tool schema，仍受 gating/dedup 控制。[H-004][H-008]\n\n设计点：\n\n- 上下文压缩既是运行时能力，也可能对模型可见，因此需要与 tool schema 管线打通。\n- `conversation_loop` 会在 preflight 阶段进行 context compression，并在模型调用前注入 context。[H-004]\n\n## 9. 扩展点取舍\n\n值得学习：\n\n- 把扩展点按问题域拆开：Provider、Memory、Platform 不强塞进同一种插件接口。\n- 所有工具最终进入统一 Registry，减少执行路径分叉。\n- 插件 hook fail-open，降低扩展故障的系统级影响。\n- 平台插件优先于内置 if/elif，使新平台可不动核心路径。\n\n需要谨慎：\n\n- 扩展点过多会提高理解成本。\n- Hook 权限边界、加载顺序和冲突处理需要清晰文档。\n- Gateway platform 的 Adapter contract 很厚，新增平台学习成本不低。\n"},{"file":"design-philosophy.md","label":"设计思想","content":"# 设计思想\n\n## 1. 多入口，共用内核\n\nHermes Agent 最清晰的设计思想是：入口可以很多，但 Agent core 尽量只有一套。官方 README/docs 展示的 CLI、TUI、Gateway、ACP、cron 等能力，在本地源码里都会回到 `AIAgent` 和 `run_conversation`，入口层负责适配输入输出，运行时负责模型、工具、记忆、上下文和持久化。[H-003][H-004][H-013][H-015][H-016][EXT-HA-001]\n\n价值：\n\n- 用户体验可以多样化，但运行时能力一致。\n- 工具、记忆、Provider、hook 不需要为每个入口重复实现。\n- CLI/TUI/Gateway 行为差异更容易定位在入口层。\n\n代价：\n\n- `AIAgent` 初始化参数很多，入口事实会不断向核心对象汇聚。\n- 共享内核要求 session、profile、toolset、system prompt 的稳定性非常高。\n\n## 2. 稳定系统提示词优先\n\n`conversation_loop` 明确构建和恢复 cached system prompt，并把 plugin/memory/context 注入当前 user message，而不是随意改动 system prompt。[H-004]\n\n设计含义：\n\n- Prompt caching 是运行时重要优化，也是一条架构约束。\n- 中途修改 system prompt/tool schema 会放大缓存失效和行为不一致风险。\n- 扩展点应该尽量有清楚的注入位置，不要任意改写核心 prompt。\n\n## 3. 注册表驱动工具，而不是散落分发\n\n官方 Toolsets 文档将工具能力控制描述为按平台/会话/任务选择工具 bundle；源码里这个设计落在 `ToolRegistry`、`model_tools` 和 `toolsets.py` 上，built-in tools 和 plugin tools 最终都进入 registry，再统一生成 schema、做 toolset 过滤和 dispatch。[H-005][H-006][EXT-HA-002]\n\n设计含义：\n\n- Tool schema、availability、dispatch、error wrapping 有统一路径。\n- Plugin tools 能被同一 toolset、UI 和模型调用管线消费。\n- generation counter + cache 可以降低 schema 构建成本。\n\n代价：\n\n- 工具模块 import 有副作用，需要约束导入时机。\n- Registry 需要处理 override、alias、availability 和缓存一致性。\n\n## 4. 扩展点按问题域分层\n\nHermes 没有把所有能力都塞进一个插件接口，而是拆成：\n\n- 通用插件：工具、hook、命令、context engine、gateway platform 等。[H-008]\n- Provider Profile：模型 Provider 差异。[H-011]\n- Memory Provider：长期记忆系统。[H-012]\n- Gateway Platform：消息平台 Adapter。[H-010]\n\n价值：\n\n- 每类扩展点都能使用更贴合问题域的 contract。\n- Provider 和 Memory 不需要通过脆弱的通用 hook 模拟。\n- Gateway platform 可以拥有完整 adapter lifecycle。\n\n代价：\n\n- 新读者需要先理解扩展点地图。\n- 插件冲突、加载顺序、启用策略和信任边界需要更强文档支撑。\n\n## 5. Session identity 是多平台 Agent 的基础设施\n\nGateway 的 `SessionSource`、`SessionContext` 和 session key 构造说明 Hermes 把 session identity 当成一等概念。平台、chat、thread、user、shared multi-user 等事实都进入 session 构造。[H-009]\n\n设计含义：\n\n- 多平台系统不能只按“用户 id”或“chat id”粗暴分流。\n- 群聊、线程、私聊、共享会话、平台来源都要进 identity model。\n- session key 需要稳定、可解释、可持久化。\n\n## 6. Profile 隔离与可运维性\n\nCLI 在完整 parser 前预解析 profile 并设置 `HERMES_HOME`；cron job 也支持 profile context，运行时会临时切换 Hermes home 和环境变量再恢复。[H-003][H-016]\n\n设计含义：\n\n- 本地优先 Agent 会天然面对多个配置、身份、模型密钥和工作目录。\n- profile 应该在最早阶段生效，避免部分模块读错配置。\n- 定时任务和后台流程要特别注意环境变量隔离。\n\n## 7. Fail-open 插件 Hook\n\n通用插件 hook 的执行倾向 fail-open，单个插件异常不会直接中断主流程。[H-008]\n\n价值：\n\n- 保证插件生态不会轻易拖垮核心对话。\n- 对用户安装的 project/user plugin 更友好。\n\n风险：\n\n- 插件失败如果只被吞掉，会影响可观测性。\n- 安全类 hook 是否允许 fail-open 要单独判断，不能一概而论。\n\n## 8. 大入口文件背后的现实取舍\n\n`gateway/run.py` 和 `hermes_cli/main.py` 都非常大。它们承担了大量真实世界的兼容、平台差异、配置、升级、错误恢复和用户体验逻辑。\n\n可以学习的不是“大文件本身”，而是它暴露出的事实：\n\n- 多入口 Agent 的复杂度首先堆在边界层。\n- 平台 Adapter、认证、session、streaming delivery 和 agent 调度很难完全隔离。\n- 当项目快速支持大量平台时，必须用测试和文档持续压住边界复杂度。\n\n## 9. 总结\n\nHermes Agent 的核心思想可以概括为：\n\n- 入口多样化，运行时统一。\n- 工具注册表化，命令数据化。\n- Provider/Memory/Platform 按问题域建 contract。\n- 系统提示词稳定性优先。\n- 多平台会话先建 identity model。\n- 插件失败隔离，但必须保留可观测性。\n"},{"file":"comparison.md","label":"横向对比","content":"# 横向对比\n\n## 1. 本轮对比边界\n\n本文件不是完整横向评测，只基于本轮 Hermes Agent 调研和已完成的 OpenClaw 调研，整理可用于后续同规格对照的维度。当前结论属于架构观察，不代表功能优劣排名。\n\n## 2. 对比维度\n\n| 维度 | Hermes Agent 观察 | 对照时应关注的问题 |\n|---|---|---|\n| 产品入口 | CLI、TUI、Gateway、ACP、cron 并重，入口最终回到 `AIAgent` | 同类项目是否有统一 runtime，还是每个入口一套逻辑 |\n| Agent core | `AIAgent` 门面 + `agent_init` + `conversation_loop` | core 是否与渠道、UI、平台适配解耦 |\n| 工具系统 | `ToolRegistry` + `model_tools` + toolsets | 工具是否有统一 schema/filter/dispatch |\n| 插件系统 | 通用插件、Provider、Memory、Platform 分层 | 插件是通用 hook 还是按问题域建 contract |\n| 多平台消息 | Gateway Adapter + `MessageEvent` + session key | 是否把平台差异封装在 Adapter 边界 |\n| 会话身份 | `SessionSource`/`SessionContext` 建确定性 session key | 群聊、线程、用户、平台隔离是否清楚 |\n| 模型 Provider | `ProviderProfile` 描述 Provider 行为 | Provider 差异是否污染主循环 |\n| 记忆系统 | 内置记忆 + 一个外部 Memory Provider | 记忆是否参与 prompt、prefetch、tool schema 和 turn sync |\n| TUI | Node/Ink 前端 + Python JSON-RPC gateway | UI 是否复用 Agent core，是否有清楚传输协议 |\n| 定时任务 | cron job storage + scheduler + Agent run + delivery | 后台任务是否复用同一 Agent/tool/profile 体系 |\n| 安全/运维 | exact pins、profile isolation、stdout protocol hygiene、prompt injection scan | 运行边界是否被系统性处理 |\n\n## 3. Hermes 与 OpenClaw 的初步观察\n\n| 主题 | Hermes Agent | OpenClaw |\n|---|---|---|\n| 主要形态 | 本地 AI Agent CLI/TUI/Gateway，多平台个人助手 | 本地优先个人 AI Assistant / Gateway control plane |\n| 核心入口 | `AIAgent` + `run_conversation` | Gateway control plane + Agent runtime |\n| 扩展思想 | 多种 registry/profile/provider/plugin 分层 | manifest/control-plane 先行，capability ownership 更突出 |\n| 消息渠道 | Gateway adapter 支持很多平台，内置 if/elif 与 plugin registry 并存 | Channel/plugin contract 更强调 capability 与 ownership |\n| 工具面 | ToolRegistry 和 toolset 非常清晰 | 插件 capability model 更宽，工具只是能力之一 |\n| 复杂度分布 | `gateway/run.py`、`hermes_cli/main.py` 边界层很大 | Gateway、plugin loader、protocol/control plane 边界复杂 |\n\n## 4. Hermes 的相对特点\n\n更突出的地方：\n\n- Python Agent loop、tool registry、Provider Profile 和 Memory Provider 的学习路径清楚。\n- CLI/TUI/Gateway/ACP/cron 共享 Agent core 的思路非常直观。\n- toolset 对模型可见工具的控制比较系统。\n- TUI gateway 对 stdout/JSON-RPC 协议洁净度、长耗时 handler、signal 日志有大量工程细节。[H-013]\n- cron 对 profile、toolset、prompt injection 和 delivery 的处理体现了本地 Agent 后台任务的现实需求。[H-016]\n\n需要警惕的地方：\n\n- Gateway 和 CLI main 文件体量大，边界层理解成本高。\n- 插件入口多，概念上需要先画清楚通用插件、Provider、Memory、Platform 的关系。\n- 多平台支持越多，测试矩阵和配置矩阵越复杂。\n\n## 5. 后续可选对比对象\n\n建议选择以下对象之一做同规格调研：\n\n- LangGraph：对比 graph/state machine 与 conversation loop。\n- OpenHands：对比软件工程 Agent 的工具/沙箱/任务执行模型。\n- Dify：对比平台化 Agent workflow 与插件/工具生态。\n- Home Assistant Assist：对比本地多设备/多集成控制面。\n- Botpress 或 Rasa：对比对话平台中的渠道 Adapter 和 session 管理。\n"},{"file":"adoption-notes.md","label":"学习借鉴","content":"# 学习借鉴笔记\n\n## 1. 直接值得学习的设计\n\n| 设计 | 学习点 | 证据 |\n|---|---|---|\n| 多入口共享 `AIAgent` | CLI/TUI/Gateway/ACP/cron 不重复实现 Agent loop | [H-003][H-004][H-013][H-015][H-016] |\n| 稳定 system prompt | 把 plugin/memory/context 注入当前 user message，减少破坏 prompt caching 的机会 | [H-004] |\n| 中央 ToolRegistry | built-in 和 plugin tools 统一 schema/filter/dispatch | [H-005][H-006][H-008] |\n| Toolset gating | 控制模型可见工具面，支持按平台/任务场景收敛能力 | [H-006][H-007] |\n| Provider Profile | 用 profile 描述模型 Provider 差异，避免污染主循环 | [H-011] |\n| Session identity model | 用 `SessionSource`/`SessionContext` 明确平台、chat、thread、user、shared session | [H-009] |\n| Profile isolation | CLI 启动前设置 `HERMES_HOME`，cron job 可切 profile 并恢复环境 | [H-003][H-016] |\n| TUI JSON-RPC hygiene | stdout 专用于协议，stderr/log 做诊断，长耗时 handler 入线程池 | [H-013] |\n\n## 2. 需要结合上下文理解的设计\n\n| 设计 | 好处 | 需要注意 |\n|---|---|---|\n| Gateway cached AIAgent | 减少频繁初始化成本 | 配置签名、session 隔离、状态污染需要严格测试 |\n| Fail-open plugin hooks | 插件失败不拖垮主流程 | 安全类 hook 不能简单 fail-open，需要单独策略 |\n| 一个外部 Memory Provider | 降低多个记忆系统冲突 | 如果需要多记忆源，需要额外合并和优先级模型 |\n| Platform plugin 优先内置 adapter | 新平台可通过插件扩展 | Adapter contract 厚，新平台接入成本仍高 |\n| cron 复用 Agent | 定时任务可用同一工具/模型/记忆能力 | 非交互运行必须加强 prompt injection 和权限边界 |\n\n## 3. 不宜直接照搬的部分\n\n| 现象 | 原因 |\n|---|---|\n| 超大 `gateway/run.py` | 真实世界兼容逻辑很多，但学习时应先理解边界和流程，不把大文件当作目标形态 |\n| 超大 `hermes_cli/main.py` | CLI 命令、setup、profile、gateway、TUI、doctor 等聚合度高，阅读成本大 |\n| 很多平台一次性接入 | 平台越多，认证、配置、session、delivery 和测试矩阵越重 |\n| Hook 面过宽 | 强扩展性会带来隐式行为和调试复杂度 |\n| 工具默认面过宽 | 模型可见工具太多会影响安全、成本和行为稳定性 |\n\n## 4. 学习路线建议\n\n1. 先读 `run_agent.py`、`agent/agent_init.py`、`agent/conversation_loop.py`，理解 Agent core。\n2. 再读 `tools/registry.py`、`model_tools.py`、`toolsets.py`，理解工具能力面。\n3. 接着读 `hermes_cli/plugins.py`、`providers/*`、`plugins/memory/*`，理解扩展点分层。\n4. 最后读 `gateway/run.py`、`gateway/session.py`、`gateway/platforms/base.py`，理解多平台消息和 session。\n5. 如果关注 TUI/ACP/cron，再分别进入 `tui_gateway`、`acp_adapter`、`cron`。\n\n## 5. 可复用思想清单\n\n- 入口适配层只做 transport/UI/platform 差异，Agent loop 统一。\n- 工具注册、工具过滤、工具执行走同一条路径。\n- Provider 差异通过 profile/hook 描述，不散落在主循环。\n- Memory 是可参与 prompt、prefetch、sync、tool schema 的运行时能力。\n- Session identity 先建模，再处理消息。\n- 本地 Agent 必须把 profile、env、stdout/stderr、日志、文件权限当成架构问题。\n- 插件 hook 要有错误隔离，也要有可观测性。\n\n## 6. 待验证问题\n\n- Gateway cached AIAgent 在配置变化、toolset 变化、profile 变化时如何失效。\n- plugin hook 的错误日志和用户可见诊断是否足够。\n- 各平台 Adapter 是否都遵守相同 session 与 streaming delivery 语义。\n- Memory Provider tool schema 与普通 tool schema 冲突时的实际处理。\n- TUI prompt submit 与 CLI chat 在 session persistence 上是否完全一致。\n"},{"file":"source-map.md","label":"源码地图","content":"# 源码地图\n\n## 1. 快照信息\n\n| 项 | 内容 |\n|---|---|\n| 项目标识 | `hermes-agent` |\n| branch | `main` |\n| commit | `cae7537359c0ba8fceedc0a6423a4d9f30972100` |\n| remote | `https://github.com/NousResearch/hermes-agent.git` |\n| 工作区状态 | 存在未跟踪 `.idea/` 与 `tinker-atropos/`，本轮未修改目标仓库 |\n| source-inventory | `references/source-inventory.json`，3636 个文件 |\n\n## 2. 入口文件\n\n| 入口 | 文件 | 说明 |\n|---|---|---|\n| `hermes` wrapper | `hermes` | 本地脚本，导入 `hermes_cli.main.main` 执行 CLI |\n| Python console script | `pyproject.toml` | `hermes`, `hermes-agent`, `hermes-acp` 三个入口 |\n| CLI main | `hermes_cli/main.py` | argparse 命令树、profile override、startup discovery、chat/gateway/acp/setup 等命令 |\n| Chat CLI | `cli.py` | 传统交互 CLI，`cmd_chat` 最终导入并调用它 |\n| Agent runtime | `run_agent.py` | `AIAgent` 门面类，委托到 `agent/*` |\n| Conversation loop | `agent/conversation_loop.py` | 核心模型调用、工具调用、上下文压缩、hook、持久化循环 |\n| Gateway | `gateway/run.py` | 多平台消息入口和 delivery runtime |\n| TUI gateway | `tui_gateway/entry.py`, `tui_gateway/server.py` | TUI 前端和 Python agent core 之间的 JSON-RPC bridge |\n| ACP adapter | `acp_adapter/entry.py` | ACP stdio server 入口 |\n| Cron | `cron/jobs.py`, `cron/scheduler.py` | 定时任务存储、解析和执行 |\n\n## 3. 主要目录\n\n| 目录 | 职责 |\n|---|---|\n| `agent/` | Agent 初始化、主循环、记忆 Provider、上下文、LSP/transport/secret 等运行时支撑 |\n| `tools/` | built-in tools、registry、执行环境、MCP tool、浏览器/文件/shell 等工具实现 |\n| `hermes_cli/` | CLI 命令、配置、profile、插件发现、slash command、doctor/setup/update 等 |\n| `gateway/` | Gateway runner、平台 adapter、session model、platform registry、平台配置 |\n| `gateway/platforms/` | 平台 adapter 基类和内置 Telegram/Slack/Discord/WhatsApp/Signal 等实现 |\n| `plugins/` | bundled plugins、memory plugins、model provider plugins 等 |\n| `providers/` | Provider Profile 基类、发现与注册逻辑 |\n| `cron/` | cron job model、scheduler、delivery |\n| `tui_gateway/` | TUI bridge server、transport、render、slash worker |\n| `ui-tui/` | Ink/Node TUI 前端 |\n| `acp_adapter/` | Agent Client Protocol adapter |\n| `skills/`, `optional-skills/` | Hermes skill 资源 |\n| `tests/` | 大量单元测试/集成测试，覆盖工具、网关、插件、TUI、cron 等 |\n| `docs/` | 用户文档和架构/工具/安全/MCP/Memory/Skills 等文档 |\n\n## 4. 核心文件体量\n\n| 文件 | 行数 | 观察 |\n|---|---:|---|\n| `gateway/run.py` | 18270 | Gateway 聚合了大量平台、session、agent 调度和 delivery 逻辑 |\n| `hermes_cli/main.py` | 13817 | CLI 命令树与 startup 流程集中度很高 |\n| `run_agent.py` | 4309 | Agent 门面仍然很大，但核心循环已抽到 `agent/conversation_loop.py` |\n| `gateway/platforms/base.py` | 3923 | 平台消息模型和 Adapter contract 集中在这里 |\n| `hermes_cli/commands.py` | 1819 | slash/native command registry |\n| `hermes_cli/plugins.py` | 1593 | 通用插件发现、注册和 hook 执行 |\n| `gateway/session.py` | 1348 | session identity、context、store |\n| `model_tools.py` | 923 | tool schema 生成和 tool call 分发 |\n| `toolsets.py` | 866 | toolset 定义与过滤 |\n\n## 5. 建议阅读顺序\n\n1. `README.md` 与 `pyproject.toml`：确认产品定位、能力表、入口和依赖策略。[H-001][H-002]\n2. `hermes_cli/main.py`：看 `main()`、`_apply_profile_override()`、`cmd_chat()`、`_prepare_agent_startup()`，理解 CLI 如何进入运行时。[H-003][H-014]\n3. `run_agent.py`：看 `AIAgent` 构造、`run_conversation()` 和 `chat()`，理解 Agent 门面。[H-004]\n4. `agent/agent_init.py` 与 `agent/conversation_loop.py`：理解初始化、系统提示词、上下文压缩、工具定义、hook、记忆和结果收尾。[H-004]\n5. `tools/registry.py`、`model_tools.py`、`toolsets.py`：理解工具注册、schema 生成、toolset gating、dispatch。[H-005][H-006][H-007]\n6. `hermes_cli/plugins.py`、`providers/*`、`plugins/memory/*`、`gateway/platform_registry.py`：理解扩展点分层。[H-008][H-010][H-011][H-012]\n7. `gateway/run.py`、`gateway/session.py`、`gateway/platforms/base.py`：理解外部消息如何进入 Agent、如何确定 session、如何投递响应。[H-009]\n8. `tui_gateway/entry.py`、`tui_gateway/server.py`、`cron/*`、`acp_adapter/*`：理解非 CLI 入口如何接入同一核心。[H-013][H-015][H-016]\n\n## 6. 需要继续深挖的目录\n\n- `tests/gateway*`、`tests/test_*plugin*`、`tests/test_*cron*`：可以用来验证静态推断。\n- `ui-tui/src`：前端状态机和事件消费还未展开。\n- `plugins/model-providers/*`：不同 Provider Profile 的真实差异。\n- `gateway/platforms/*`：平台 Adapter 的一致性和特殊边界。\n- `tools/environments/*`：工具执行沙箱、shell、browser 的运行约束。\n"},{"file":"evidence-index.md","label":"证据索引","content":"# 证据索引\n\n## 1. 版本信息\n\n本文件也可以理解为 Evidence Log，用于约束关键结论必须有证据。\n\n| 项 | 内容 |\n|---|---|\n| 代码来源 | `https://github.com/NousResearch/hermes-agent.git` |\n| 项目标识 | `hermes-agent` |\n| branch/tag/commit | branch `main`, commit `cae7537359c0ba8fceedc0a6423a4d9f30972100` |\n| 调研日期 | 2026-05-25 |\n\n## 2. 证据索引\n\n| 结论编号 | 结论 | 证据类型 | 位置 | 置信度 | 备注 |\n|---|---|---|---|---|---|\n| \u003ca id=\"H-001\"\u003e\u003c/a\u003eH-001 | Hermes Agent 定位为 self-improving AI agent，能力包括 TUI、Messaging Gateway、learning loop、cron、delegation、多 backend、research batch 等 | doc fact | `README.md:15`, `README.md:19-27`, `README.md:66-78`, `README.md:103-119`, `README.md:123-143` | 高 | README 产品定位和入口 |\n| \u003ca id=\"H-002\"\u003e\u003c/a\u003eH-002 | package 为 `hermes-agent` `0.14.0`，Python `\u003e=3.11`，console scripts 包含 `hermes`, `hermes-agent`, `hermes-acp`，依赖采用 exact-pin/optional extras 策略 | source fact | `pyproject.toml:5-12`, `pyproject.toml:13-33`, `pyproject.toml:69-207`, `pyproject.toml:209-212`, `pyproject.toml:226-227` | 高 | 包和依赖策略 |\n| \u003ca id=\"H-003\"\u003e\u003c/a\u003eH-003 | CLI wrapper 进入 `hermes_cli.main.main`，main 支持 profile override、startup discovery、默认 chat command | source fact | `hermes:1-11`, `hermes_cli/main.py:183-235`, `hermes_cli/main.py:10758-10799`, `hermes_cli/main.py:10928-10953` | 高 | CLI 入口 |\n| \u003ca id=\"H-004\"\u003e\u003c/a\u003eH-004 | `AIAgent` 是 Agent 门面，初始化委托 `agent_init`，主循环委托 `conversation_loop`；lo e":"research-review.md","label":"调研审查","content":"# 调研审查\n\nStatus: draft\nLast Updated: 2026-05-25\n\n## 1. 审查结论\n\n本轮调研已按新版流程补充外部资料阶段：已固定代码快照，覆盖官方 GitHub README、Hermes docs、Release 文件入口和本地源码，并将外部观点转成研究问题后用现有源码证据验证。关键结论能回溯到官方资料、源码或仓库文档。\n\n## 2. 覆盖情况\n\n| 检查项 | 状态 | 说明 |\n|---|---|---|\n| 固定版本/commit | 通过 | `main@cae7537359c0ba8fceedc0a6423a4d9f30972100` |\n| 外部资料调研 | 通过 | external-research.md 已覆盖官方 GitHub、docs、toolsets/plugins/memory/gateway/cron 文档 |\n| 研究问题验证 | 通过 | research-questions.md 已记录 RQ-HA-001 到 RQ-HA-006 |\n| 结构化源码清单 | 通过 | references/source-inventory.json 已生成，覆盖 3636 个文件 |\n| Dashboard | 通过 | dashboard.html 已生成阅读入口 |\n| 模块关系说明 | 通过 | source-map.md 与 architecture.md 已覆盖 |\n| 至少一条运行链路 | 通过 | runtime-flows.md 覆盖 CLI chat、Agent loop、Tool call、Gateway、TUI、cron |\n| 可视化架构图 | 通过 | visual/architecture.html 负责渲染，visual/architecture.visual.js 承接图数据与证据链接；visual/evidence.html 提供可点击证据查看 |\n| 证据索引 | 通过 | evidence-index.md 记录 H-001 到 H-016，并补充 EXT-HA-001 到 EXT-HA-005 |\n| 区分事实与推断 | 通过 | evidence-index.md 区分源码/仓库文档/官方资料/推断 |\n| 学习借鉴建议 | 通过 | adoption-notes.md |\n| 横向对照 | 部分完成 | comparison.md 给出对照维度和与 OpenClaw 的初步观察 |\n| 自动校验 | 通过 | `validate-research.js research/hermes-agent` 已通过 |\n\n## 3. 主要风险\n\n| 风险 | 影响 | 建议 |\n|---|---|---|\n| 未运行 Hermes | 无法证明 live behavior 与静态代码完全一致 | 下一轮用最小配置跑 CLI 或 dry-run 流程 |\n| 未跑测试 | 不能确认边界条件和回归保护 | 优先跑 tool registry、plugin、gateway session、cron 相关测试 |\n| Gateway 文件过大 | 静态阅读可能遗漏局部异常路径 | 后续按具体平台和 session 类型做定向追踪 |\n| TUI 前端未深入 | 只能确认 bridge 架构，不能评价 UI 状态机 | 进入 `ui-tui/src` 看事件消费和渲染模型 |\n| 插件实现未抽样 | 扩展点结论主要来自框架层 | 选一个 provider、memory、platform plugin 做完整链路 |\n| 未采用第三方实践资料 | 缺少社区踩坑和实践视角 | 后续补 GitHub issue/PR 主题和用户文章 |\n\n## 4. 需要补充的证据\n\n- 一次 `hermes --version`、`hermes doctor` 或 `hermes --help` 的实际输出。\n- 一个最小 CLI prompt 的 session/log/trajectory 生成结果。\n- 一个 plugin tool 动态注册后的 tool schema。\n- 一个 gateway adapter 的真实 inbound `MessageEvent` 样例。\n- 一个 cron job 的保存输出与 delivery 行为。\n- 一个 TUI `prompt.submit` 到 `message.delta` 的实际 JSON-RPC trace。\n\n## 5. 审查意见\n\n这版文档已经可以作为学习 Hermes Agent 架构的第一层地图。下一步不建议继续泛读全仓库，而是选择两个窄问题深挖：\n\n1. Tool/plugin deep dive：安装或启用一个插件工具，观察 registry、toolset、model schema 和 dispatch。\n2. Gateway/session deep dive：选一个平台 Adapter，从 inbound event 追踪到 session key、AIAgent 调用和 delivery。\n"}];
    window.RESEARCH_VISUALS = [{"file":"visual/architecture.html","label":"可视化架构图","desc":"专门的交互式架构图查看器"},{"file":"visual/evidence.html","label":"证据查看器","desc":"从架构图回到证据解释"}];
    const docs = new Map(window.RESEARCH_DOCS.map(doc => [doc.file, doc]));
    const visuals = new Map(window.RESEARCH_VISUALS.map(doc => [doc.file, doc]));
    const params = new URLSearchParams(window.location.search);
    const requestedVisual = params.get('view') || '';
    const requested = params.get('doc') || (requestedVisual ? '' : 'README.md');
    const current = requestedVisual
      ? visuals.get(requestedVisual)
      : (docs.get(requested) || window.RESEARCH_DOCS[0]);
    const container = document.getElementById('doc');
    document.querySelectorAll('[data-nav-file]').forEach(link => {
      if (current && link.dataset.navFile === current.file) link.classList.add('active');
    });
    if (!current) {
      container.innerHTML = '<p class="missing">没有可展示的文档。</p>';
    } else if (requestedVisual) {
      container.outerHTML = renderVisual(current);
    } else {
      container.innerHTML = renderDocument(current);
      renderMermaidBlocks();
      if (window.location.hash) {
        const target = document.getElementById(decodeURIComponent(window.location.hash.slice(1)));
        if (target) target.scrollIntoView();
      }
    }

    function renderVisual(doc) {
      const hash = window.location.hash || '';
      return '<section class="visual-doc"><div class="visual-head"><h1>' + escapeHtml(doc.label) + '</h1><p>' + escapeHtml(doc.desc || '') + '</p></div><iframe class="visual-frame" src="./' + escapeAttr(doc.file + hash) + '" title="' + escapeAttr(doc.label) + '"></iframe></section>';
    }

    function renderDocument(doc) {
      if (doc.file.endsWith('.json')) {
        return '<h1>' + escapeHtml(doc.label) + '</h1><pre><code>' + escapeHtml(formatJson(doc.content)) + '</code></pre>';
      }
      return renderMarkdown(doc.content);
    }

    function renderMarkdown(markdown) {
      const lines = markdown.replace(/\r\n/g, '\n').split('\n');
      const out = [];
      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        if (!line.trim()) { i += 1; continue; }
        const fence = line.match(/^\s*\x60\x60\x60(.*)$/);
        if (fence) {
          const lang = fence[1].trim().split(/\s+/)[0].toLowerCase();
          const code = [];
          i += 1;
          while (i < lines.length && !/^\s*\x60\x60\x60/.test(lines[i])) {
            code.push(lines[i]);
            i += 1;
          }
          i += 1;
          if (lang === 'mermaid') {
            out.push(renderMermaidSource(code.join('\n')));
            continue;
          }
          out.push('<pre><code>' + escapeHtml(code.join('\n')) + '</code></pre>');
          continue;
        }
        const heading = line.match(/^(#{1,4})\s+(.+)$/);
        if (heading) {
          const level = heading[1].length;
          const text = stripAnchorText(heading[2]);
          const id = heading[2].match(/<a\s+id="([^"]+)"><\/a>/) || [];
          const headingId = id[1] || slug(text);
          out.push('<h' + level + ' id="' + escapeAttr(headingId) + '">' + inline(heading[2]) + '</h' + level + '>');
          i += 1;
          continue;
        }
        if (isTableStart(lines, i)) {
          const tableLines = [];
          while (i < lines.length && /^\s*\|/.test(lines[i])) {
            tableLines.push(lines[i]);
            i += 1;
          }
          out.push(renderTable(tableLines));
          continue;
        }
        if (/^\s*[-*]\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
            items.push(lines[i].replace(/^\s*[-*]\s+/, ''));
            i += 1;
          }
          out.push('<ul>' + items.map(item => '<li>' + inline(item) + '</li>').join('') + '</ul>');
          continue;
        }
        if (/^\s*\d+\.\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
            items.push(lines[i].replace(/^\s*\d+\.\s+/, ''));
            i += 1;
          }
          out.push('<ol>' + items.map(item => '<li>' + inline(item) + '</li>').join('') + '</ol>');
          continue;
        }
        if (/^>\s?/.test(line)) {
          const quote = [];
          while (i < lines.length && /^>\s?/.test(lines[i])) {
            quote.push(lines[i].replace(/^>\s?/, ''));
            i += 1;
          }
          out.push('<blockquote>' + quote.map(inline).join('<br>') + '</blockquote>');
          continue;
        }
        const para = [];
        while (i < lines.length && lines[i].trim() && !isBlockStart(lines, i)) {
          para.push(lines[i]);
          i += 1;
        }
        out.push('<p>' + inline(para.join(' ')) + '</p>');
      }
      return out.join('\n');
    }

    function isBlockStart(lines, idx) {
      const line = lines[idx] || '';
      return /^\s*\x60\x60\x60/.test(line) || /^(#{1,4})\s+/.test(line) || /^\s*\|/.test(line) || /^\s*[-*]\s+/.test(line) || /^\s*\d+\.\s+/.test(line) || /^>\s?/.test(line);
    }

    function isTableStart(lines, idx) {
      return /^\s*\|/.test(lines[idx] || '') && idx + 1 < lines.length && /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[idx + 1] || '');
    }

    function renderTable(tableLines) {
      const rows = tableLines.filter((_, idx) => idx !== 1).map(splitRow);
      if (!rows.length) return '';
      const header = rows[0].map(cell => '<th>' + inline(cell) + '</th>').join('');
      const body = rows.slice(1).map(row => '<tr>' + row.map(cell => '<td>' + inline(cell) + '</td>').join('') + '</tr>').join('');
      return '<table><thead><tr>' + header + '</tr></thead><tbody>' + body + '</tbody></table>';
    }

    function splitRow(row) {
      let value = row.trim();
      if (value.startsWith('|')) value = value.slice(1);
      if (value.endsWith('|')) value = value.slice(0, -1);
      return value.split('|').map(cell => cell.trim());
    }

    function renderMermaidSource(source) {
      return '<div class="mermaid-block" data-mermaid-pending="true"><div class="mermaid-status">正在渲染 Mermaid 图形...</div><pre class="mermaid-source"><code>' + escapeHtml(source) + '</code></pre></div>';
    }

    var mermaidLoadPromise;
    function ensureMermaid() {
      if (window.mermaid) return Promise.resolve(window.mermaid);
      if (mermaidLoadPromise) return mermaidLoadPromise;
      mermaidLoadPromise = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js';
        script.onload = () => window.mermaid ? resolve(window.mermaid) : reject(new Error('Mermaid 脚本未初始化'));
        script.onerror = () => reject(new Error('Mermaid 脚本加载失败'));
        document.head.appendChild(script);
      });
      return mermaidLoadPromise;
    }

    async function renderMermaidBlocks() {
      const blocks = [...document.querySelectorAll('.mermaid-block[data-mermaid-pending="true"]')];
      if (!blocks.length) return;
      let mermaidApi;
      try {
        mermaidApi = await ensureMermaid();
        mermaidApi.initialize({
          startOnLoad: false,
          securityLevel: 'strict',
          theme: 'default',
          flowchart: { htmlLabels: true, curve: 'basis' }
        });
      } catch (error) {
        blocks.forEach(block => markMermaidFailed(block, error));
        return;
      }
      for (let index = 0; index < blocks.length; index += 1) {
        const block = blocks[index];
        const source = block.querySelector('.mermaid-source')?.textContent || '';
        try {
          const id = 'mermaid-' + Date.now() + '-' + index;
          const result = await mermaidApi.render(id, source);
          block.innerHTML = '<div class="mermaid-rendered">' + result.svg + '</div>';
          block.classList.add('rendered');
          block.removeAttribute('data-mermaid-pending');
        } catch (error) {
          markMermaidFailed(block, error);
        }
      }
    }

    function markMermaidFailed(block, error) {
      block.classList.add('failed');
      block.removeAttribute('data-mermaid-pending');
      const status = block.querySelector('.mermaid-status');
      if (status) status.textContent = 'Mermaid 图形渲染失败，下面保留原始源码：' + (error && error.message ? error.message : '未知错误');
    }

    function inline(value) {
      let html = escapeHtml(value);
      html = html.replace(/&lt;a\s+id=&quot;([^&]+)&quot;&gt;&lt;\/a&gt;/g, '<a id="$1"></a>');
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, text, href) => '<a href="' + escapeAttr(rewriteHref(href)) + '">' + escapeHtml(text) + '</a>');
      html = html.replace(/\x60([^\x60]+)\x60/g, '<code>$1</code>');
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      return html;
    }

    function rewriteHref(href) {
      if (/^(https?:|mailto:|#)/.test(href)) return href;
      const hashIndex = href.indexOf('#');
      const hash = hashIndex >= 0 ? href.slice(hashIndex) : '';
      const clean = hashIndex >= 0 ? href.slice(0, hashIndex) : href;
      if (docs.has(clean)) return './docs.html?doc=' + encodeURIComponent(clean) + hash;
      return href;
    }

    function stripAnchorText(value) {
      return value.replace(/<a\s+id="[^"]+"><\/a>/g, '').replace(new RegExp('[#\\x60*_]', 'g'), '').trim();
    }

    function slug(value) {
      return stripAnchorText(value).toLowerCase().replace(/\s+/g, '-').replace(/[^\w\u4e00-\u9fa5-]/g, '');
    }

    function formatJson(value) {
      try { return JSON.stringify(JSON.parse(value), null, 2); } catch { return value; }
    }

    function escapeHtml(value) {
      return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(new RegExp('\\x60', 'g'), '&#96;');
    }
  </script>
