  <script>
    window.RESEARCH_DOCS = [{"file":"README.md","label":"总览文档","content":"# OpenClaw 技术调研\n\nStatus: draft\nOwner: cheng / Codex\nLast Updated: 2026-05-25\n\n## 调研摘要\n\nOpenClaw 是一个本地优先的个人 AI Assistant / Gateway 项目。它把多渠道消息、设备节点、Agent 运行时、工具、模型 Provider、插件和会话管理统一到一个长期运行的 Gateway 控制平面中；真正的产品定位不是 Gateway 本身，而是“能在用户设备和渠道里做事的个人助手”。[C-001][C-004]\n\n本轮调研固定在本地快照 `/Users/cheng/IdeaProjects/openclaw`，branch `main`，commit `989e53c20d395d3c8bf47efc21fdb9d56e7227b0`。这是第一版架构级调研，重点覆盖 Gateway、Agent runtime、Plugin/capability model、Channel、Session/Multi-agent 和可借鉴设计，不覆盖每个具体渠道、移动端 App、完整 Provider 实现细节。\n\n## 文件导航\n\n| 文件 | 说明 |\n|---|---|\n| research-brief.md | 调研目标、范围、问题和交付物 |\n| external-research.md | 官方资料、协作资料、外部观点和源码验证关系 |\n| research-questions.md | 从外部资料生成的源码验证问题 |\n| source-map.md | 仓库结构、入口、模块和阅读顺序 |\n| dashboard.html | 浏览器阅读入口，导航 Markdown、可视化图和辅助材料 |\n| docs.html | UTF-8 文档阅读器，避免浏览器直接打开 Markdown 乱码 |\n| references/source-inventory.json | 确定性源码扫描索引，辅助定位入口、测试、示例、构建和配置 |\n| architecture.md | 技术架构、模块边界和依赖方向 |\n| visual/architecture.html | HTML 可视化结构图，展示 Gateway、Agent Runtime、Plugin Capability 和状态边界 |\n| visual/architecture.visual.js | 可视化图数据，承接 Markdown 结论和证据链接 |\n| visual/evidence.html | 可点击证据解释页，展示架构语境和源码/文档片段 |\n| visual/evidence.visual.js | 从 evidence-index.md 和 architecture.visual.js 抽取的证据解释数据 |\n| key-abstractions.md | 核心抽象、接口、数据结构和生命周期 |\n| extension-points.md | 插件、Hook、Registry、Provider 等扩展机制 |\n| runtime-flows.md | 主流程追踪和关键状态变化 |\n| design-philosophy.md | 设计思想和关键取舍 |\n| comparison.md | 横向对比占位和后续对比对象 |\n| adoption-notes.md | 学习借鉴笔记 |\n| evidence-index.md | 证据索引 |\n| research-review.md | 调研审查 |\n\n## 当前结论\n\n- OpenClaw 官方文档和本地源码共同指向同一核心：它最值得学习的不是“接了很多聊天渠道”，而是把多渠道接入、Agent 执行、会话、工具、设备节点和插件统一成一个 Gateway control plane。[C-004][EXT-OC-001]\n- 插件体系采用“manifest 先于 runtime”的控制面设计：先用 `openclaw.plugin.json` 做身份、能力归属、配置校验和启动规划，再按需加载 runtime 注册能力。[C-010][C-011]\n- Agent 运行时是 OpenClaw 自有的 session/workspace/delivery 外壳加 Pi agent core，入口既支持 CLI，也支持 Gateway RPC；网络入口必须显式声明 `senderIsOwner` 和 `allowModelOverride`，这是非常值得借鉴的信任边界设计。[C-007][C-008]\n- 会话隔离和多 Agent 路由是产品架构的一等概念，而不是后补功能；DM、群组、cron、webhook、agent workspace、auth profile 都有明确归属。[C-009]\n- 对后续学习和单独评估最有价值的思想是：能力归属前置、核心保持 owner-agnostic、运行时热路径携带已解析事实、外部入口信任显式化、插件扩展从“能不能插”升级为“谁拥有这个 capability”。[C-003][C-010]\n\n## 待确认\n\n- 尚未逐一调研所有 bundled plugin 和 channel 的具体实现质量。\n- 尚未运行 OpenClaw 本地测试或启动 Gateway，只做了静态源码和仓库文档分析。\n- 已补充官方外部资料互证，但尚未采用独立第三方实践文章作为结论依据。\n- 横向对比对象待定，建议下一轮选择 Home Assistant、LangGraph、Dify、Botpress 或同类 Agent Gateway 项目之一做对比。\n"},{"file":"research-brief.md","label":"调研简报","content":"# 调研简报\n\nStatus: draft\nOwner: cheng / Codex\nLast Updated: 2026-05-25\n\n## 1. 研究对象\n\n| 项 | 内容 |\n|---|---|\n| 名称 | OpenClaw |\n| 代码来源 | `https://github.com/openclaw/openclaw.git` |\n| 本地路径 | `/Users/cheng/IdeaProjects/openclaw` |\n| 版本/tag/commit | branch `main`, commit `989e53c20d395d3c8bf47efc21fdb9d56e7227b0`, package version `2026.5.19` |\n| 官方文档 | 仓库内 `README.md`, `VISION.md`, `docs/**` |\n| 外部资料范围 | OpenClaw 官方 docs.openclaw.ai、GitHub repository、本地仓库 docs；本轮未采用独立第三方文章 |\n| 调研日期 | 2026-05-25 |\n\n## 2. 背景和动机\n\n本次调研面向“如何深入理解一个开源技术，并把架构、设计思想转化为后续学习和设计判断素材”。OpenClaw 的价值在于它不是单一聊天机器人，而是一个本地优先、多渠道、多 Agent、多插件、可扩展工具和设备节点的 AI Gateway。它适合用来研究以下问题：\n\n- 一个 AI 助手系统如何组织 Gateway、Agent runtime、工具、会话和消息通道。\n- 插件体系如何在“扩展能力”和“核心稳定”之间划边界。\n- 多用户/多 Agent/多渠道场景下，如何做会话、权限、安全和 delivery 设计。\n\n## 3. 研究目标\n\n- OBJ-001: 识别 OpenClaw 的核心架构分层、主模块职责和依赖方向。\n- OBJ-002: 追踪 Gateway 启动、WebSocket handshake、Agent RPC 到 runtime 执行的关键链路。\n- OBJ-003: 提炼插件、Channel、Provider、Hook、Skill、Session 等核心抽象。\n- OBJ-004: 提炼值得学习、借鉴和不宜照搬的设计思想。\n\n## 4. 核心研究问题\n\n| 编号 | 问题 | 优先级 | 预期输出 |\n|---|---|---|---|\n| Q-001 | OpenClaw 的运行时主架构是什么？ | P0 | architecture.md |\n| Q-002 | Gateway 如何启动、暴露控制面并接收客户端连接？ | P0 | runtime-flows.md |\n| Q-003 | Agent 请求如何从 RPC 进入内嵌 Agent runtime？ | P0 | runtime-flows.md |\n| Q-004 | 插件体系如何发现、验证、规划和加载能力？ | P0 | extension-points.md |\n| Q-005 | 会话、多 Agent 和安全边界如何组织？ | P1 | key-abstractions.md, architecture.md |\n| Q-006 | 哪些设计值得学习、借鉴或不宜照搬？ | P1 | adoption-notes.md |\n\n## 5. 范围\n\n### 5.1 本次研究范围\n\n- CLI/Gateway 启动链路。\n- Gateway HTTP/WebSocket 控制面。\n- Agent RPC 到 `agentCommandFromIngress`、`runEmbeddedPiAgent` 的链路。\n- Plugin manifest、registry、loader、API builder、capability model。\n- Channel plugin 和 Provider plugin 的样例。\n- Session、多 Agent、workspace、skill 的官方约定。\n\n### 5.2 不做范围\n\n- 不逐个分析 123 个 bundled plugin 的完整实现。\n- 不深入移动端 App、UI、Canvas、Voice Wake、Talk Mode 的客户端实现。\n- 不运行完整测试集或 Gateway live 验证。\n- 不做横向竞品细节对比。\n\n### 5.3 待确认\n\n- 插件运行时热加载和配置 reload 的边界条件需要后续单独验证。\n- Provider failover、auth profile rotation、memory plugin 的细节值得继续深挖。\n- Gateway protocol 的完整 TypeBox schema 和 Swift codegen 链路未展开。\n\n## 6. 适用场景\n\n- 需要设计 AI Gateway、ChatOps、Agent 平台或多渠道消息系统。\n- 需要理解插件能力扩展如何从 ad-hoc hook 演进为 capability registry。\n- 需要为多用户、多 Agent、多会话设计隔离模型。\n- 需要把本地工具执行、远端消息通道和 Agent runtime 组合到一个控制平面。\n\n## 7. 后续如何用于学习借鉴\n\n- 用 OpenClaw 的 Gateway 模式理解统一控制面的收益、代价和适用边界。\n- 用 manifest + registry 的方式理解插件能力归属如何从隐式约定变成显式契约。\n- 用 session key、agent workspace、agentDir、auth profile 的隔离模型理解多 Agent 场景的状态边界。\n- 用显式信任边界理解本地入口、网络入口和消息渠道之间的权限差异。\n\n## 8. 预期交付物\n\n| 交付物 | 文件 | 说明 |\n|---|---|---|\n| 外部资料调研 | external-research.md | 官方资料、协作资料、外部观点和源码验证关系 |\n| 研究问题 | research-questions.md | 从外部资料生成的源码验证问题 |\n| 源码地图 | source-map.md | 仓库结构、入口、阅读顺序 |\n| 技术架构 | architecture.md | 分层、模块边界、依赖方向 |\n| 核心抽象 | key-abstractions.md | Gateway、Agent、Plugin、Session 等 |\n| 扩展点 | extension-points.md | Plugin、Hook、Channel、Provider、Skill |\n| 主流程追踪 | runtime-flows.md | Gateway/WS/Agent/plugin load 流程 |\n| 设计思想 | design-philosophy.md | 设计原则和取舍 |\n| 横向对比 | comparison.md | 本轮只做占位 |\n| 学习借鉴 | adoption-notes.md | 可直接学习、需结合语境后借鉴、不建议照搬 |\n| 证据索引 | evidence-index.md | 结论到证据映射 |\n| 调研审查 | research-review.md | 覆盖度、风险、待补证据 |\n\n## 9. 验收标准\n\n| 编号 | 标准 | 验收方式 |\n|---|---|---|\n| AC-001 | 关键结论均有源码、文档或测试证据 | 检查 evidence-index.md |\n| AC-002 | 至少追踪一条主运行链路 | 检查 runtime-flows.md |\n| AC-003 | 外部资料中的关键观点已转成研究问题并记录验证状态 | 检查 external-research.md、research-questions.md |\n| AC-004 | 借鉴建议区分可直接学习、需结合语境后借鉴和不建议照搬 | 检查 adoption-notes.md |\n"},{"file":"external-research.md","label":"外部资料","content":"# 外部资料调研\n\n## 1. 官方资料\n\n| 资料 | 链接或路径 | 主要内容 | 对本次调研的价值 | 可信度等级 |\n|---|---|---|---|---|\n| Gateway architecture | https://docs.openclaw.ai/architecture | Gateway 是长期运行控制面，连接消息面、控制面客户端和节点 | 确认 OpenClaw 的产品核心不是单一 Agent loop，而是 Gateway control plane | A |\n| Agent runtime | https://docs.openclaw.ai/concepts/agent | 单 Gateway 内嵌 agent runtime、workspace、bootstrap files、session transcript、Pi core 边界 | 生成 Agent runtime 与 OpenClaw-owned layer 的源码验证问题 | A |\n| Session management | https://docs.openclaw.ai/concepts/session | 按 DM、group、room、cron、webhook 路由 session，强调 DM isolation 和 Gateway-owned state | 验证会话隔离、session store、transcript 设计 | A |\n| Multi-agent routing | https://docs.openclaw.ai/concepts/multi-agent | 多 isolated agents，分别拥有 workspace、agentDir、auth profiles、session history | 验证多 Agent 是否是一等模型而非简单 persona | A |\n| Plugin internals | https://docs.openclaw.ai/plugins/architecture | capability model、manifest/discovery、enablement/validation、runtime loading、surface consumption | 验证 plugin capability ownership 和 loader 分层 | A |\n| 本地仓库 README/VISION/docs | `/Users/cheng/IdeaProjects/openclaw/README.md`, `VISION.md`, `docs/**` | 产品定位、安全边界、插件优先、Gateway/Agent/Session/Plugin 概念文档 | 已在第一版源码调研中作为仓库文档证据 | S/A |\n\n## 2. 项目协作资料\n\n| 资料 | 链接或路径 | 主要观点 | 时间/版本 | 可信度等级 | 是否需要源码验证 |\n|---|---|---|---|---|---|\n| GitHub repository | https://github.com/openclaw/openclaw | 官方代码和 docs 编辑源 | 2026-05-25 查询 | A/B | 是 |\n| Plugin docs edit source links | OpenClaw docs 页面中的 GitHub edit source | docs 与源码仓库同源 | 2026-05-25 查询 | B | 是 |\n\n## 3. 社区与第三方资料\n\n本轮未采用独立第三方文章作为结论依据。OpenClaw 的外部资料主要来自官方文档站和本地源码仓库；社区资料只作为后续横向对比或实践风险补充入口。\n\n## 4. 外部资料中的关键观点\n\n### EXT-OC-001: Gateway 是长期运行控制面\n\n来源：\n\n- 官方 Gateway architecture 文档\n- 本地 `docs/concepts/architecture.md`\n\n说明：\n\n- 外部资料强调一个长期运行 Gateway 负责消息面、控制面客户端、节点和 HTTP/WS surface。\n\n是否已被源码验证：\n\n- 已验证。\n\n对应源码证据：\n\n- [evidence-index.md](./evidence-index.md) `C-004`, `C-005`, `C-006`\n\n### EXT-OC-002: Agent runtime 是 OpenClaw 外壳加 Pi agent core\n\n来源：\n\n- 官方 Agent runtime 文档\n- 本地 `docs/concepts/agent.md`, `docs/concepts/agent-loop.md`\n\n说明：\n\n- 官方资料区分 workspace/session/tool/channel delivery 等 OpenClaw-owned layer 与 Pi agent core。\n\n是否已被源码验证：\n\n- 已验证主链路，Pi core 事件结构仍待深挖。\n\n对应源码证据：\n\n- `C-007`, `C-008`, `INF-003`\n\n### EXT-OC-003: Plugin capability 是公开 native plugin model\n\n来源：\n\n- 官方 Plugin internals 文档\n- 本地 `docs/plugins/architecture.md`, `docs/plugins/manifest.md`\n\n说明：\n\n- 插件不只是 hook；capability registration、manifest/discovery、runtime registry、surface consumption 构成核心扩展模型。\n\n是否已被源码验证：\n\n- 已验证 loader/API builder 主链路。\n\n对应源码证据：\n\n- `C-010`, `C-011`, `C-012`, `INF-001`\n\n### EXT-OC-004: Session 和 multi-agent 是隔离模型\n\n来源：\n\n- 官方 Session management 文档\n- 官方 Multi-agent routing 文档\n\n说明：\n\n- 外部资料强调不同消息来源路由到不同 session，多 agent 拥有独立 workspace、state、auth profiles、session history。\n\n是否已被源码验证：\n\n- 已由本地仓库文档和 Agent RPC 链路部分验证；运行态隔离仍需 live Gateway 验证。\n\n对应源码证据：\n\n- `C-008`, `C-009`\n\n## 5. 外部资料与源码不一致的地方\n\n| 外部资料说法 | 源码实际情况 | 判断 | 后续处理 |\n|---|---|---|---|\n| 官方 docs 展示 capability-first plugin model | 源码和 docs 同时保留 legacy hook-only 路径 | 不是冲突，是演进期兼容 | 在 extension-points 中保留 capability 与 legacy hook 双轨描述 |\n| 官方 docs 说明多 Agent active | 本轮源码只验证了主要配置/文档和部分 Agent ingress 链路 | 部分验证 | 后续需要跑多 Agent channel binding 样例 |\n\n## 6. 对调研方向的影响\n\n外部资料帮助确认本轮应重点深挖：\n\n- Gateway control plane\n- Agent runtime boundary\n- Plugin capability ownership\n- Session/multi-agent isolation\n- Channel/provider capability examples\n"},{"file":"research-questions.md","label":"研究问题","content":"# 研究问题\n\n## 1. 问题清单\n\n| 编号 | 问题 | 来源 | 为什么重要 | 需要验证的源码方向 | 状态 |\n|---|---|---|---|---|---|\n| RQ-OC-001 | OpenClaw 的 Gateway 是否真的是长期运行控制面？ | EXT-OC-001 | 决定架构中心是 Gateway 还是 Agent loop | CLI launcher、Gateway server、WS runtime | 已验证 |\n| RQ-OC-002 | Agent runtime 的 OpenClaw-owned layer 与 Pi core 如何分工？ | EXT-OC-002 | 决定如何理解产品上下文与模型工具循环的边界 | Agent RPC、agent-command、attempt-execution、agent loop docs | 部分验证 |\n| RQ-OC-003 | Plugin 是 capability ownership 模型还是普通 hook 列表？ | EXT-OC-003 | 决定扩展机制的核心抽象 | plugin manifest、loader、api-builder、hook-types | 已验证 |\n| RQ-OC-004 | Session、DM isolation、多 Agent 是否是一等隔离模型？ | EXT-OC-004 | 决定多渠道/多 Agent 的状态边界 | session docs、multi-agent docs、agent ingress | 部分验证 |\n| RQ-OC-005 | Channel/Provider plugin 是否能代表完整 capability contract？ | EXT-OC-003 | 决定样例插件能否支撑扩展点结论 | `extensions/anthropic`, `extensions/irc` | 已验证样例 |\n\n## 2. 详细问题\n\n### RQ-OC-001: Gateway 是否真的是长期运行控制面？\n\n外部资料来源：\n\n- https://docs.openclaw.ai/architecture\n\n需要源码验证：\n\n- Gateway 启动是否统一进入 server runtime。\n- WS clients、nodes、agent RPC 是否都由 Gateway 管理。\n\n验证结果：\n\n- 已验证。`openclaw.mjs`、`src/entry.ts`、`src/cli/gateway-cli/run.ts` 和 Gateway server/runtime 证据支撑这一点。\n\n源码证据：\n\n- `C-004`, `C-005`, `C-006`\n\n### RQ-OC-002: Agent runtime 的边界是什么？\n\n外部资料来源：\n\n- https://docs.openclaw.ai/concepts/agent\n\n需要源码验证：\n\n- Gateway agent RPC 如何进入 `agentCommandFromIngress`。\n- OpenClaw session/workspace/delivery 是否包裹 Pi core。\n\n验证结果：\n\n- 部分验证。入口链路已验证，Pi core 内部事件结构未完全展开。\n\n源码证据：\n\n- `C-007`, `C-008`, `INF-003`\n\n### RQ-OC-003: Plugin 是 capability ownership 还是普通 hook？\n\n外部资料来源：\n\n- https://docs.openclaw.ai/plugins/architecture\n\n需要源码验证：\n\n- manifest/discovery、validation、runtime loading、registry consumption 是否存在。\n- Plugin API 是否注册 provider/channel/tool/hook/http/session/memory 等能力。\n\n验证结果：\n\n- 已验证。\n\n源码证据：\n\n- `C-010`, `C-011`, `C-012`, `C-017`, `INF-001`\n\n### RQ-OC-004: Session 与 multi-agent 是否一等隔离模型？\n\n外部资料来源：\n\n- https://docs.openclaw.ai/concepts/session\n- https://docs.openclaw.ai/concepts/multi-agent\n\n需要源码验证：\n\n- 不同消息来源如何路由 session。\n- agent workspace、agentDir、auth profile、session store 如何隔离。\n\n验证结果：\n\n- 部分验证。本轮已有仓库文档和 agent ingress 证据，但还没有跑 live Gateway 多 Agent/channel binding。\n\n源码证据：\n\n- `C-008`, `C-009`\n\n## 3. 外部观点验证状态\n\n| 外部观点 | 对应问题 | 验证状态 | 证据 |\n|---|---|---|---|\n| Gateway 是长期运行控制面 | RQ-OC-001 | 已验证 | `C-004`-`C-006` |\n| Agent runtime = OpenClaw 外壳 + Pi core | RQ-OC-002 | 部分验证 | `C-007`, `C-008`, `INF-003` |\n| Capability registration 是 plugin 方向 | RQ-OC-003 | 已验证 | `C-010`-`C-012` |\n| Session/multi-agent 是隔离模型 | RQ-OC-004 | 部分验证 | `C-008`, `C-009` |\n\n## 4. 待继续确认\n\n- 多 Agent channel binding 的 live behavior。\n- `openclaw plugins inspect \u003cid\u003e` 的实际 runtime 输出。\n- 一个真实 channel inbound 到 session/delivery 的端到端样例。\n"},{"file":"source-map.md","label":"源码地图","content":"# 源码地图\n\nStatus: draft\nLast Updated: 2026-05-25\n\n## 1. 快照信息\n\n| 项 | 内容 |\n|---|---|\n| 本地路径 | `/Users/cheng/IdeaProjects/openclaw` |\n| branch | `main` |\n| commit | `989e53c20d395d3c8bf47efc21fdb9d56e7227b0` |\n| package version | `2026.5.19` |\n| package bin | `openclaw -\u003e openclaw.mjs` |\n| workspace | `.`, `ui`, `packages/*`, `extensions/*` |\n| source-inventory | `references/source-inventory.json`，17990 个文件 |\n\n## 2. 顶层结构\n\n| 路径 | 角色 | 说明 |\n|---|---|---|\n| `openclaw.mjs` | npm/CLI launcher | 校验 Node 版本，识别 source checkout/package 模式，处理 compile cache respawn。[C-002][C-005] |\n| `src/entry.ts` | TS 主入口 | 设置进程环境、profile/container 参数、compile cache，进入 CLI 主流程。[C-005] |\n| `src/cli/**` | CLI 命令层 | `gateway`, `agent`, `plugins`, `channels`, `nodes`, `models` 等命令入口。 |\n| `src/gateway/**` | Gateway 控制面 | HTTP/WS server、协议、server methods、auth、channel manager、runtime state。 |\n| `src/agents/**` | Agent runtime 外壳 | session/workspace/skills/model/delivery 封装，调用 Pi agent core。 |\n| `src/plugins/**` | Plugin loader/registry/runtime | 插件发现、manifest registry、加载、API builder、hook runner、runtime facade。 |\n| `src/plugin-sdk/**` | 插件公开 SDK | 插件作者可依赖的 public API 和 entry helper。 |\n| `src/channels/**` | Channel core implementation | Channel SDK seam 和核心通道能力，不等于具体 bundled plugin。 |\n| `extensions/**` | Bundled plugins | 123 个 `openclaw.plugin.json`，包含 provider/channel/tool/hook 等插件。[C-013] |\n| `packages/**` | 独立包 | SDK、plugin package contract、memory host SDK 等。 |\n| `ui/**` | Control UI | 本轮未深入。 |\n| `docs/**` | 仓库文档 | 架构、Agent、Session、Plugin、Gateway protocol 等核心参考。 |\n| `apps/**` | Companion apps | 本轮未深入。 |\n| `qa/**`, `test/**` | 测试与 QA | 本轮只做静态检索，未跑测试。 |\n\n## 3. 主入口阅读顺序\n\n### 3.1 CLI/Gateway\n\n1. `openclaw.mjs`\n   - Node 22.19+ 检查。\n   - source checkout 识别。\n   - compile cache respawn 策略。\n2. `src/entry.ts`\n   - 只在 main module 时执行，避免重复启动 Gateway。\n   - 设置进程 title、warning filter、env、profile/container。\n3. `src/cli/gateway-cli/run.ts`\n   - 读取配置、解析端口/bind/auth/tailscale。\n   - 动态 import `../../gateway/server.js`。\n   - 调用 `startGatewayServer(port, opts)`。\n4. `src/gateway/server.ts`\n   - 薄 wrapper，懒加载 `server.impl.ts`。\n5. `src/gateway/server.impl.ts`\n   - 读取配置、准备插件 bootstrap、创建 runtime state、attach WS handlers、启动 sidecars/channels/services。\n\n### 3.2 Gateway WS\n\n1. `src/gateway/server-runtime-state.ts`\n   - 创建 HTTP server 和 `WebSocketServer({ noServer: true })`。\n   - 在 listen 前 attach upgrade handler，避免连接竞态。[C-006]\n2. `src/gateway/server-ws-runtime.ts`\n   - 把 runtime state/context 注入 `attachGatewayWsConnectionHandler`。\n3. `src/gateway/server/ws-connection.ts`\n   - 建立连接、发送 `connect.challenge`、管理 handshake timer、client set、ping、close cleanup。[C-006]\n4. `src/gateway/server/ws-connection/message-handler.ts`\n   - 第一帧必须是 `req:connect`。\n   - 协议版本、origin、auth、device identity、pairing、scope 校验。\n   - 成功后返回 `hello-ok`，包含 methods/events discovery metadata。[C-006]\n\n### 3.3 Agent Run\n\n1. `src/gateway/server-methods/agent.ts`\n   - 验证请求、解析 session、delivery plan、注册 abort controller。\n   - 先返回 accepted ack，再异步调度 `agentCommandFromIngress`。[C-008]\n2. `src/agents/agent-command.ts`\n   - 网络入口必须显式传入 `senderIsOwner` 和 `allowModelOverride`。\n   - 准备 session、skills snapshot、model 选择、delivery。\n3. `src/agents/command/attempt-execution.ts`\n   - 最终调用 `runEmbeddedPiAgent`，把 session、workspace、model、tools、delivery 等参数传入。[C-008]\n4. `src/agents/pi-embedded-runner/**`\n   - 内嵌 Pi runtime，执行模型、工具、hook、stream、timeout、persistence。\n\n### 3.4 Plugin System\n\n1. `docs/plugins/architecture.md`\n   - 先读 capability model 和四层加载架构。\n2. `docs/plugins/manifest.md`\n   - 理解 manifest 的 metadata/control-plane 职责。\n3. `src/plugins/loader.ts`\n   - 插件发现、manifest registry、enable/activation、registration plan、runtime register。\n4. `src/plugins/api-builder.ts`\n   - OpenClawPluginApi 注册面。\n5. `src/plugin-sdk/plugin-entry.ts`\n   - `definePluginEntry`，非 channel 插件的 canonical entry helper。\n6. `extensions/anthropic/**`, `extensions/irc/**`\n   - Provider plugin 与 Channel plugin 样例。\n\n## 4. 建议后续深挖路径\n\n- Provider: `extensions/openai`, `extensions/anthropic`, `src/provider-runtime/**`。\n- Channel: `extensions/telegram`, `extensions/slack`, `src/channels/plugins/**`。\n- Memory: `extensions/active-memory`, `extensions/memory-lancedb`, `src/memory/**`。\n- Protocol: `src/gateway/protocol/**`, `docs/reference/rpc*`。\n- Security: `src/gateway/auth.ts`, `src/gateway/server/ws-connection/message-handler.ts`, `docs/gateway/security*`。\n\n## 5. 阅读提醒\n\n- 仓库自身约束明确要求产品/文档使用 `plugin/plugins`，`extensions/` 是内部目录名。[C-003]\n- Core 不应直接包含 owner-specific provider/channel policy；应通过 manifest、registry、SDK seam 和 plugin-owned contract 承载。[C-003]\n- 由于本轮未跑测试，所有运行行为结论以源码和仓库文档为准，标记为 source/doc fact 或 inference。\n"},{"file":"architecture.md","label":"架构文档","content":"# 技术架构\n\nStatus: draft\nLast Updated: 2026-05-25\n\n## 1. 总体判断\n\nOpenClaw 的核心架构是“本地长期运行 Gateway + 嵌入式 Agent runtime + 插件能力注册表 + 多渠道/多设备接入”。Gateway 是控制平面，负责配置、认证、WS/HTTP 协议、session、channel、plugin、events、node 和 delivery；Agent runtime 是执行平面，负责把用户输入变成模型调用、工具调用、stream 和持久化结果。[C-004][C-007]\n\n新版外部资料阶段确认了这个判断不是单纯源码归纳：官方 Gateway architecture、Agent runtime、Session、Multi-agent 和 Plugin docs 均把 Gateway control plane、OpenClaw-owned Agent layer、capability-first plugin model 和 session/multi-agent isolation 作为核心概念；本地源码证据分别验证在 `C-004` 到 `C-012` 中。[EXT-OC-001][EXT-OC-002][EXT-OC-003][EXT-OC-004]\n\n可视化补充：[visual/architecture.html](./visual/architecture.html)，图数据见 [visual/architecture.visual.js](./visual/architecture.visual.js)。证据解释页：[visual/evidence.html](./visual/evidence.html)，数据见 [visual/evidence.visual.js](./visual/evidence.visual.js)。该 HTML 图只展示本文和证据索引中已经沉淀的结构关系。\n\n```mermaid\nflowchart TD\n  User[\"User / External message\"] --\u003e Channel[\"Channel plugin runtime\"]\n  Cli[\"CLI / Control UI / Companion app\"] --\u003e WS[\"Gateway WebSocket API\"]\n  Node[\"Device node: macOS / iOS / Android / headless\"] --\u003e WS\n  Channel --\u003e Gateway[\"OpenClaw Gateway\"]\n  WS --\u003e Gateway\n  Gateway --\u003e Session[\"Session store + transcript JSONL\"]\n  Gateway --\u003e PluginRegistry[\"Plugin registry + capability registry\"]\n  Gateway --\u003e AgentCmd[\"agentCommandFromIngress / agentCommand\"]\n  AgentCmd --\u003e Pi[\"Embedded Pi agent runtime\"]\n  Pi --\u003e Tools[\"Tools / MCP / nodes / channel send\"]\n  PluginRegistry --\u003e Providers[\"Model / media / web / speech providers\"]\n  PluginRegistry --\u003e Hooks[\"Plugin hooks\"]\n  Providers --\u003e Pi\n  Hooks --\u003e Pi\n  Pi --\u003e Delivery[\"Outbound delivery\"]\n  Delivery --\u003e Channel\n```\n\n## 2. 分层结构\n\n| 层 | 主要模块 | 责任 | 边界 |\n|---|---|---|---|\n| Launcher/CLI | `openclaw.mjs`, `src/entry.ts`, `src/cli/**` | 启动、参数、profile/container、gateway command | 不承载业务能力，只进入 CLI/Gateway |\n| Gateway core | `src/gateway/**` | HTTP/WS、auth、protocol、server methods、runtime state、channel manager | Core 应保持 plugin-agnostic，不写 owner-specific policy。[C-003] |\n| Agent shell | `src/agents/**` | workspace、session、skills、model 选择、delivery、Pi runtime 调用 | OpenClaw owns session/discovery/tool wiring/channel delivery，Pi core owns模型和工具循环。[C-007] |\n| Plugin control plane | `src/plugins/**`, `src/plugin-sdk/**` | manifest discovery、enablement、validation、registry、runtime API | manifest metadata 不应依赖执行 plugin runtime。[C-010][C-011] |\n| Bundled plugins | `extensions/**` | Provider、Channel、Tool、Hook、Service 等能力实现 | 通过 SDK/manifest/documented barrels 接入 core。[C-003][C-013] |\n| State | `~/.openclaw/**` | config、agentDir、auth profiles、session store、transcripts | per-agent state/session 隔离。[C-009] |\n| UI/apps/nodes | `ui/**`, `apps/**`, nodes via WS | 控制 UI、伴生 App、设备能力 | 作为 Gateway WS/HTTP client 或 node 接入。 |\n\n## 3. 控制面与执行面\n\nGateway control plane 的主要职责：\n\n- 维护 messaging surfaces 和 provider/channel 连接。[C-004]\n- 提供 typed WebSocket API，收发 req/res/event frame。[C-004]\n- 执行 handshake、auth、pairing、scope、origin 校验。[C-004][C-006]\n- 管理 session store、chat run state、dedupe、abort controller、event subscribers。[C-006][C-008]\n- 加载 plugin metadata、plugin runtime、channel runtime 和 plugin services。[C-011]\n\nAgent execution plane 的主要职责：\n\n- 解析 agent/session/workspace/model/skills。\n- 通过 `runEmbeddedPiAgent` 调用 Pi agent core。[C-008]\n- 接入 plugin hooks，如 `before_model_resolve`、`before_prompt_build`、`before_tool_call`、`agent_end`。[C-017]\n- 将 assistant/tool/lifecycle stream 回传 Gateway，最终做 delivery 和持久化。[C-007]\n\n## 4. 关键依赖方向\n\nOpenClaw 的依赖方向很明确：\n\n- Core -\u003e generic plugin contracts / registry / SDK seams。\n- Plugin -\u003e `openclaw/plugin-sdk/*` 和 documented barrels。\n- Core 不应直接依赖 `extensions/*/src/**` 的插件内部实现。\n- Owner-specific behavior 属于 owner plugin，例如 provider auth、catalog、runtime hooks、channel policy。[C-003]\n\n这个方向的好处是：新增 provider/channel/tool 时，优先扩展 plugin API 或 manifest contract，而不是在 core 中添加特定 owner 分支。\n\n## 5. 架构亮点\n\n### 5.1 Metadata-before-runtime\n\n`openclaw.plugin.json` 是插件控制面的第一事实来源，用于身份、配置校验、能力归属、启动规划和 UI hints；runtime `register(api)` 才负责实际能力注册。这样可以在不执行插件代码的情况下做配置校验、诊断和启动计划。[C-010][C-011]\n\n### 5.2 One Gateway, many surfaces\n\nOpenClaw 把 CLI、Control UI、companion apps、nodes、channels 都汇入同一个 Gateway。好处是 session、auth、plugin registry、events 和 delivery 都能在一个控制面里协同，而不是每个入口各自做一套状态管理。[C-004]\n\n### 5.3 Per-agent isolation\n\nAgent 被定义为 workspace、agentDir、auth profiles、session store 的组合，而不只是 prompt/persona 名称。多 Agent 共享 Gateway，但在 state、workspace 和 session 级别隔离。[C-009]\n\n### 5.4 Explicit ingress trust\n\nCLI/local `agentCommand` 默认 trusted；网络/Gateway 入口 `agentCommandFromIngress` 必须显式提供 `senderIsOwner` 和 `allowModelOverride`。这是非常好的安全设计：入口层决定信任等级，执行层不猜测调用者是谁。[C-008]\n\n## 6. 架构风险和复杂度\n\n- Gateway 责任很重：auth、WS、session、channels、plugins、agent run、services 都聚合在这里。它是清晰的控制面，但也是复杂度中心。\n- Plugin surface 很宽：`OpenClawPluginApi` 注册能力很多，适合强扩展平台，但需要严格文档、兼容和测试约束。[C-012]\n- Bundled plugins 数量多，owner 边界很重要；一旦 core 开始直接引用具体 plugin 内部，就会破坏架构方向。[C-003]\n- 多渠道、多 Agent、多 session 的组合会产生大量边界状态，后续最好补动态验证和测试证据。\n"},{"file":"runtime-flows.md","label":"运行流程","content":"# 运行流程\n\nStatus: draft\nLast Updated: 2026-05-25\n\n## 1. Flow A: CLI 启动 Gateway\n\n```mermaid\nsequenceDiagram\n  participant Launcher as \"openclaw.mjs\"\n  participant Entry as \"src/entry.ts\"\n  participant CLI as \"gateway-cli/run.ts\"\n  participant Server as \"gateway/server.ts\"\n  participant Impl as \"gateway/server.impl.ts\"\n\n  Launcher-\u003e\u003eLauncher: \"check Node 22.19+\"\n  Launcher-\u003e\u003eEntry: \"load source/package entry\"\n  Entry-\u003e\u003eEntry: \"main-module guard + env/profile/container\"\n  Entry-\u003e\u003eCLI: \"run main CLI\"\n  CLI-\u003e\u003eCLI: \"read config, resolve port/bind/auth\"\n  CLI-\u003e\u003eServer: \"dynamic import gateway/server.js\"\n  Server-\u003e\u003eImpl: \"lazy import server.impl.js\"\n  Impl-\u003e\u003eImpl: \"config snapshot + auth + plugin bootstrap\"\n  Impl-\u003e\u003eImpl: \"create runtime state, channels, methods\"\n  Impl-\u003e\u003eImpl: \"attach WS handlers\"\n  Impl-\u003e\u003eImpl: \"start HTTP listen + sidecars\"\n```\n\n关键代码点：\n\n- `openclaw.mjs` 要求 Node 22.19+，并区分 source checkout 与 packaged launcher。[C-005]\n- `src/entry.ts` 使用 main module guard，避免 bundler/shared import 造成重复启动 Gateway。[C-005]\n- `gateway-cli/run.ts` 读取配置、解析 auth/bind/tailscale，动态 import server module，再调用 `startGatewayServer`。[C-005]\n- `server.ts` 是懒加载 wrapper，真正逻辑在 `server.impl.ts`。[C-005]\n- `server.impl.ts` 启动阶段先读取 config/auth，再准备 plugin bootstrap 和 runtime state。[C-005]\n\n## 2. Flow B: Gateway WebSocket handshake\n\n```mermaid\nsequenceDiagram\n  participant Client\n  participant WSS as \"WebSocketServer\"\n  participant Conn as \"ws-connection.ts\"\n  participant Handler as \"message-handler.ts\"\n\n  Client-\u003e\u003eWSS: \"HTTP upgrade\"\n  WSS-\u003e\u003eConn: \"connection\"\n  Conn--\u003e\u003eClient: \"event connect.challenge\"\n  Client-\u003e\u003eHandler: \"req connect(params)\"\n  Handler-\u003e\u003eHandler: \"validate first frame + protocol\"\n  Handler-\u003e\u003eHandler: \"origin/auth/device/pairing/scope checks\"\n  Handler-\u003e\u003eConn: \"setClient\"\n  Handler--\u003e\u003eClient: \"res hello-ok(features, snapshot)\"\n  Client-\u003e\u003eHandler: \"req health/status/agent/send...\"\n```\n\n关键代码点：\n\n- `createGatewayRuntimeState` 在 listen 前创建 `WebSocketServer({ noServer: true })` 并 attach upgrade handler，避免连接竞态。[C-006]\n- 每个 WS connection 会立即收到 `connect.challenge` nonce。[C-006]\n- 第一帧必须是 `{ type:\"req\", method:\"connect\" }`，否则 hard close。[C-004][C-006]\n- handshake 会检查 protocol、origin、auth、device identity、pairing、scope。[C-006]\n- 成功后返回 `hello-ok`，其中 `features.methods/events` 是 discovery metadata。[C-004][C-006]\n\n## 3. Flow C: Gateway `agent` RPC 到内嵌 Agent runtime\n\n```mermaid\nsequenceDiagram\n  participant Client\n  participant Gateway as \"server-methods/agent.ts\"\n  participant AgentCmd as \"agent-command.ts\"\n  participant Attempt as \"attempt-execution.ts\"\n  participant Pi as \"runEmbeddedPiAgent\"\n\n  Client-\u003e\u003eGateway: \"req agent(params)\"\n  Gateway-\u003e\u003eGateway: \"resolve session + delivery + dedupe\"\n  Gateway--\u003e\u003eClient: \"res accepted {runId}\"\n  Gateway-\u003e\u003eGateway: \"yield after ack\"\n  Gateway-\u003e\u003eAgentCmd: \"agentCommandFromIngress(opts)\"\n  AgentCmd-\u003e\u003eAgentCmd: \"prepare session, skills, model, delivery\"\n  AgentCmd-\u003e\u003eAttempt: \"runAgentAttempt\"\n  Attempt-\u003e\u003ePi: \"runEmbeddedPiAgent(params)\"\n  Pi--\u003e\u003eGateway: \"assistant/tool/lifecycle streams\"\n  Gateway--\u003e\u003eClient: \"events + final res\"\n```\n\n关键代码点：\n\n- `agent` method 注册 abort controller 和 dedupe 后，先返回 accepted ack。[C-008]\n- ack flush 后才异步调度 `dispatchAgentRunFromGateway`，避免重同步准备阻塞 immediate `agent.wait`。[C-008]\n- Gateway ingress 调用的是 `agentCommandFromIngress`，要求显式 `senderIsOwner` 和 `allowModelOverride`。[C-008]\n- `attempt-execution.ts` 最终把 session、workspace、model、skills、tools、delivery、abort signal 等参数传给 `runEmbeddedPiAgent`。[C-008]\n- Agent loop 文档说明完整流程是 intake -\u003e context assembly -\u003e model inference -\u003e tool execution -\u003e streaming replies -\u003e persistence。[C-007]\n\n## 4. Flow D: Plugin discovery/load/register\n\n```mermaid\nflowchart TD\n  Config[\"Runtime config\"] --\u003e Discovery[\"discoverOpenClawPlugins\"]\n  Discovery --\u003e ManifestRegistry[\"loadPluginManifestRegistry\"]\n  ManifestRegistry --\u003e Plan[\"enablement + activation + registration plan\"]\n  Plan --\u003e Registry[\"createPluginRegistry\"]\n  Registry --\u003e LoadModule[\"load plugin module when plan requires\"]\n  LoadModule --\u003e Register[\"runPluginRegisterSync(register, api)\"]\n  Register --\u003e Capabilities[\"providers / channels / tools / hooks / routes / services\"]\n  Capabilities --\u003e Gateway[\"Gateway consumes registry\"]\n```\n\n关键代码点：\n\n- `loadOpenClawPlugins` 先解析 cache/load context，再创建 runtime proxy 和 plugin registry。[C-011]\n- Discovery/manifest registry 可以来自显式 snapshot，也可以现场发现插件候选。[C-011]\n- 对每个 candidate，先看 manifest record、enabled state、activation state、registration plan，再决定是否 load module/register。[C-011]\n- `validate`/snapshot 模式避免激活全局 runtime side effects；full 模式才激活 registry 和 global hook runner。[C-011]\n- `register(api)` 失败会 rollback plugin global side effects 并恢复 registry snapshot。[C-011]\n\n## 5. Flow E: Channel plugin outbound send\n\n以 IRC channel 为例：\n\n1. Manifest 声明 `channels: [\"irc\"]` 和 channel env vars。[C-014]\n2. Channel entry 使用 `defineBundledChannelEntry` 指向 plugin/secrets/runtime export。[C-014]\n3. `ircPlugin` 通过 `createChatChannelPlugin` 定义 config、directory、status、gateway、security、outbound 等能力。[C-014]\n4. Outbound `sendText`/`sendMedia` 懒加载 IRC runtime，再调用 `sendMessageIrc`。[C-014]\n\n这一流程说明：OpenClaw 的 channel 是完整平台适配层，而不是业务代码里随手调用的发送函数。\n\n## 6. 状态变化重点\n\n| 状态 | 何时创建/改变 | 目的 |\n|---|---|---|\n| `runtimeState.gatewayMethods` | Gateway 启动和插件 reload | 汇总 core/plugin/channel methods |\n| `clients` set | WS handshake 成功/断开 | 广播、presence、cleanup |\n| `sessionStore` / transcript | Agent run 前后 | 保持上下文和 delivery state |\n| `chatAbortControllers` | agent accepted 前注册，run finally 清理 | 允许 abort/timeout |\n| `PluginRegistry` | startup bootstrap / reload | 提供 hooks、providers、channels、routes、services |\n| `currentPluginMetadataSnapshot` | startup/reload/shutdown | 避免重复 discovery，保持 metadata scope |\n"},{"file":"key-abstractions.md","label":"核心抽象","content":"# 核心抽象\n\nStatus: draft\nLast Updated: 2026-05-25\n\n## 1. 核心抽象表\n\n| 抽象 | 位置 | 它是什么 | 生命周期 / 关键关系 |\n|---|---|---|---|\n| Gateway | `src/gateway/**` | 本地长期运行的控制平面 | 启动时加载 config/plugin/channel runtime；运行时接收 WS/HTTP 请求，管理 sessions/events/channels/nodes。 |\n| Gateway WS client | `src/gateway/server/ws-connection.ts` | CLI/UI/node/webchat 等连接到 Gateway 的客户端 | 必须先 `connect` handshake，成功后加入 `clients` set，断开时清理 presence、node registry、subscriptions。[C-006] |\n| Gateway method | `src/gateway/server-methods/**` | WS request method 的服务端处理器 | Core methods + plugin gateway methods + aux handlers 汇总成 method registry。[C-005] |\n| Agent | `src/agents/**`, docs | 一个 persona/scope：workspace + agentDir + session store + auth profiles | 默认 `main`，也支持多 Agent 并行隔离。[C-009] |\n| Session | `config/sessions`, `docs/concepts/session.md` | 会话路由和上下文持久化单位 | DM 默认共享，群/房间隔离，cron 每次新 session，transcript 写 JSONL。[C-009] |\n| Workspace | `agents.defaults.workspace` | Agent 工具和上下文的 cwd | 注入 `AGENTS.md`, `SOUL.md`, `TOOLS.md`, `BOOTSTRAP.md`, `IDENTITY.md`, `USER.md`。[C-007] |\n| Skill | workspace/personal/managed/bundled roots | 本地指令包 | 按优先级从 workspace、`.agents/skills`、personal、managed、bundled、extra dirs 加载。[C-007] |\n| Plugin manifest | `openclaw.plugin.json` | 插件 metadata/control-plane contract | 不执行插件代码即可做 config validation、capability ownership、activation hints。[C-010] |\n| Plugin registry | `src/plugins/registry.ts`, `src/plugins/loader.ts` | runtime capability collection | loader 创建 registry，插件 register 后记录 tools/providers/channels/hooks/routes/services 等。[C-011] |\n| OpenClawPluginApi | `src/plugins/api-builder.ts` | 插件 runtime 注册面 | 提供 registerTool/registerProvider/registerChannel/registerGatewayMethod/on 等大量扩展 API。[C-012] |\n| Channel plugin | `src/channels/**`, `extensions/*` | 消息平台适配器 | 负责 config、directory、status、gateway start、security、outbound send 等。[C-014] |\n| Provider plugin | `extensions/*`, provider SDK | 模型/媒体/搜索/语音等 Provider | 通过 `api.registerProvider` 等注册能力；manifest 先声明 provider ownership。[C-013] |\n| Hook | `src/plugins/hook-types.ts` | Agent/Gateway 生命周期扩展点 | 如 `before_model_resolve`, `before_prompt_build`, `before_tool_call`, `agent_end`, `message_sending`。[C-017] |\n| Node | Gateway WS role `node` | 设备能力端 | macOS/iOS/Android/headless 通过 WS 连接，声明 caps/commands。[C-004] |\n| Memory slot | plugin kind/slots | 独占插件槽 | docs 明确 memory 是特殊 plugin slot，一次只能激活一个 memory plugin。[C-015] |\n\n## 2. 抽象关系\n\n```mermaid\nflowchart LR\n  Agent[\"Agent\"] --\u003e Workspace[\"Workspace files\"]\n  Agent --\u003e AgentDir[\"agentDir\"]\n  Agent --\u003e Sessions[\"Session store\"]\n  Agent --\u003e AuthProfiles[\"Auth profiles\"]\n  Gateway[\"Gateway\"] --\u003e Agent\n  Gateway --\u003e MethodRegistry[\"Gateway method registry\"]\n  Gateway --\u003e PluginRegistry[\"Plugin registry\"]\n  PluginRegistry --\u003e Provider[\"Provider capability\"]\n  PluginRegistry --\u003e Channel[\"Channel capability\"]\n  PluginRegistry --\u003e Hooks[\"Hooks\"]\n  Channel --\u003e Sessions\n  MethodRegistry --\u003e AgentRun[\"agent method\"]\n  AgentRun --\u003e AgentRuntime[\"Embedded Pi runtime\"]\n```\n\n## 3. 最重要的抽象边界\n\n### 3.1 Agent 不是单个 prompt\n\nOpenClaw 文档把 agent 定义为 workspace、state dir、auth profiles、session store 的组合。[C-009] 这意味着多 Agent 的隔离不是靠“prompt 不同”，而是靠文件系统状态、认证状态和 session 状态分开。\n\n### 3.2 Plugin manifest 不是 runtime registration\n\nManifest 用于 cheap inspection，runtime behavior 属于 plugin code 和 `register(api)`。这能让 config validation、startup planning、UI hints 不依赖动态执行第三方代码。[C-010]\n\n### 3.3 Channel plugin 不是简单 send adapter\n\n以 IRC 为例，channel plugin 包括 setup、capabilities、reload、config adapter、secrets、doctor、group policy、message adapter、directory、status、gateway start、pairing notify、security、outbound send。[C-014] 这说明 Channel 是一个完整子系统，不只是发送函数。\n\n### 3.4 Hook 是生命周期扩展，不是万能业务接口\n\nHook 覆盖模型选择、prompt 构建、工具调用、消息收发、session 生命周期和 Gateway 生命周期。[C-017] 但 OpenClaw 的方向是 capability registration 优先，legacy hook-only 兼容保留。[C-010]\n\n## 4. 可学习点\n\n- 把“会话”、“Agent”、“Workspace”、“Auth profile”拆成清晰实体，有助于避免多用户混线。\n- 把插件能力分成 metadata ownership 和 runtime registration，有助于先诊断、后执行。\n- 把 Channel 定义成完整适配器，有利于统一 setup/status/security/delivery，不会让业务层散落各种 channel if/else。\n- 把网络入口信任等级显式传入 Agent runtime，有助于权限审计。\n"},{"file":"extension-points.md","label":"扩展点","content":"# 扩展点\n\nStatus: draft\nLast Updated: 2026-05-25\n\n## 1. 扩展机制总览\n\nOpenClaw 的扩展体系不是单一 Hook，而是多层组合：\n\n| 扩展点 | 形式 | 适合扩展什么 | 证据 |\n|---|---|---|---|\n| Native plugin manifest | `openclaw.plugin.json` | 插件身份、配置 schema、能力归属、activation hints | [C-010] |\n| Plugin runtime entry | `definePluginEntry({ register(api) })` | Provider、tool、command、service、memory、context-engine 等 runtime 行为 | [C-013] |\n| Channel plugin entry | `defineBundledChannelEntry` / channel SDK | Messaging channel | [C-014] |\n| Plugin capability API | `api.registerProvider`, `api.registerChannel`, `api.registerTool`, etc. | 显式能力注册 | [C-010][C-012] |\n| Plugin hooks | `api.on(...)` / hook runner | Agent/Gateway 生命周期拦截 | [C-017] |\n| Gateway methods/routes/services | plugin API registrations | 控制面方法、HTTP route、后台服务 | [C-012] |\n| Skills/bundles | skill roots / compatible bundles | 指令、MCP servers、settings、commands | [C-007][C-010] |\n| Memory slot | `kind: \"memory\"`, `plugins.slots.memory` | 可替换 memory backend | [C-015] |\n\n## 2. Plugin manifest: 控制面扩展\n\nManifest 的关键价值是“在 runtime 加载前表达所有 cheap metadata”。仓库文档明确要求每个 native plugin 都有 `openclaw.plugin.json`，用于不执行插件代码的配置校验；它可以声明 id、config schema、channels、providers、cliBackends、contracts、auth choices、model metadata 等。[C-010]\n\n这类设计适合借鉴到任何插件系统：\n\n- 先声明能力归属和配置 contract。\n- 再执行 runtime registration。\n- 启动计划、诊断、UI 表单、权限提示都基于 metadata。\n\n## 3. Runtime registration: 执行面扩展\n\n`definePluginEntry` 是非 channel 插件的 canonical entry helper。它返回 id/name/description/configSchema/register 等标准形状；Provider、tool、command、service、memory、context-engine 插件都走这条路径。[C-013]\n\n`OpenClawPluginApi` 的注册面很宽，包括：\n\n- tool/hook/http route/channel/gateway method/CLI。\n- provider/model catalog/speech/realtime/media/image/video/music/web fetch/web search。\n- command/context engine/compaction provider/agent harness。\n- session extension/scheduler/action/detached task/memory capability。\n\n这说明 OpenClaw 把插件定位为平台能力单元，而不仅是“命令扩展”。[C-012]\n\n## 4. Capability model\n\n仓库文档把 native plugin capability 明确列为 public model，例如 text inference、CLI backend、speech、realtime、media understanding、image/music/video generation、web fetch/search、channel、gateway discovery。[C-010]\n\n关键取舍：\n\n- 新 bundled/native plugins 优先显式 capability registration。\n- legacy hook-only 保持兼容，但不是推荐方向。\n- 部分 helper surface 仍在演进，需要 docs 标明稳定性。[C-010]\n\n## 5. Channel plugin\n\nChannel plugin 的样例 IRC 说明了一个成熟消息通道扩展需要包含：\n\n- config adapter 和 env/config 检测。\n- setup/setupWizard。\n- direct/group capabilities。\n- group policy 和 tool policy。\n- directory resolver。\n- status/probe。\n- gateway account start。\n- pairing notify。\n- security warnings。\n- outbound sendText/sendMedia。[C-014]\n\n学习启发是：如果要理解多消息平台接入，不要只看业务层的 `sendXxx` 调用。更关键的是观察“配置、权限、收发、状态、诊断、目录、重载”如何被封装为同一 channel contract。\n\n## 6. Provider plugin\n\nAnthropic 插件样例展示了 provider manifest 与 runtime 注册的分工：\n\n- Manifest 声明 `providers`, `modelSupport`, `providerAuthChoices`, `cliBackends`, `contracts.mediaUnderstandingProviders` 等。[C-013]\n- Runtime 通过 `api.registerCliBackend`, `api.registerProvider`, `api.registerMediaUnderstandingProvider` 注册实际能力。[C-013]\n\n这类 owner-owned provider policy 可以避免 core 中充斥具体厂商逻辑。\n\n## 7. Hook points\n\nOpenClaw 的 hook 覆盖模型、prompt、工具、消息、session、subagent、gateway、cron 等生命周期。[C-017] 其中最重要的 Agent loop hooks：\n\n- `before_model_resolve`: 模型/provider 决策前。\n- `before_prompt_build`: session messages 载入后、prompt 构建前。\n- `before_tool_call` / `after_tool_call`: 工具调用前后。\n- `agent_end`: 运行结束后检查最终消息和 metadata。\n- `message_received` / `message_sending` / `message_sent`: 消息收发。\n\n设计建议：Hook 适合生命周期拦截，不适合承载稳定能力 ownership。稳定能力更适合 manifest + capability registration。\n\n## 8. 扩展点借鉴优先级\n\n| 优先级 | 可借鉴点 | 原因 |\n|---|---|---|\n| P0 | Manifest + runtime registration 分离 | 能把诊断、配置、UI、启动规划从运行时代码中解耦 |\n| P0 | Capability registry | 能减少核心硬编码 owner 分支 |\n| P1 | Channel plugin 完整 contract | 多渠道系统非常需要统一收发、安全、状态、配置 |\n| P1 | Network ingress trust explicit | 防止网络入口继承本地 CLI 信任 |\n| P2 | Hook system | 强大但需要治理，否则容易演化成隐式业务总线 |\n"},{"file":"design-philosophy.md","label":"设计思想","content":"# 设计思想\n\nStatus: draft\nLast Updated: 2026-05-25\n\n## 1. 产品哲学：Gateway 是控制面，不是产品本体\n\nREADME 和官方 Gateway architecture 共同说明 OpenClaw 是运行在用户设备上的 personal AI assistant，Gateway 只是 control plane，产品是 assistant。[C-001][EXT-OC-001] 这决定了技术架构的重心：\n\n- Gateway 要稳定、可观测、可配置。\n- 用户交互可以发生在已有渠道、Control UI、CLI、移动端、节点设备中。\n- 多渠道不是附加功能，而是产品形态的一部分。\n\n对其它系统的启发：如果真正价值在“持续服务用户的智能体”，不要把产品边界限制在某个 Web UI 或某个 Bot。\n\n## 2. Local-first + operator-controlled security\n\nOpenClaw 强调运行在用户自己的设备和规则里，并且把安全和 safe defaults 放在当前优先级前列。[C-015] README 也明确说明默认 main session 工具在宿主机运行，群组/频道需要通过 sandbox 等配置控制风险。[C-016]\n\n这是一种“能力强，但风险显式”的设计：\n\n- 单用户本地使用时保持高能力。\n- 多人/远程/群组入口必须显式考虑 DM policy、pairing、sandbox、auth。\n- Convenience 不应该隐藏关键安全决策。[C-015]\n\n## 3. Core stays plugin-agnostic\n\n根 `AGENTS.md` 对架构边界非常明确：core 保持 plugin-agnostic，插件通过 SDK、manifest metadata、runtime helpers 和 documented barrels 接入；owner-specific behavior 放在 owner plugin。[C-003]\n\n这是 OpenClaw 的核心工程思想之一：\n\n- core 负责 generic seams。\n- provider/channel/owner 的特殊策略留在插件。\n- 如果插件做不了，优先扩展 plugin API，而不是把特例塞进 core。\n\n## 4. Metadata-before-runtime\n\nOpenClaw 的插件系统先读 manifest，再决定是否加载 runtime。Manifest 用于配置校验、能力归属、activation planning、UI hints、owner maps 等，不执行插件代码。[C-010]\n\n这个思想背后的取舍：\n\n- 启动和诊断能更快、更安全。\n- 配置错误可以在 runtime 激活前暴露。\n- 插件 runtime 加载变成明确动作，而不是所有插件一上来全执行。\n\n## 5. Capability ownership 优先于 Hook 万能化\n\nOpenClaw 支持丰富 hooks，但本地文档和官方 Plugin internals 都明确 capability registration 是 native plugin 的 intended direction；legacy hook-only 支持是兼容基线，不是新设计首选。[C-010][EXT-OC-003]\n\n这点很重要：Hook 系统很容易变成隐式业务总线。OpenClaw 的方向是：\n\n- 稳定能力用 capability/register contract 表达。\n- 生命周期拦截用 hook。\n- legacy hook-only 继续兼容，但不鼓励扩大。\n\n## 6. Hot path 携带已解析事实\n\n根架构规则要求 hot paths carry prepared facts forward，例如 provider id、model ref、channel id、target、capability family、attachment class；不要在请求时反复 broad discovery。[C-003]\n\n这是一种面向复杂平台的性能与可维护性原则：\n\n- 早期解析事实。\n- 在上下文中传递 canonical value。\n- 避免每层各自猜测、搜索、归一化。\n\n## 7. Explicit trust at ingress boundary\n\n`agentCommand` 是本地/CLI trusted entrypoint，默认 owner；`agentCommandFromIngress` 要求网络入口显式声明 `senderIsOwner` 和 `allowModelOverride`。[C-008]\n\n这比“在深层函数里看参数猜权限”更安全：\n\n- 权限判断集中在入口层。\n- 深层 runtime 不隐式提升权限。\n- 代码审计可以从 ingress boundary 开始。\n\n## 8. Terminal-first setup\n\nVISION 说明 OpenClaw 当前 terminal-first，是为了让用户看见 docs、auth、permissions 和 security posture，而不是被便利包装隐藏。[C-015]\n\n这对理解复杂系统设计的启发是：早期复杂系统不一定要优先做完美 UI；关键安全、授权和运行环境决策，CLI/wizard 反而更透明。\n\n## 9. 设计取舍总结\n\n| 取舍 | OpenClaw 的选择 | 可借鉴性 |\n|---|---|---|\n| 能力 vs 安全 | 强能力 + 显式安全边界 | 高 |\n| Core vs Plugin | core generic，owner policy plugin-owned | 高 |\n| Hook vs Capability | capability 优先，hook 补充/兼容 | 高 |\n| UI-first vs Terminal-first | setup 阶段 terminal-first | 中 |\n| 单 Agent vs 多 Agent | 默认 main，但多 Agent 是一等模型 | 高 |\n| Metadata vs Runtime | metadata 先行，runtime 按计划加载 | 高 |\n"},{"file":"comparison.md","label":"横向对比","content":"# 横向对比\n\nStatus: pending\nLast Updated: 2026-05-25\n\n## 1. 本轮状态\n\n本轮没有做横向竞品调研。当前文件保留为后续对比入口，避免在未固定对比对象、未做最新资料核验的情况下给出不可靠结论。\n\n## 2. 建议对比对象\n\n| 对比对象 | 建议对比维度 | 为什么值得比 |\n|---|---|---|\n| Home Assistant | 本地优先、插件/集成、设备控制、自动化 | 和 OpenClaw 一样强调本地控制面与大量 integration |\n| LangGraph | Agent workflow、state、tool/runtime orchestration | 可对比 OpenClaw 的 session/agent loop 与图式编排 |\n| Dify | Agent 应用平台、插件、工作流、模型 Provider | 可对比应用平台化和可视化配置 |\n| Botpress / Rasa | 多渠道 bot、NLU、conversation state | 可对比 channel/session/routing 设计 |\n| Continue / Codex-like harness | 本地 coding agent、tools、workspace、安全 | 可对比 OpenClaw 的 embedded agent runtime 和 workspace contract |\n\n## 3. 推荐对比问题\n\n- OpenClaw 的 Gateway control plane 与 Home Assistant 的 core/integration model 有哪些相似点和差异？\n- OpenClaw 的 Agent loop 与 LangGraph 的 graph/state model 在可控性、可观测性、扩展性上如何取舍？\n- OpenClaw 的 plugin manifest + runtime registration 与 Dify/Botpress 的插件或 connector 模型有什么不同？\n- OpenClaw 的 session/multi-agent isolation 能否借鉴到多租户 ChatOps 或企业智能助手？\n\n## 4. 待补证据\n\n- 需要为每个对比对象固定版本、官方文档和本地/远程源码证据。\n- 需要避免只做产品功能列表，应追踪至少一条核心运行链路。\n"},{"file":"adoption-notes.md","label":"学习借鉴","content":"# 学习借鉴笔记\n\nStatus: draft\nLast Updated: 2026-05-25\n\n## 1. 适用语境\n\nOpenClaw 适合用来学习 AI Gateway、个人智能体、插件治理、多渠道消息接入和多 Agent 运行时的系统设计。这里的笔记只记录“为什么这个设计值得理解”和“在哪些语境下可能有参考价值”，不把它转成具体实施任务。\n\n## 2. 可以直接学习\n\n### 1.1 Gateway control plane\n\n把多入口、多渠道、工具、Agent run、session、事件、设备节点统一到一个 Gateway 控制面。它的学习价值在于：OpenClaw 没有把 Gateway 当成单纯 API server，而是把它作为长期运行的协调层。\n\n- 能理解多渠道入口为什么需要统一协议、session 和事件模型。\n- 能观察 Agent 执行、工具调用、设备节点和 delivery 如何共用一个控制面。\n- 能提醒研究者区分“产品入口很多”和“运行时控制面清晰”这两件事。\n\n适用前提：系统确实存在多个入口、多个执行上下文或多个 delivery target；单入口应用不一定需要这种控制面复杂度。\n\n### 1.2 Manifest + registry\n\nOpenClaw 的插件 manifest 先声明 capability ownership，runtime 再 register 能力。[C-010][C-011] 这体现的是 metadata-before-runtime 的治理思路。\n\n学习重点：\n\n- manifest 不是简单描述文件，而是插件身份、配置 schema、能力归属和 activation hints 的控制面入口。\n- runtime 注册能力前，系统已经能做配置校验、能力规划和 owner map。\n- 插件越多，越需要把“能力是谁的”前置表达，而不是等 runtime 执行后再推断。\n\n### 1.3 Explicit ingress trust\n\n网络入口必须显式传 `senderIsOwner`、`allowModelOverride` 这种信任参数。[C-008] 这体现的是 ingress boundary 优先的安全设计。\n\n学习重点：\n\n- 本地 CLI 和网络入口的信任默认值不同。\n- 权限判断应尽早发生在入口层，而不是让深层 runtime 根据来源字符串猜测。\n- 安全参数作为运行请求的一部分显式传递，便于审计和测试。\n\n### 1.4 Per-agent workspace/state/session\n\nOpenClaw 把 Agent 定义为 workspace + agentDir + auth profiles + session store。[C-009] 这有助于理解多 Agent 系统的隔离边界。\n\n学习重点：\n\n- Gateway 可以共享，但 agent 的 workspace、auth profile、session store 应有明确归属。\n- 多 Agent 不是“多几个 prompt”，而是状态、权限、会话和 delivery target 的组合边界。\n- 默认 main agent 可以降低入门成本，但不能掩盖未来扩展时的隔离模型。\n\n## 3. 需要结合语境后借鉴\n\n### 2.1 Channel plugin 完整 contract\n\nOpenClaw 的 channel contract 覆盖 config、setup、inbound normalize、outbound send、directory、security policy 和 reload lifecycle。这个设计值得学习，但不适合脱离多渠道产品目标直接照搬。\n\n适用前提：\n\n- 渠道数量多，且存在明显的 inbound/outbound 差异。\n- 需要统一身份、目录、delivery 和安全策略。\n- 渠道配置需要可观测、可 reload、可诊断。\n\n### 2.2 Hook system\n\nOpenClaw hook 很丰富，但它的文档也强调 capability registration 是 native plugin 的目标方向。[C-010] 学习时应区分“稳定能力契约”和“生命周期扩展点”。\n\n不确定性：hook 点过多会让系统变成隐式业务总线；hook 需要配套 timeout、priority、failure policy 和观测手段。\n\n### 2.3 Plugin metadata snapshot\n\nMetadata snapshot 能优化重复 discovery，但只有在插件/Provider/Channel 足够多时才值得做。简单系统可以先用 manifest registry，等出现启动和热路径瓶颈再做 snapshot。\n\n## 3. 不建议照搬\n\n### 3.1 一开始就支持大量渠道\n\nOpenClaw 的多渠道广度是产品目标驱动。如果研究对象没有明确多渠道需求，不应把“支持很多渠道”误读为架构先进性的必要条件；更值得学习的是 channel contract 和 delivery 边界。\n\n### 3.2 宽泛 Plugin API 一步到位\n\nOpenClawPluginApi 很强，但也很宽。[C-012] 新系统初期建议只开放必要注册面，避免 API 兼容包袱过早形成。\n\n### 3.3 默认 main session 的 DM 共享策略\n\nOpenClaw 文档说明 DM 默认共享适合单用户，多人可消息时必须开启 DM isolation。[C-009] 学习时要注意它的 local-first 单用户前提，不能把 shared DM 默认值泛化到天然多用户场景。\n\n## 5. 后续单独评估问题\n\n| 问题 | 为什么需要评估 | 建议验证方式 |\n|---|---|---|\n| Plugin reload/config change 的真实边界是什么？ | 静态源码能看出设计意图，但不能证明运行时一致性 | 跑一次 plugin inspect 和 reload/config change 样例 |\n| Channel inbound 到 outbound delivery 是否有统一可观测链路？ | 多渠道系统最容易在 delivery 上出现隐式状态 | 选 Telegram 或 Slack 插件做端到端追踪 |\n| Metadata snapshot 对启动和热路径的收益有多大？ | snapshot 增加心智成本，收益依赖插件数量 | 对比启用/禁用 discovery cache 的启动和 inspect 输出 |\n| DM isolation 在多人渠道里的实际配置体验如何？ | README 明确提示多人场景风险，但需要验证默认配置行为 | 用一个群组 channel 配置样例追踪 session key 生成 |\n\n## 6. 风险和误读\n\n- 不要把 OpenClaw 的渠道数量当成主要价值；主要价值在统一控制面、session/delivery 模型和插件能力归属。\n- 不要把 local-first 的安全默认值泛化到企业多租户场景；OpenClaw 自己也要求多人/群组入口显式处理隔离和 sandbox。[C-016]\n- 不要把 hook 丰富度等同于扩展性成熟度；更稳定的扩展边界来自 capability contract 和 manifest metadata。\n- 不要只读 README 就下结论；Agent runtime、Gateway RPC、plugin loader 和 session manager 的源码链路需要一起看。\n"},{"file":"evidence-index.md","label":"证据索引","content":"# 证据索引\n\n## 1. 版本信息\n\n本文件也可以理解为 Evidence Log，用于约束关键结论必须有证据。\n\n| 项 | 内容 |\n|---|---|\n| 代码来源 | `https://github.com/openclaw/openclaw.git` |\n| 本地路径 | `/Users/cheng/IdeaProjects/openclaw` |\n| branch/tag/commit | branch `main`, commit `989e53c20d395d3c8bf47efc21fdb9d56e7227b0` |\n| 调研日期 | 2026-05-25 |\n\n## 2. 证据索引\n\n| 结论编号 | 结论 | 证据类型 | 位置 | 置信度 | 备注 |\n|---|---|---|---|---|---|\n| \u003ca id=\"C-001\"\u003e\u003c/a\u003eC-001 | OpenClaw 定位为 personal AI assistant，Gateway 是 control plane，支持多渠道 | doc fact | `/Users/cheng/IdeaProjects/openclaw/README.md:21-27`, `README.md:146-155` | 高 | 产品定位和 highlights |\n| \u003ca id=\"C-002\"\u003e\u003c/a\u003eC-002 | package version 为 `2026.5.19`，bin 是 `openclaw.mjs`，workspace 包含 `ui`, `packages/*`, `extensions/*` | source fact | `package.json:2-18`, `pnpm-workspace.yaml:1-5` | 高 | 固定调研快照 |\n| \u003ca id=\"C-003\"\u003e\u003c/a\u003eC-003 | Core 应保持 plugin-agnostic，插件只能通过 SDK/manifest/runtime helpers/documented barrels 等接入 | source fact | `AGENTS.md:26-45` | 高 | 仓库架构硬约束 |\n| \u003ca id=\"C-004\"\u003e\u003c/a\u003eC-004 | Gateway 是单一长期运行控制面，控制 WS API、events、nodes、protocol、pairing、安全等 | doc fact | `docs/concepts/architecture.md:8-31`, `docs/concepts/architecture.md:55-96`, `docs/concepts/architecture.md:97-148` | 高 | 仓库概念文档 |\n| \u003ca id=\"C-005\"\u003e\u003c/a\u003eC-005 | CLI/Gateway 启动链路为 launcher -\u003e entry -\u003e gateway CLI -\u003e lazy server gin hook 类型覆盖模型、prompt、工具、消息、session、gateway、cron 等生命周期 | source/doc fact | `src/plugins/hook-types.ts:68-106`, `docs/concepts/agent-loop.md:89-115` | 高 | hook 清单 |\n\n## 3. 推断链路\n\n| 推断编号 | 依赖证据 | 推断过程 | 待验证点 |\n|---|---|---|---|\n| \u003ca id=\"INF-001\"\u003e\u003c/a\u003eINF-001 | C-003, C-010, C-011, C-012 | Core plugin-agnostic + manifest/control-plane + registry/runtime API 共同说明 OpenClaw 的核心扩展思想是 capability ownership，而不是简单 hooks | 需要动态 inspect 一个插件验证 runtime registry 输出 |\n| \u003ca id=\"INF-002\"\u003e\u003c/a\u003eINF-002 | C-004, C-006, C-008 | Gateway 同时管理 WS clients、method registry、agent ack/final/dedupe，说明它是统一控制面和运行协调中心 | 需要启动 Gateway 观察实际 WS frames |\n| \u003ca id=\"INF-003\"\u003e\u003c/a\u003eINF-003 | C-007, C-008, C-009 | Agent runtime 外壳负责 session/workspace/skills/delivery，Pi core 负责模型工具循环，说明 OpenClaw 将产品上下文和 agent core 解耦 | 需要深挖 Pi runtime 事件结构 |\n| \u003ca id=\"INF-004\"\u003e\u003c/a\u003eINF-004 | C-014 | Channel plugin 包含 config/status/security/outbound/gateway start，说明多渠道系统应抽象完整 channel contract，而不是只抽象 send 函数 | 需要对比其它 channel plugin 验证一致性 |\n\n## 4. 待确认\n\n- 是否所有 bundled channel 都遵守类似 IRC 的完整 channel contract。\n- Plugin reload/config reload 在 live Gateway 中的实际边界。\n- Provider runtime/model fallback/auth profile rotation 的完整链路。\n- Control UI 和 companion apps 如何消费 Gateway protocol。\n\n## 5. 外部资料证据补充\n\n| 结论编号 | 结论 | 证据类型 | 可信度等级 | 来源 | 是否已源码验证 | 置信度 | 备注 |\n|---|---|---|---|---|---|---|---|\n| \u003ca id=\"EXT-OC-001\"\u003e\u003c/a\u003eEXT-OC-001 | 官方资料把 Gateway 定义为长期运行控制面，管理消息面、控制客户端、节点、HTTP/WS surface | 官方事实 | A | https://docs.openclaw.ai/architecture | 是 | 高 | 对应 `C-004`, `C-005`, `C-006` |\n| \u003ca id=\"EXT-OC-002\"\u003e\u003c/a\u003eEXT-OC-002 | 官方资料将 Agent runtime 分成 OpenClaw-owned layer 与 Pi agent core | 官方事实 | A | https://docs.openclaw.ai/concepts/agent | 部分 | 高 | 对应 `C-007`, `C-008`, `INF-003` |\n| \u003ca id=\"EXT-OC-003\"\u003e\u003c/a\u003eEXT-OC-003 | 官方资料强调 plugin capability model 与 manifest/discovery、enablement、runtime loading、surface consumption 分层 | 官方事实 | A | https://docs.openclaw.ai/plugins/architecture | 是 | 高 | 对应 `C-010`, `C-011`, `C-012` |\n| \u003ca id=\"EXT-OC-004\"\u003e\u003c/a\u003eEXT-OC-004 | 官方资料说明 session 和 multi-agent 是隔离模型，覆盖 DM/group/cron/webhook 与 agent workspace/state/auth profile | 官方事实 | A | https://docs.openclaw.ai/concepts/session, https://docs.openclaw.ai/concepts/multi-agent | 部分 | 中 | 对应 `C-008`, `C-009` |\n"},{"file":"research-review.md","label":"调研审查","content":"# 调研审查\n\nStatus: draft\nLast Updated: 2026-05-25\n\n## 1. 审查结论\n\n本轮调研已按新版流程补充外部资料阶段：已固定代码快照，覆盖 OpenClaw 官方 docs、GitHub repository、本地源码和仓库文档，并将外部观点转成研究问题后用现有源码证据验证。关键结论能回溯到官方资料、源码或仓库文档。\n\n## 2. 覆盖情况\n\n| 检查项 | 状态 | 说明 |\n|---|---|---|\n| 固定版本/commit | 通过 | `main@989e53c20d395d3c8bf47efc21fdb9d56e7227b0` |\n| 外部资料调研 | 通过 | external-research.md 已覆盖官方 docs、GitHub、本地仓库 docs |\n| 研究问题验证 | 通过 | research-questions.md 已记录 RQ-OC-001 到 RQ-OC-005 |\n| 结构化源码清单 | 通过 | references/source-inventory.json 已生成，覆盖 17990 个文件 |\n| Dashboard | 通过 | dashboard.html 已生成阅读入口 |\n| 模块关系说明 | 通过 | source-map.md 与 architecture.md 已覆盖 |\n| 至少一条运行链路 | 通过 | runtime-flows.md 覆盖 Gateway 启动、WS handshake、Agent run、Plugin load |\n| 可视化架构图 | 通过 | visual/architecture.html 负责渲染，visual/architecture.visual.js 承接图数据与证据链接；visual/evidence.html 提供可点击证据查看 |\n| 证据索引 | 通过 | evidence-index.md 记录 C-001 到 C-017，并补充 EXT-OC-001 到 EXT-OC-004 |\n| 区分事实与推断 | 通过 | evidence-index.md 区分源码/仓库文档/官方资料/推断 |\n| 借鉴建议 | 通过 | adoption-notes.md |\n| 横向对比 | 未完成 | comparison.md 仅保留后续入口 |\n| 自动校验 | 通过 | `validate-research.js research/openclaw` 已通过 |\n\n## 3. 主要风险\n\n| 风险 | 影响 | 建议 |\n|---|---|---|\n| 未运行 Gateway | 无法证明 live behavior 与静态代码完全一致 | 下一轮用本地 Gateway + WS client 做最小验证 |\n| 未跑测试 | 不能确认边界条件和回归保护 | 选取 plugin loader / gateway ws / agent method 相关测试运行 |\n| 未覆盖所有插件 | 对 channel/provider 一致性的结论仍需抽样验证 | 再抽 Telegram/Slack/OpenAI/Memory plugin |\n| 未做横向对比 | 难以判断 OpenClaw 设计的独特性和行业位置 | 固定一个对比对象做同规格调研 |\n| 未采用第三方实践资料 | 缺少社区踩坑和实践视角 | 后续横向对比时补充 issue、PR、用户实践文章 |\n\n## 4. 需要补充的证据\n\n- `openclaw plugins inspect anthropic --runtime --json` 或同类命令输出。\n- Gateway 启动后一次实际 `connect` + `agent` WS frame 样例。\n- 一个 channel inbound 到 agent delivery 的端到端链路。\n- 一个 plugin reload/config change 的实际流程。\n- 一个 memory plugin 的 slot 选择和 hook 注入链路。\n\n## 5. 审查意见\n\n这版文档已经可以作为后续学习参考使用。下一步不建议继续泛读全部目录，而是做两个定向深挖：\n\n1. Plugin runtime deep dive：跑一个实际 plugin inspect，确认 manifest -\u003e registry -\u003e runtime capability 的可观测输出。\n2. Agent delivery deep dive：从一个真实 channel inbound 追踪到 session、agent run、outbound delivery。\n"},{"file":"references/source-inventory.json","label":"源码清单","content":"{\n  \"schemaVersion\": 1,\n  \"generatedAt\": \"2026-05-28T08:08:39.729Z\",\n  \"researchName\": \"openclaw\",\n  \"researchDir\": \"research/openclaw\",\n  \"status\": \"ok\",\n  \"projectRoot\": \"/Users/cheng/IdeaProjects/openclaw\",\n  \"remote\": \"https://github.com/openclaw/openclaw.git\",\n  \"branch\": \"main\",\n  \"commit\": \"989e53c20d395d3c8bf47efc21fdb9d56e7227b0\",\n  \"versionHint\": \"branch main, commit 989e53c20d395d3c8bf47efc21fdb9d56e7227b0\",\n  \"fileCount\": 17990,\n  \"languages\": [\n    {\n      \"language\": \"TypeScript\",\n      \"count\": 14589\n    },\n    {\n      \"language\": \"Markdown\",\n      \"count\": 994\n    },\n    {\n      \"language\": \"SWIFT\",\n      \"count\": 651\n    },\n    {\n      \"language\": \"JSON\",\n      \"count\": 521\n    },\n    {\n      \"language\": \"JavaScript\",\n      \"count\": 326\n    },\n    {\n      \"language\": \"Kotlin\",\n      \"count\": 175\n    },\n    {\n      \"language\": \"Shell\",\n      \"count\": 169\n    },\n    {\n      \"language\": \"YAML\",\n      \"count\": 126\n    },\n    {\n      \"language\": \"PNG\",\n      \"count\": 76\n    },\n    {\n      \"language\": \"PROSE\",\n      \"count\": 64\n    },\n    {\n      \"language\": \"Other\",\n      \"count\": 33\n    },\n    {\n      \"language\": \"TXT\",\n      \"count\": 32\n    },\n    {\n      \"language\": \"Go\",\n      \"count\     const docs = new Map(window.RESEARCH_DOCS.map(doc => [doc.file, doc]));

    function renderDocument(doc) {
      if (doc.file.endsWith('.json')) {
        return '<h1>' + escapeHtml(doc.label) + '</h1><pre><code>' + escapeHtml(formatJson(doc.content)) + '</code></pre>';
      }
      return renderMarkdown(doc.content);
    }

    function renderMarkdown(markdown) {
      const lines = markdown.replace(/\r\n/g, '\n').split('\n');
      const out = [];
      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        if (!line.trim()) { i += 1; continue; }
        const fence = line.match(/^\s*\x60\x60\x60(.*)$/);
        if (fence) {
          const lang = fence[1].trim().split(/\s+/)[0].toLowerCase();
          const code = [];
          i += 1;
          while (i < lines.length && !/^\s*\x60\x60\x60/.test(lines[i])) {
            code.push(lines[i]);
            i += 1;
          }
          i += 1;
          if (lang === 'mermaid') {
            out.push(renderMermaidSource(code.join('\n')));
            continue;
          }
          out.push('<pre><code>' + escapeHtml(code.join('\n')) + '</code></pre>');
          continue;
        }
        const heading = line.match(/^(#{1,4})\s+(.+)$/);
        if (heading) {
          const level = heading[1].length;
          const text = stripAnchorText(heading[2]);
          const id = heading[2].match(/<a\s+id="([^"]+)"><\/a>/) || [];
          const headingId = id[1] || slug(text);
          out.push('<h' + level + ' id="' + escapeAttr(headingId) + '">' + inline(heading[2]) + '</h' + level + '>');
          i += 1;
          continue;
        }
        if (isTableStart(lines, i)) {
          const tableLines = [];
          while (i < lines.length && /^\s*\|/.test(lines[i])) {
            tableLines.push(lines[i]);
            i += 1;
          }
          out.push(renderTable(tableLines));
          continue;
        }
        if (/^\s*[-*]\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
            items.push(lines[i].replace(/^\s*[-*]\s+/, ''));
            i += 1;
          }
          out.push('<ul>' + items.map(item => '<li>' + inline(item) + '</li>').join('') + '</ul>');
          continue;
        }
        if (/^\s*\d+\.\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
            items.push(lines[i].replace(/^\s*\d+\.\s+/, ''));
            i += 1;
          }
          out.push('<ol>' + items.map(item => '<li>' + inline(item) + '</li>').join('') + '</ol>');
          continue;
        }
        if (/^>\s?/.test(line)) {
          const quote = [];
          while (i < lines.length && /^>\s?/.test(lines[i])) {
            quote.push(lines[i].replace(/^>\s?/, ''));
            i += 1;
          }
          out.push('<blockquote>' + quote.map(inline).join('<br>') + '</blockquote>');
          continue;
        }
        const para = [];
        while (i < lines.length && lines[i].trim() && !isBlockStart(lines, i)) {
          para.push(lines[i]);
          i += 1;
        }
        out.push('<p>' + inline(para.join(' ')) + '</p>');
      }
      return out.join('\n');
    }

    function isBlockStart(lines, idx) {
      const line = lines[idx] || '';
      return /^\s*\x60\x60\x60/.test(line) || /^(#{1,4})\s+/.test(line) || /^\s*\|/.test(line) || /^\s*[-*]\s+/.test(line) || /^\s*\d+\.\s+/.test(line) || /^>\s?/.test(line);
    }

    function isTableStart(lines, idx) {
      return /^\s*\|/.test(lines[idx] || '') && idx + 1 < lines.length && /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[idx + 1] || '');
    }

    function renderTable(tableLines) {
      const rows = tableLines.filter((_, idx) => idx !== 1).map(splitRow);
      if (!rows.length) return '';
      const header = rows[0].map(cell => '<th>' + inline(cell) + '</th>').join('');
      const body = rows.slice(1).map(row => '<tr>' + row.map(cell => '<td>' + inline(cell) + '</td>').join('') + '</tr>').join('');
      return '<table><thead><tr>' + header + '</tr></thead><tbody>' + body + '</tbody></table>';
    }

    function splitRow(row) {
      let value = row.trim();
      if (value.startsWith('|')) value = value.slice(1);
      if (value.endsWith('|')) value = value.slice(0, -1);
      return value.split('|').map(cell => cell.trim());
    }

    function renderMermaidSource(source) {
      return '<div class="mermaid-block" data-mermaid-pending="true"><div class="mermaid-status">正在渲染 Mermaid 图形...</div><pre class="mermaid-source"><code>' + escapeHtml(source) + '</code></pre></div>';
    }

    var mermaidLoadPromise;
    function ensureMermaid() {
      if (window.mermaid) return Promise.resolve(window.mermaid);
      if (mermaidLoadPromise) return mermaidLoadPromise;
      mermaidLoadPromise = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js';
        script.onload = () => window.mermaid ? resolve(window.mermaid) : reject(new Error('Mermaid 脚本未初始化'));
        script.onerror = () => reject(new Error('Mermaid 脚本加载失败'));
        document.head.appendChild(script);
      });
      return mermaidLoadPromise;
    }

    async function renderMermaidBlocks() {
      const blocks = [...document.querySelectorAll('.mermaid-block[data-mermaid-pending="true"]')];
      if (!blocks.length) return;
      let mermaidApi;
      try {
        mermaidApi = await ensureMermaid();
        mermaidApi.initialize({
          startOnLoad: false,
          securityLevel: 'strict',
          theme: 'default',
          flowchart: { htmlLabels: true, curve: 'basis' }
        });
      } catch (error) {
        blocks.forEach(block => markMermaidFailed(block, error));
        return;
      }
      for (let index = 0; index < blocks.length; index += 1) {
        const block = blocks[index];
        const source = block.querySelector('.mermaid-source')?.textContent || '';
        try {
          const id = 'mermaid-' + Date.now() + '-' + index;
          const result = await mermaidApi.render(id, source);
          block.innerHTML = '<div class="mermaid-rendered">' + result.svg + '</div>';
          block.classList.add('rendered');
          block.removeAttribute('data-mermaid-pending');
        } catch (error) {
          markMermaidFailed(block, error);
        }
      }
    }

    function markMermaidFailed(block, error) {
      block.classList.add('failed');
      block.removeAttribute('data-mermaid-pending');
      const status = block.querySelector('.mermaid-status');
      if (status) status.textContent = 'Mermaid 图形渲染失败，下面保留原始源码：' + (error && error.message ? error.message : '未知错误');
    }

    function inline(value) {
      let html = escapeHtml(value);
      html = html.replace(/&lt;a\s+id=&quot;([^&]+)&quot;&gt;&lt;\/a&gt;/g, '<a id="$1"></a>');
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, text, href) => '<a href="' + escapeAttr(rewriteHref(href)) + '">' + escapeHtml(text) + '</a>');
      html = html.replace(/\x60([^\x60]+)\x60/g, '<code>$1</code>');
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      return html;
    }

    function rewriteHref(href) {
      if (/^(https?:|mailto:|#)/.test(href)) return href;
      const hashIndex = href.indexOf('#');
      const hash = hashIndex >= 0 ? href.slice(hashIndex) : '';
      const clean = hashIndex >= 0 ? href.slice(0, hashIndex) : href;
      if (docs.has(clean)) return './docs.html?doc=' + encodeURIComponent(clean) + hash;
      return href;
    }

    function stripAnchorText(value) {
      return value.replace(/<a\s+id="[^"]+"><\/a>/g, '').replace(new RegExp('[#\\x60*_]', 'g'), '').trim();
    }

    function slug(value) {
      return stripAnchorText(value).toLowerCase().replace(/\s+/g, '-').replace(/[^\w\u4e00-\u9fa5-]/g, '');
    }

    function formatJson(value) {
      try { return JSON.stringify(JSON.parse(value), null, 2); } catch { return value; }
    }

    function escapeHtml(value) {
      return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(new RegExp('\\x60', 'g'), '&#96;');
    }
