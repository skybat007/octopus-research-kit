  <script>
    window.RESEARCH_DOCS = [{"file":"README.md","label":"总览文档","content":"# Understand Anything 技术调研\n\nStatus: draft\nOwner: cheng / Codex\nLast Updated: 2026-05-28\n\n## 调研摘要\n\nUnderstand Anything 是一个面向代码库、知识库和文档的理解工具。它把项目扫描、静态结构抽取、LLM 语义分析、知识图谱持久化和 React Dashboard 展示组合成一条可复用的“代码理解流水线”。本轮调研重点不是评价图谱效果，而是理解它如何把“读源码”变成结构化资产：`knowledge-graph.json` 是核心契约，`/understand` 负责生产，Dashboard 和 `/understand-chat`、`/understand-diff`、`/understand-explain` 等技能负责消费。[UA-001][UA-005][UA-013]\n\n本轮调研固定在本地快照 `/Users/cheng/IdeaProjects/Understand-Anything`，branch `main`，commit `26edf61856fa476e466bda1814819a266a293c47`。远程 tag 查询显示截至 2026-05-28 可见最新 tag 为 `v2.7.3`，但本地插件包和平台 manifest 标记为 `2.7.5`，因此本文以本地快照为准。[UA-002][EXT-UA-003]\n\n## 文件导航\n\n| 文件 | 说明 |\n|---|---|\n| research-brief.md | 调研目标、范围、问题和验收标准 |\n| external-research.md | 官方资料、外部资料和需要源码验证的观点 |\n| research-questions.md | 从外部资料转化出的源码验证问题 |\n| source-map.md | 仓库结构、入口、模块和阅读顺序 |\n| dashboard.html | 浏览器阅读入口，导航 Markdown、可视化图和辅助材料 |\n| docs.html | UTF-8 文档阅读器，避免浏览器直接打开 Markdown 乱码 |\n| references/source-inventory.json | 确定性源码扫描索引，辅助定位入口、测试、示例、构建和配置 |\n| architecture.md | 总体架构、模块职责和依赖方向 |\n| visual/architecture.html | HTML 可视化架构图 |\n| visual/architecture.visual.js | 可视化图数据，承接 Markdown 结论和证据链接 |\n| visual/evidence.html | 可点击证据解释页 |\n| visual/evidence.visual.js | 从 evidence-index.md 和 architecture.visual.js 抽取的证据解释数据 |\n| runtime-flows.md | `/understand`、Dashboard、辅助技能、Domain/Knowledge 流程 |\n| key-abstractions.md | 核心类型、Registry、GraphBuilder、Schema、上下文构造器 |\n| extension-points.md | Skill、Agent、Parser Registry、Language/Framework Registry、平台安装 |\n| design-philosophy.md | 设计思想和取舍 |\n| comparison.md | 与相邻工具的对比视角 |\n| adoption-notes.md | 学习借鉴笔记 |\n| evidence-index.md | 证据索引 |\n| research-review.md | 调研质量审查 |\n\n## 当前结论\n\n- Understand Anything 的核心设计是“确定性结构事实 + LLM 语义补全”的混合流水线：Tree-sitter、importMap、batching 和 fingerprint 负责可复现结构，LLM Agent 负责摘要、分层、导览、领域和知识关系。[UA-001][UA-007][UA-008][INF-001]\n- `KnowledgeGraph` 是系统边界：生产端、校验端、Dashboard、Chat、Diff、Explain、Onboard、Domain 和 Knowledge 模式都围绕这个 JSON 契约协作。[UA-010][UA-013][UA-015][INF-002]\n- 它的工程取舍很鲜明：用文件系统中间产物协调多 Agent，并把昂贵 LLM 调用放在 batch 和增量判断之后；同时用 schema/merge/reviewer 降低 LLM 输出不稳定性。[UA-005][UA-008][UA-011]\n- Dashboard 不是简单展示 JSON，而是一个受 token 保护的数据服务 + React Flow 图形工作台；源码预览必须通过 graph-derived allowlist，避免任意文件读取。[UA-013][UA-014]\n- 最值得借鉴的是“把分析产物产品化”：图谱可提交给团队、可由后续技能消费、可用增量机制保持新鲜，而不是一次性阅读报告。[UA-001][UA-015][INF-003]\n\n## 待确认\n\n- 尚未实际运行 `/understand` 分析一个大型项目，本轮以源码和文档静态分析为主。\n- 未完整审查所有语言 extractor 的准确性和测试覆盖。\n- 未验证官方主页 Demo 与本地 Dashboard 当前实现是否完全一致。\n- 远程最新 tag 与本地版本号存在差异，发布流程需要单独确认。\n"},{"file":"research-brief.md","label":"调研简报","content":"# 研究简报\n\n## 研究对象\n\n| 项 | 内容 |\n|---|---|\n| 项目 | Understand Anything |\n| 本地路径 | `/Users/cheng/IdeaProjects/Understand-Anything` |\n| 远程仓库 | `https://github.com/Lum1104/Understand-Anything.git` |\n| branch/tag/commit | branch `main`, commit `26edf61856fa476e466bda1814819a266a293c47` |\n| 本地插件版本 | `@understand-anything/skill` version `2.7.5` |\n| 调研日期 | 2026-05-28 |\n\n## 调研目标\n\n理解 Understand Anything 如何把一个代码库或知识库转成可交互知识图谱，并沉淀以下技术认知：\n\n- `/understand` 主流程如何组织扫描、批处理、Agent 分析、合并、校验、保存和 Dashboard 启动。\n- core 包如何定义 `KnowledgeGraph`、节点/边类型、schema 修复、Tree-sitter 分析、搜索和增量更新。\n- Dashboard 如何消费图谱、保护源码读取、支持结构图、领域图、知识图和 diff 叠加。\n- Skill/Agent/Parser/平台安装这些扩展点如何协作。\n- 哪些设计可以借鉴到后续技术调研或代码理解工具中。\n\n## 范围\n\n- 仓库整体结构、monorepo 包边界和安装方式。\n- `/understand`、`/understand-dashboard`、`/understand-chat`、`/understand-diff`、`/understand-explain`、`/understand-onboard`、`/understand-domain`、`/understand-knowledge`。\n- `packages/core` 的类型、schema、Tree-sitter plugin、PluginRegistry、GraphBuilder、fingerprint/staleness、搜索。\n- `packages/dashboard` 的图谱加载、store、token gate、受限源码读取。\n- Agent prompt 文件的职责边界。\n\n## 不做范围\n\n- 不运行真实 LLM Agent 生成目标项目图谱。\n- 不评估 Dashboard 视觉设计细节和性能上限。\n- 不逐行审查每个语言 extractor。\n- 不输出重构方案。\n\n## 核心研究问题\n\n1. 它如何把官方声称的“多 Agent 知识图谱流水线”落实为可运行流程？\n2. 它如何区分确定性结构事实和 LLM 语义推断？\n3. `KnowledgeGraph` 为什么能成为生产端与消费端之间的稳定契约？\n4. 增量更新如何避免每次都重新消耗 LLM token？\n5. Dashboard 如何避免因为展示源码而暴露本地任意文件？\n6. Skill、Agent、Parser Registry 和平台安装分别属于哪类扩展点？\n\n## 交付物\n\n- 技术调研 Markdown 文档。\n- HTML 可视化架构图和证据解释页。\n- 证据索引，覆盖官方资料、仓库文档、源码事实和推断链路。\n\n"},{"file":"external-research.md","label":"外部资料","content":"# 外部资料调研\n\n## 1. 官方资料\n\n| 资料 | 链接 / 路径 | 主要内容 | 价值 | 可信度 |\n|---|---|---|---|---|\n| GitHub 仓库 | https://github.com/Lum1104/Understand-Anything | 项目 README、安装方式、命令、特性、Under the Hood | 确认官方定位、命令面和设计目标 | A |\n| README 本地快照 | `/Users/cheng/IdeaProjects/Understand-Anything/README.md` | 多平台支持、`/understand`、Dashboard、Tree-sitter + LLM hybrid、multi-agent pipeline | 形成初始研究问题，并和源码互证 | A |\n| 官方主页 | https://understand-anything.com | 产品主页与 Demo 入口 | 辅助理解产品展示目标 | A |\n| Live Demo | https://understand-anything.com/demo/ | 可交互 Dashboard 展示 | 辅助理解 Dashboard 作为阅读界面的定位 | A |\n| Claude Code Plugin 文档 | https://code.claude.com/docs/en/plugins-reference | Claude Code 插件机制参考 | 验证 README 中“Claude Code Plugin”语境 | A |\n| Karpathy LLM wiki pattern | https://gist.github.com/karpathy/442a6bf555914893e9891c11519de94f | `/understand-knowledge` 引用的知识库形态 | 理解 knowledge graph 模式的外部来源 | C |\n\n## 2. 版本与发布资料\n\n| 资料 | 观察 | 判断 |\n|---|---|---|\n| 本地 git remote | `https://github.com/Lum1104/Understand-Anything.git` | 与官方仓库一致 |\n| 本地 commit | `26edf61856fa476e466bda1814819a266a293c47` | 本轮调研固定快照 |\n| 远程 tag | `git ls-remote --tags --refs` 可见最新 tag `v2.7.3` | 本地 `2.7.5` 可能领先 tag 或尚未发布，结论以本地源码为准 |\n| 本地 package | `@understand-anything/skill` version `2.7.5` | 插件 manifest 与 package 版本一致 |\n\n## 3. 外部资料关键观点\n\n### 观点 1：Understand Anything 是交互式知识图谱工具\n\n来源：\n- GitHub README：把任意 codebase、knowledge base 或 docs 转成可探索、搜索、提问的 interactive knowledge graph。\n- 本地 README：`/understand` 生成 `.understand-anything/knowledge-graph.json`，Dashboard 用于探索。\n\n源码验证：\n- 已验证。`KnowledgeGraph` 类型、Dashboard 加载、Chat/Explain/Onboard 上下文构造都围绕该 JSON 契约。\n\n### 观点 2：主分析流程是 Tree-sitter + LLM hybrid\n\n来源：\n- README Under the Hood 明确区分 Tree-sitter deterministic 与 LLM semantic。\n\n源码验证：\n- 已验证。`scan-project.mjs`、`extract-import-map.mjs`、`extract-structure.mjs`、`TreeSitterPlugin`、Agent prompts 分别承担确定性和语义阶段。\n\n### 观点 3：多 Agent pipeline 负责不同语义任务\n\n来源：\n- README 列出 `project-scanner`、`file-analyzer`、`architecture-analyzer`、`tour-builder`、`graph-reviewer`、`domain-analyzer`、`article-analyzer`。\n\n源码验证：\n- 已验证。`understand-anything-plugin/agents/*.md` 和 `/understand` skill 明确调度这些 agent，并通过中间 JSON 文件协调。\n\n### 观点 4：图谱可以提交给团队并增量维护\n\n来源：\n- README Share the Graph 与 auto-update 描述。\n\n源码验证：\n- 部分验证。源码有 fingerprint/staleness、hook prompt、`--auto-update` 配置；未实际运行 post-commit hook。\n\n### 观点 5：Dashboard 源码预览有访问控制\n\n来源：\n- 仓库 `CLAUDE.md` 提到 `/file-content.json` 使用 access token 和 graph-derived path allowlist。\n\n源码验证：\n- 已验证。Vite middleware 对图谱和源码端点要求 token，源码读取拒绝绝对路径、路径逃逸、非图谱文件、大文件和二进制文件。\n\n## 4. 外部资料与源码不一致或需注意处\n\n| 外部资料说法 | 源码实际情况 | 判断 |\n|---|---|---|\n| README/主页呈现为通用多平台工具 | 本地实现仍保留 Claude Code plugin 语境，但安装脚本和 manifest 已覆盖多平台 | 不是冲突，是产品定位扩展 |\n| README 说 `/understand` orchestrates 5 agents | 源码还存在 `assemble-reviewer`、domain/knowledge 额外 agent 和确定性脚本阶段 | README 是概括，源码流程更细 |\n| 本地版本 `2.7.5` | 远程 tag 查询可见最新 tag `v2.7.3` | 以本地快照为准，发布状态待确认 |\n\n## 5. 对调研方向的影响\n\n- 不能只画“Dashboard + Graph”的产品图，必须拆出生产流水线、图谱契约、消费端和扩展点。\n- 关键结论必须区分确定性源码事实和 LLM/Agent 语义产物。\n- 增量更新、token 控制、受限源码读取是比 UI 更值得学习的工程点。\n\n"},{"file":"research-questions.md","label":"研究问题","content":"# 研究问题\n\n## RQ-001：`/understand` 是否真的是多阶段、多 Agent 的知识图谱生产流水线？\n\n来源：\n- README 的 Quick Start、Under the Hood 和 Multi-Agent Pipeline。\n\n重要性：\n- 这是项目的核心承诺，决定架构图应以“生产流水线”而不是“单个分析函数”为中心。\n\n验证方向：\n- `understand-anything-plugin/skills/understand/SKILL.md`\n- `understand-anything-plugin/agents/*.md`\n- `skills/understand/*.mjs`\n\n验证结果：\n- 已验证。`/understand` 包含 preflight、scan、batch、file analyzer 并发、merge、review、architecture、tour、final validation、save 等阶段。[UA-005][UA-011]\n\n## RQ-002：Tree-sitter 和 LLM 的边界是否清晰？\n\n来源：\n- README “Tree-sitter + LLM hybrid”。\n\n重要性：\n- 这决定它的图谱是否可复现，也决定哪些结论能当作结构事实。\n\n验证方向：\n- `TreeSitterPlugin`\n- `scan-project.mjs`\n- `extract-import-map.mjs`\n- `extract-structure.mjs`\n- `agents/file-analyzer.md`\n\n验证结果：\n- 已验证。确定性脚本负责文件枚举、importMap、结构抽取、callGraph、batching；LLM Agent 基于这些结构事实补充摘要、语义边和分层。[UA-006][UA-007][UA-009][INF-001]\n\n## RQ-003：`KnowledgeGraph` 是否是全系统中心契约？\n\n来源：\n- README、Dashboard 描述、辅助命令说明。\n\n重要性：\n- 如果图谱契约稳定，后续工具才能围绕同一产物复用。\n\n验证方向：\n- `packages/core/src/types.ts`\n- `packages/core/src/schema.ts`\n- `packages/dashboard/src/App.tsx`\n- `src/context-builder.ts`\n- `src/explain-builder.ts`\n- `src/onboard-builder.ts`\n\n验证结果：\n- 已验证。core 定义节点/边/层/导览，schema 校验和自动修复，Dashboard 与辅助技能都消费该结构。[UA-010][UA-013][UA-015]\n\n## RQ-004：增量更新是否真的避免无意义 LLM 调用？\n\n来源：\n- README “incremental by default”、auto-update 描述。\n\n重要性：\n- 大型代码库分析成本高，增量策略是产品可用性的关键。\n\n验证方向：\n- `fingerprint.ts`\n- `staleness.ts`\n- `/understand` save 阶段\n- `hooks/auto-update-prompt.md`\n\n验证结果：\n- 部分验证。源码有 fingerprint baseline、changed file diff、NONE/COSMETIC/STRUCTURAL 分类、auto-update prompt；未实测 hook 运行。[UA-012]\n\n## RQ-005：Dashboard 的源码读取是否有安全边界？\n\n来源：\n- `CLAUDE.md` 的 access token + graph allowlist 描述。\n\n重要性：\n- Dashboard 运行在本地 dev server，源码预览如果无约束会变成本地文件读取入口。\n\n验证方向：\n- `packages/dashboard/vite.config.ts`\n- `packages/dashboard/src/App.tsx`\n\n验证结果：\n- 已验证。数据端点要求一次性 token，`file-content.json` 禁止绝对路径和路径逃逸，只允许图谱中出现的 filePath，并限制大小和二进制。[UA-014]\n\n## RQ-006：Domain 和 Knowledge 模式是独立系统还是复用同一图谱契约？\n\n来源：\n- README 的 `/understand-domain` 和 `/understand-knowledge`。\n\n重要性：\n- 决定图谱模型是否只是代码结构模型，还是可扩展到业务域和知识库。\n\n验证方向：\n- `types.ts` 的 domain/knowledge 节点和边。\n- `skills/understand-domain/SKILL.md`\n- `skills/understand-knowledge/SKILL.md`\n- `parse-knowledge-base.py`\n- `merge-knowledge-graph.py`\n\n验证结果：\n- 已验证。schema 支持 domain/flow/step、article/entity/topic/claim/source；Domain 和 Knowledge 模式复用 `KnowledgeGraph`，只是 `kind` 和布局/节点类型不同。[UA-016]\n\n"},{"file":"source-map.md","label":"源码地图","content":"# 源码地图\n\n## 0. 结构化源码清单\n\n本轮已生成 `references/source-inventory.json`，覆盖 `/Users/cheng/IdeaProjects/Understand-Anything` 当前快照的 411 个文件。该文件用于辅助定位入口、测试、示例、构建和配置，不替代下文的模块职责判断。\n\n## 1. 顶层结构\n\n| 路径 | 职责 |\n|---|---|\n| `README.md` | 产品定位、安装、命令、Under the Hood |\n| `CLAUDE.md` | 仓库内部架构说明、Dashboard 约束、Agent Pipeline 说明 |\n| `package.json` | 顶层 workspace、构建、测试、dashboard dev 命令 |\n| `pnpm-workspace.yaml` | workspace 包：plugin packages、plugin、homepage |\n| `install.sh` / `install.ps1` | 多平台安装和 skill symlink |\n| `.claude-plugin/`, `.cursor-plugin/`, `.copilot-plugin/` | 平台插件 manifest |\n| `understand-anything-plugin/` | 核心插件源码 |\n| `homepage/` | 产品主页 |\n\n## 2. Plugin 包结构\n\n| 路径 | 职责 |\n|---|---|\n| `understand-anything-plugin/package.json` | `@understand-anything/skill` 包，依赖 core、graphology、louvain |\n| `understand-anything-plugin/skills/` | 用户可调用技能：`understand`、dashboard、chat、diff、explain、onboard、domain、knowledge |\n| `understand-anything-plugin/agents/` | subagent prompt：project-scanner、file-analyzer、architecture-analyzer、tour-builder、graph-reviewer 等 |\n| `understand-anything-plugin/src/` | chat、explain、onboard 等技能的 TypeScript 上下文构造逻辑 |\n| `understand-anything-plugin/hooks/` | auto-update hook 配置和内部 prompt |\n| `understand-anything-plugin/packages/core/` | 分析引擎、图谱类型、schema、parser registry、搜索、增量更新 |\n| `understand-anything-plugin/packages/dashboard/` | React/Vite Dashboard |\n\n## 3. Core 包重点文件\n\n| 文件 | 阅读重点 |\n|---|---|\n| `src/types.ts` | `KnowledgeGraph`、21 类节点、35 类边、domain/knowledge 扩展 |\n| `src/schema.ts` | Zod 校验、LLM alias 修复、autoFixGraph、validateGraph |\n| `src/plugins/tree-sitter-plugin.ts` | web-tree-sitter WASM 初始化、语言 extractor、结构/导入/call graph 抽取 |\n| `src/plugins/registry.ts` | AnalyzerPlugin 注册、按语言/文件分发 |\n| `src/analyzer/graph-builder.ts` | 将结构分析转成 file/function/class/non-code 节点和边 |\n| `src/fingerprint.ts` | 文件结构指纹和 NONE/COSMETIC/STRUCTURAL 分类 |\n| `src/staleness.ts` | git diff changed-files 和 graph merge update |\n| `src/search.ts` / `src/embedding-search.ts` | Dashboard/Chat 搜索能力 |\n| `src/languages/` | 语言配置、框架识别、具体 parser 配置 |\n\n## 4. `/understand` 主流程文件\n\n| 文件 | 阅读重点 |\n|---|---|\n| `skills/understand/SKILL.md` | 7 阶段总编排、并发策略、增量逻辑、保存和 dashboard 启动 |\n| `skills/understand/scan-project.mjs` | git ls-files/fallback walk、ignore、语言和类别检测、行数统计 |\n| `skills/understand/extract-import-map.mjs` | Tree-sitter + resolver 预解析内部 importMap |\n| `skills/understand/compute-batches.mjs` | Louvain 社区检测、非代码分组、small batch 合并、neighborMap |\n| `skills/understand/extract-structure.mjs` | 批内结构抽取、callGraph、metrics、非代码结构透传 |\n| `skills/understand/merge-batch-graphs.py` | batch graph 合并、标准化、去重、dangling edge 清理 |\n| `skills/understand/build-fingerprints.mjs` | 生成后续增量更新 baseline |\n\n## 5. Dashboard 重点文件\n\n| 文件 | 阅读重点 |\n|---|---|\n| `packages/dashboard/src/App.tsx` | token gate、图谱/config/meta/diff/domain 加载、schema validation |\n| `packages/dashboard/src/store.ts` | Zustand 状态、节点索引、搜索、视图模式、diff、focus、tour |\n| `packages/dashboard/vite.config.ts` | GRAPH_DIR、受保护 JSON 端点、file-content allowlist、路径脱敏 |\n| `packages/dashboard/src/components/GraphView.tsx` | React Flow 图展示、层级视图和布局 |\n\n## 6. 推荐阅读顺序\n\n1. `README.md` + `CLAUDE.md`：先固定产品定位和仓库自述架构。\n2. `skills/understand/SKILL.md`：理解真正的生命周期。\n3. `scan-project.mjs`、`extract-import-map.mjs`、`compute-batches.mjs`、`extract-structure.mjs`：理解确定性流水线。\n4. `types.ts`、`schema.ts`、`graph-builder.ts`：理解图谱契约和标准化。\n5. `agents/*.md`：理解 LLM Agent 的语义职责。\n6. `App.tsx`、`store.ts`、`vite.config.ts`：理解图谱消费和安全边界。\n7. `fingerprint.ts`、`staleness.ts`、`hooks/auto-update-prompt.md`：理解增量更新。\n"},{"file":"architecture.md","label":"架构文档","content":"# 技术架构\n\n## 1. 总体判断\n\nUnderstand Anything 的架构可以理解为四层：\n\n1. 平台接入层：多平台插件 manifest、安装脚本、Skill 命令和 Hook。\n2. 图谱生产层：`/understand` 编排确定性脚本和 LLM Agent，把项目转成 `KnowledgeGraph`。\n3. 图谱契约层：core 包定义类型、schema、parser registry、GraphBuilder、搜索和增量更新能力。\n4. 图谱消费层：Dashboard、chat、diff、explain、onboard、domain、knowledge 等功能复用图谱。\n\n它不是一个普通 Dashboard 项目，也不是一个单纯 prompt 包。真正稳定的中心是 `.understand-anything/knowledge-graph.json`，所有生产和消费能力都围绕这个文件形成闭环。[UA-010][INF-002]\n\n## 2. 模块职责\n\n| 模块 | 职责 | 证据 |\n|---|---|---|\n| Platform / Installer | 将同一组 skills 安装到 Claude、Codex、Gemini、OpenClaw、Hermes、Copilot 等平台 | [UA-017] |\n| Skills | 暴露用户命令，定义流程和输入输出文件 | [UA-005][UA-015][UA-016] |\n| Agents | 承担 LLM 语义任务：扫描叙述、文件分析、架构分层、导览、审查、领域/知识提取 | [UA-011] |\n| Deterministic Scripts | 负责扫描、importMap、batch、结构抽取、fingerprint 等可复现计算 | [UA-006][UA-007][UA-008][UA-009][UA-012] |\n| Core | 定义图谱类型、schema、Tree-sitter plugin、registry、GraphBuilder、search、staleness | [UA-004][UA-010] |\n| Dashboard | 加载图谱、校验、建立索引、展示结构/领域/知识图、受控读取源码 | [UA-013][UA-014] |\n\n## 3. 依赖方向\n\n```text\nPlatform manifests / install.sh\n        ↓\nSkills and hooks\n        ↓\nDeterministic scripts + LLM agents\n        ↓\n@understand-anything/core\n        ↓\n.understand-anything/knowledge-graph.json\n        ↓\nDashboard + chat/diff/explain/onboard/domain/knowledge consumers\n```\n\n关键点是：Dashboard 不直接重新分析源码，辅助命令也不直接扫全项目；它们优先消费图谱，再做搜索、1-hop 展开、layer 查找或 diff 叠加。[UA-015]\n\n## 4. 主流程架构\n\n`/understand` 是一个“流程说明型 Skill”，不是单一 JS 入口。它先解决项目根目录、worktree redirect、插件根目录、core build、config 和语言偏好；再进入 scan、batch、analyze、merge、review、architecture、tour、validation、save。中间结果都写入 `.understand-anything/intermediate/`，最终产物写入 `.understand-anything/knowledge-graph.json`。[UA-005]\n\n这个设计把复杂度分散到三类对象：\n\n- 确定性脚本：低成本、可重试、可测试。\n- LLM Agent：读取有限上下文，写 batch JSON。\n- 合并/校验脚本：吸收 LLM 输出不稳定性，统一成 schema。\n\n## 5. 图谱契约层\n\n`KnowledgeGraph` 覆盖代码、非代码、领域和知识库四类场景。节点类型包括 file/function/class/module/concept、config/document/service/table/endpoint/pipeline/schema/resource、domain/flow/step、article/entity/topic/claim/source；边类型覆盖 structural、behavioral、data flow、dependencies、semantic、infra/schema、domain、knowledge。这个模型解释了为什么 `/understand-domain` 和 `/understand-knowledge` 不需要独立格式。[UA-010][UA-016]\n\nschema 层进一步承认 LLM 输出会不稳定，所以提供 alias、sanitize、autoFix 和 validate。它不是简单“严格失败”，而是先尽量修正，再把 fatal、auto-corrected、dropped 问题反馈给 Dashboard 或 reviewer。[UA-010]\n\n## 6. 静态分析与 LLM 边界\n\n确定性阶段承担这些事实：\n\n- 文件枚举、ignore、语言/类别和行数统计。\n- Tree-sitter 结构抽取：函数、类、imports、exports、callGraph。\n- importMap 预解析。\n- Louvain batching 和 cross-batch neighborMap。\n- fingerprint 和 changed-file 分类。\n\nLLM 阶段承担这些语义：\n\n- 文件/函数/类摘要。\n- 语义 tags、业务语义、layer 归属。\n- guided tour。\n- domain/knowledge implicit relationships。\n\n这说明项目的核心思想不是“让 LLM 全读源码”，而是先把可确定事实压缩成结构化上下文，再让 LLM 在受限边界内补充语义。[INF-001]\n\n## 7. Dashboard 架构\n\nDashboard 是一个本地 Vite 数据服务 + React 图谱工作台。Vite 侧通过 `GRAPH_DIR` 或当前路径寻找 `.understand-anything/*.json`，为 graph、domain、diff、meta、config 和 file content 提供受 token 保护的端点。React 侧加载图谱后使用 core schema 校验，再在 Zustand store 中建立节点索引、layer 索引、search engine、view mode、diff 和 focus 状态。[UA-013][UA-014]\n\n源码读取有明确边界：\n\n- 所有数据端点需要一次性 token。\n- `file-content.json` 拒绝绝对路径和路径逃逸。\n- 只能读取已经存在于 knowledge graph 的文件。\n- 拒绝超过 1MB 的文件和二进制文件。\n- 返回 graph JSON 时会把绝对 filePath 脱敏成相对路径。\n\n## 8. 关键推断\n\n- `KnowledgeGraph` 是 Understand Anything 的“中间表示 IR”：生产端把源码/文档压缩成 IR，消费端围绕 IR 提供交互、问答、导览和增量影响分析。[INF-002]\n- 通过 batch + intermediate files 协调多 Agent，是为了降低上下文压力和并发风险，同时保留可恢复性；但代价是流程依赖文件命名契约，`SKILL.md` 对 batch 文件名约束很重。[INF-004]\n- 多平台安装复用同一技能目录，说明项目更像“portable AI coding skill package”，不是只绑定 Claude Code 的插件。[INF-005]\n\n"},{"file":"runtime-flows.md","label":"运行流程","content":"# 运行流程\n\n## 1. `/understand` 完整分析流程\n\n```text\n用户调用 /understand [path] [flags]\n  ↓\nPhase 0: 解析 PROJECT_ROOT、worktree redirect、定位 PLUGIN_ROOT、必要时 build core\n  ↓\n创建 .understand-anything/intermediate 和 tmp，处理 autoUpdate/outputLanguage\n  ↓\nPhase 0.5: 生成或读取 .understandignore\n  ↓\nPhase 1: project-scanner + scan-project.mjs + extract-import-map.mjs\n  ↓\nPhase 1.5: compute-batches.mjs 生成 batches 和 neighborMap\n  ↓\nPhase 2: 最多 5 个 file-analyzer 并发分析 batch\n  ↓\nmerge-batch-graphs.py 合并、标准化、去重、清理 dangling edges\n  ↓\nPhase 3: assemble-reviewer 复核 assembled graph\n  ↓\nPhase 4: architecture-analyzer 生成 layers\n  ↓\nPhase 5: tour-builder 生成 guided tour\n  ↓\nPhase 6: graph-reviewer 或 deterministic validation\n  ↓\nPhase 7: 保存 knowledge-graph.json，生成 fingerprints，写 meta.json，清理 intermediate\n  ↓\n验证通过后自动触发 /understand-dashboard\n```\n\n证据：[UA-005][UA-006][UA-007][UA-008][UA-009][UA-011][UA-012]\n\n## 2. 扫描与 batching 流程\n\n`scan-project.mjs` 优先使用 `git ls-files -z -co --exclude-standard` 枚举项目文件，失败时退回递归 walk。随后通过 ignore filter、语言检测、文件类别、行数统计和复杂度估算生成 scan result。[UA-006]\n\n`extract-import-map.mjs` 使用 `TreeSitterPlugin + PluginRegistry + registerAllParsers` 解析内部 imports。它在 Tree-sitter 初始化失败时不会中断整个 pipeline，而是写空 importMap 并发出 warning，让后续语义分析仍可继续。[UA-007]\n\n`compute-batches.mjs` 将 import graph 送入 Louvain community detection，失败时使用确定性 count-based fallback。它会为跨 batch 文件构造 `neighborMap`，把相邻文件和 exported symbols 传给 file-analyzer，降低跨 batch 关系丢失风险。[UA-008]\n\n## 3. 结构抽取流程\n\n`extract-structure.mjs` 对 batch 内文件读取内容，通过 registry 分发 Tree-sitter 和非代码 parser，输出函数、类、exports、sections、definitions、services、endpoints、steps、resources、callGraph 和 metrics。它是 LLM file-analyzer 的结构事实输入，避免每个 Agent 自己重新做解析。[UA-009]\n\n## 4. Dashboard 启动与数据加载\n\n```text\n/understand-dashboard\n  ↓\n定位 plugin root，build core/dashboard\n  ↓\nGRAPH_DIR=\u003cproject-dir\u003e 启动 Vite\n  ↓\nVite 打印 http://127.0.0.1:\u003cport\u003e/?token=\u003cACCESS_TOKEN\u003e\n  ↓\nReact 从 URL/sessionStorage 取 token\n  ↓\nfetch meta/config/knowledge-graph/diff/domain\n  ↓\nvalidateGraph\n  ↓\nZustand setGraph 建立索引、搜索引擎、视图状态\n  ↓\nGraphView / sidebar / source viewer 展示\n```\n\n证据：[UA-013][UA-014]\n\n## 5. Chat / Explain / Onboard 消费流程\n\n这些命令不重新扫描项目：\n\n- Chat 使用 `SearchEngine` 搜索相关节点，沿边扩展 1-hop，收集相关 layer，再格式化为 LLM prompt。[UA-015]\n- Explain 支持 file path 或 `path:function`，找到目标节点、child nodes、connected nodes、relevant edges 和 layer，生成深潜 prompt。[UA-015]\n- Onboard 从 `KnowledgeGraph` 直接生成 project overview、layer、concept、tour、file map 和复杂度热点。[UA-015]\n\n## 6. Domain / Knowledge 扩展流程\n\nDomain 模式优先从已有 `knowledge-graph.json` 派生业务域图；没有图谱时做 lightweight scan 给 domain-analyzer。最终保存 `domain-graph.json`，Dashboard 会检测并进入 domain view。[UA-016]\n\nKnowledge 模式面向 Karpathy-pattern wiki。它先确定性解析 index、wikilinks、headings、frontmatter、topic、article 和 source，再用 article-analyzer 提取 implicit relationships、entity、claim，最后合并成 `kind: \"knowledge\"` 的 `KnowledgeGraph`。[UA-016]\n\n## 7. Auto-update 流程\n\nauto-update hook 的核心原则是：cosmetic 或内部实现变化不花 LLM token，只有结构变化才进入 partial update。它读取 meta commit、git diff changed files、ignore filter、fingerprints，分类为 `SKIP`、`PARTIAL_UPDATE`、`ARCHITECTURE_UPDATE` 或 `FULL_UPDATE`。[UA-012]\n\n"},{"file":"key-abstractions.md","label":"核心抽象","content":"# 关键抽象\n\n## 1. `KnowledgeGraph`\n\n核心中间表示，字段包括：\n\n- `version`\n- `kind?: \"codebase\" | \"knowledge\"`\n- `project`\n- `nodes`\n- `edges`\n- `layers`\n- `tour`\n\n它既承载代码图，也承载领域图和知识库图，是生产端与消费端之间的稳定契约。[UA-010]\n\n## 2. `GraphNode` / `GraphEdge`\n\n`GraphNode` 把代码、非代码、领域和知识库概念统一成节点，最小字段包含 `id`、`type`、`name`、`summary`、`tags`、`complexity`。`GraphEdge` 用 35 类边表达 imports、contains、calls、reads/writes、routes、domain flow、knowledge citation 等关系。[UA-010]\n\n这个抽象的价值在于：Dashboard、Chat、Diff 和 Explain 不需要理解每种源码语言，只需要理解图谱节点和边。\n\n## 3. `TreeSitterPlugin`\n\n`TreeSitterPlugin` 是确定性结构抽取的核心。它通过语言配置加载 `web-tree-sitter` WASM grammar，并注册 language extractor；随后提供：\n\n- `analyzeFile`\n- `resolveImports`\n- `extractCallGraph`\n\n它对 grammar 缺失采取 graceful degradation，保持 pipeline 可继续运行。[UA-009]\n\n## 4. `PluginRegistry`\n\n`PluginRegistry` 把文件扩展名和语言配置映射到 `AnalyzerPlugin`，为脚本提供统一分发面：\n\n- 按语言或文件找 plugin。\n- 分发 `analyzeFile`。\n- 分发 `resolveImports`。\n- 分发 `extractCallGraph`。\n\n这让 Tree-sitter 和非代码 parser 可以共存，而上层脚本不需要知道具体 parser 类型。[UA-009]\n\n## 5. `GraphBuilder`\n\n`GraphBuilder` 将结构分析转换成图谱：\n\n- 文件变成 `file` 节点。\n- 函数/类变成子节点，并通过 `contains` 边连接。\n- import/call 变成 `imports`/`calls` 边。\n- Docker、SQL、OpenAPI、GraphQL、Terraform、CI 等非代码结构变成 service/table/endpoint/pipeline/schema/resource 等节点。\n\n它是“结构事实 -\u003e KnowledgeGraph”之间的重要桥梁。[UA-010]\n\n## 6. `validateGraph` / `autoFixGraph`\n\nschema 层承认 LLM 输出会出现别名、大小写、缺字段、方向不规范等问题，所以提供：\n\n- node/edge/complexity/direction aliases。\n- sanitize。\n- auto-fix。\n- validation result 和 issue 列表。\n\n这比单纯 schema reject 更适合 LLM pipeline。[UA-010]\n\n## 7. `FingerprintStore`\n\nFingerprint 把文件内容和结构签名分开：\n\n- 内容 hash 相同：`NONE`\n- 内容不同但函数/类/import/export 等结构签名相同：`COSMETIC`\n- 结构签名变化、新增、删除：`STRUCTURAL`\n\n这是 auto-update 节省 token 的基础。[UA-012]\n\n## 8. `ChatContext` / `ExplainContext`\n\n辅助技能把图谱转成 LLM prompt 上下文：\n\n- Chat：搜索相关节点，扩展 1-hop，收集相关 layers。\n- Explain：定位目标文件或函数，收集 child、connected nodes、edges、layer。\n- Onboard：从 graph 生成 onboarding 文档。\n\n它们体现了一个关键思路：分析产物不是只给人看，还能继续喂给 LLM 形成二次能力。[UA-015]\n\n"},{"file":"extension-points.md","label":"扩展点","content":"# 扩展点\n\n## 1. Skill 扩展\n\nSkill 是用户命令入口。当前插件包含：\n\n- `/understand`\n- `/understand-dashboard`\n- `/understand-chat`\n- `/understand-diff`\n- `/understand-explain`\n- `/understand-onboard`\n- `/understand-domain`\n- `/understand-knowledge`\n\n每个 Skill 负责定义参数、前置条件、输入输出路径和调度逻辑。`/understand` 是主生产流程，其它 Skill 多数是图谱消费或特定视图生成。[UA-005][UA-015][UA-016]\n\n## 2. Agent 扩展\n\nAgent prompt 文件承担 LLM 语义阶段：\n\n| Agent | 作用 |\n|---|---|\n| `project-scanner` | 基于 README/manifest 生成项目叙述、语言和框架判断 |\n| `file-analyzer` | 从 batch 结构事实生成节点和边 |\n| `assemble-reviewer` | 检查合并后的 graph |\n| `architecture-analyzer` | 生成 layers |\n| `tour-builder` | 生成 guided tour |\n| `graph-reviewer` | 可选完整 LLM review |\n| `domain-analyzer` | 生成 domain/flow/step 图 |\n| `article-analyzer` | 从 wiki 文章提取 entity/claim/implicit edges |\n\nAgent 的输出不是直接展示，而是写入 intermediate JSON，再由脚本合并和校验。[UA-011]\n\n## 3. Analyzer Plugin / Parser Registry\n\n`AnalyzerPlugin` 接口定义了结构抽取能力：`analyzeFile`、`resolveImports`、`extractCallGraph`、`extractReferences`。`PluginRegistry` 用 `LanguageRegistry` 为文件选择 plugin。`registerAllParsers` 让非代码 parser 和 Tree-sitter 同一套接口进入 pipeline。[UA-009]\n\n这是最像“框架扩展点”的地方：新增语言或非代码格式应优先接入 registry，而不是在上层流程里写特殊分支。\n\n## 4. Language / Framework Registry\n\n`languages/` 保存语言配置，`framework-registry.ts` 保存框架识别。`/understand` 的 architecture phase 会按检测到的语言和框架注入对应上下文，让 LLM 分层时带上语言/框架特有模式。[UA-005]\n\n## 5. Dashboard 视图扩展\n\nDashboard store 明确支持多种视图状态：\n\n- structural graph\n- domain graph\n- knowledge graph\n- diff mode\n- focus mode\n- tour\n- file/code viewer\n- fuzzy/semantic search\n\n它的扩展边界不是“新增一个 React 页面”，而是“围绕同一 graph/store 增加新的视图解释”。[UA-013]\n\n## 6. 平台安装扩展\n\n`install.sh` 维护平台表，不同平台使用 per-skill symlink 或 folder symlink。Claude/Copilot/Cursor manifest 指向同一组 skills 和 agents。这个设计把平台差异压缩到安装层，减少业务逻辑分叉。[UA-017]\n\n## 7. Hook 扩展\n\n`hooks/hooks.json` 和 `auto-update-prompt.md` 把 post-commit auto-update 做成内部 hook。它不是用户命令，而是基于 config 和 git commit 触发增量分析。[UA-012]\n\n"},{"file":"design-philosophy.md","label":"设计思想","content":"# 设计思想\n\n## 1. 确定性事实先行，LLM 只补语义\n\nUnderstand Anything 没有让 LLM 从零阅读整个仓库，而是先用确定性脚本建立文件清单、importMap、结构信息、batch 和 neighborMap，再把压缩后的结构事实交给 Agent。这样做的收益是：\n\n- 结构边更可复现。\n- Agent prompt 更小。\n- 跨 batch 关系可以由 importMap/neighborMap 补强。\n- 增量更新可以先用 fingerprint 判断是否值得调用 LLM。\n\n代价是 pipeline 更长，中间文件和命名契约更多。[INF-001][INF-004]\n\n## 2. 图谱是中间表示，而不是展示格式\n\n`KnowledgeGraph` 同时被 Dashboard、Chat、Diff、Explain、Onboard、Domain 和 Knowledge 模式消费。它更像编译器里的 IR：不同输入被规整到统一结构，不同输出再从同一结构派生。[INF-002]\n\n这个设计比直接生成 Markdown 报告更有复用价值。报告是终点，图谱是后续能力的起点。\n\n## 3. LLM 输出要经过吸收层\n\nschema alias、merge script、reviewer、autoFixGraph 共同说明作者预期 LLM 会犯格式错误、方向错误、重复节点、dangling edge 等问题。系统不把 Agent 输出当最终事实，而是通过合并和校验层吸收不稳定性。[UA-010][UA-011]\n\n这是做 AI 工具很值得借鉴的取舍：LLM 可以负责语义，但结构契约必须由程序兜底。\n\n## 4. 成本控制是架构问题\n\n`compute-batches`、file-analyzer 并发上限、fingerprint、auto-update prompt 都在处理同一个问题：大型项目不能每次全量丢给 LLM。它把成本控制放进架构主线，而不是事后优化。[UA-008][UA-012]\n\n## 5. 本地文件访问必须产品化\n\nDashboard 需要展示源码，但它不是直接开放静态目录，而是通过 token、路径归一化、graph allowlist、文件大小和二进制检测建立边界。[UA-014]\n\n这说明“本地工具”也需要明确安全模型，尤其是当它在浏览器里打开本地服务时。\n\n## 6. 多平台的核心是目录协议\n\n安装脚本把多平台差异折叠成 skills 目录链接方式。平台可以不同，但 Skill 文件、Agent prompt 和插件源码保持同源。[UA-017]\n\n这适合个人或小团队的 AI coding workflow：不是为每个平台重写插件，而是维护一套 portable skill package。\n\n"},{"file":"comparison.md","label":"横向对比","content":"# 对比视角\n\n本轮未做完整横向源码对比，只给出后续比较 Understand Anything 时应关注的维度。\n\n## 1. 与一次性源码总结工具\n\nUnderstand Anything 的优势不是“能总结代码”，而是把总结沉淀成可复用的 `KnowledgeGraph`。一次性总结通常产出 Markdown，后续问答和 diff 要重新读上下文；Understand Anything 则让 Chat、Explain、Onboard、Dashboard 共享同一个图谱。[INF-002]\n\n## 2. 与 IDE 索引 / LSP\n\nLSP 更擅长精确符号、跳转、诊断；Understand Anything 更偏架构学习和语义导览。它牺牲了一部分 IDE 级精度，换取跨语言/非代码/领域/知识库的统一图谱表达。[UA-010][UA-016]\n\n## 3. 与 Mermaid/静态架构文档\n\n静态架构图表达最终结论，Understand Anything 的图谱表达“可查询的中间状态”。Dashboard 可以搜索、筛选、点击源码、看 diff、切换 domain/knowledge view；Markdown 图更适合汇报，图谱更适合持续探索。[UA-013]\n\n## 4. 与 OpenClaw / Hermes Agent / Claude Code 调研对象\n\n| 对象 | 更像什么 | Understand Anything 的差异 |\n|---|---|---|\n| OpenClaw | Agent Gateway / 控制面 | Understand Anything 不运行长期 Agent 网关，核心是分析产物和 Dashboard |\n| Hermes Agent | Agent runtime / message gateway | Understand Anything 的 Agent 只是离线分析阶段，生产结果是图谱 |\n| Claude Code | Coding agent CLI/runtime | Understand Anything 依赖这类平台执行 Skill/Agent，但自身是代码理解插件 |\n\n## 5. 后续对比建议\n\n- Sourcegraph Cody / Code Search：对比索引、搜索和问答。\n- CodeSee / OpenGrok / Understand by SciTools：对比代码可视化和静态分析。\n- Doxygen / TypeDoc / JSDoc：对比文档生成与图谱中间表示。\n- LangGraph / Dify：对比 Agent workflow 与图谱生产 pipeline。\n\n"},{"file":"adoption-notes.md","label":"学习借鉴","content":"# 学习借鉴笔记\n\n## 1. 可以直接学习的设计\n\n- **知识源产物化**：把分析结果保存为 `knowledge-graph.json`，让 Dashboard、Chat、Explain、Diff 复用，而不是每次重新分析。\n- **确定性事实先行**：先用扫描、parser、importMap、batch 压缩上下文，再让 LLM 处理语义。\n- **LLM 输出吸收层**：alias、sanitize、merge、review、auto-fix 缓冲 LLM 不稳定性。\n- **证据/图谱/展示分层**：图谱作为契约，Dashboard 只是消费端。\n- **受控本地源码读取**：token + path allowlist + 文件大小/二进制限制。\n\n## 2. 需要改造后借鉴的设计\n\n- **Skill 文件编排流程**：适合 AI coding 平台，但如果用于普通后端服务，建议改成显式任务编排器或队列。\n- **intermediate 文件协调多 Agent**：简单、可恢复，但要严控文件命名、并发写入和清理策略。\n- **Louvain batching**：适合基于 import graph 的代码库，对弱依赖项目或文档库需要替换分组策略。\n- **Graph schema**：节点/边很通用，但如果用于企业系统，需要补权限、服务边界、部署拓扑、数据实体和接口协议字段。\n\n## 3. 不建议直接照搬\n\n- 不建议把所有分析逻辑都写进长 Skill Markdown；大型团队最好把 orchestration 下沉到可测试代码。\n- 不建议依赖 LLM 生成关键边而不做后续校验；至少要保留 import/call/schema 等确定性边。\n- 不建议把 Dashboard 作为唯一阅读入口；Markdown/HTML 调研文档仍适合沉淀稳定结论。\n\n## 4. 适合本技术调研项目借鉴的点\n\n- 可把 `evidence-index.md` 看作轻量版 KnowledgeGraph：统一承接结论、证据、来源和可信度。\n- 可把 HTML 架构图当作 Dashboard 的简化版：Markdown 是知识源，visual JS 是结构化图数据，HTML 只是展示。\n- 可在后续框架调研中加入“确定性源码事实”和“LLM/外部资料推断”分层，避免概念图和事实混在一起。\n\n## 5. 后续验证建议\n\n- 实际运行 `/understand` 分析一个中型项目，比较图谱中 imports/calls/layers 的准确率。\n- 对一个只改内部实现、不改导出的文件测试 fingerprint 是否判为 COSMETIC。\n- 对 Dashboard 尝试读取非图谱路径，验证 allowlist 拦截。\n- 对非 TypeScript 项目验证语言 registry 和 extractor 覆盖质量。\n\n"},{"file":"evidence-index.md","label":"证据索引","content":"# 证据索引\n\n## 1. 版本信息\n\n本文件也可以理解为 Evidence Log，用于约束关键结论必须有证据。\n\n| 项 | 内容 |\n|---|---|\n| 代码来源 | `https://github.com/Lum1104/Understand-Anything.git` |\n| 本地路径 | `/Users/cheng/IdeaProjects/Understand-Anything` |\n| branch/tag/commit | branch `main`, commit `26edf61856fa476e466bda1814819a266a293c47` |\n| 调研日期 | 2026-05-28 |\n\n## 2. 证据索引\n\n| 结论编号 | 结论 | 证据类型 | 位置 | 置信度 | 备注 |\n|---|---|---|---|---|---|\n| \u003ca id=\"UA-001\"\u003e\u003c/a\u003eUA-001 | README 将项目定位为把 codebase、knowledge base、docs 转成 interactive knowledge graph，并提供 `/understand`、dashboard、chat、diff、domain、knowledge 等命令 | repository doc fact | `README.md:4-6`, `README.md:46-48`, `README.md:119-168`, `README.md:274-297` | 高 | 官方仓库 README |\n| \u003ca id=\"UA-002\"\u003e\u003c/a\u003eUA-002 | 本地快照 remote 为官方 GitHub 仓库，branch `main`，commit `26edf61856fa476e466bda1814819a266a293c47`；本地只有未跟踪 `.idea/` | source fact | `git remote get-url origin`, `git branch --show-current`, `git rev-parse HEAD`, `git status --short` | 高 | 固定本轮调研版本 |\n| \u003ca id=\"UA-003\"\u003e\u003c/a\u003eUA-003 | 仓库自述架构为 pnpm monorepo，plugin 下含 core、dashboard、src、skills、agents；Dashboard 源码预览受 token 和 graph allowlist 控制 | repository doc fact | `CLAUDE.md:10-18`, `CLAUDE.md:19-31`, `CLAUDE.md:50-52` | 高 | 仓库内部架构说明 |\n| \u003ca id=\"UA-004\"\u003e\u003c/a\u003eUA-004 | 顶层 workspace 覆盖 plugin packages、plugin、homepage；插件包版本 `2.7.5`，core/dashboard 版本 `0.1.0`，core 提供 browser-safe subpath exports | source fact | `package.json:2-12`, `pnpm-workspace.yaml:1-4`, `understand-anything-plugin/package.json:2-15`, `understand-anything-plugin/packages/core/package.json:2-28`, `understand-anything-plugin/packages/dashboard/package.json:2-30` | 高 | 包边界 | .com/Lum1104/Understand-Anything | 是 | 高 | 对应 UA-001 |\n| \u003ca id=\"EXT-UA-002\"\u003e\u003c/a\u003eEXT-UA-002 | 官方主页和 Demo 强调图谱式探索体验 | official fact | A | https://understand-anything.com, https://understand-anything.com/demo/ | 部分 | 中 | 对应 UA-013，未实测 Demo |\n| \u003ca id=\"EXT-UA-003\"\u003e\u003c/a\u003eEXT-UA-003 | 远程 tag 查询可见最新 tag 为 `v2.7.3`，本地插件版本为 `2.7.5` | official/source fact | A/S | `git ls-remote --tags --refs https://github.com/Lum1104/Understand-Anything.git`, `understand-anything-plugin/package.json:2-3` | 是 | 高 | 版本差异需关注 |\n| \u003ca id=\"EXT-UA-004\"\u003e\u003c/a\u003eEXT-UA-004 | Claude Code 官方文档存在 Plugin 机制，README 的 Claude Code Plugin 语境成立 | official fact | A | https://code.claude.com/docs/en/plugins-reference | 不适用 | 中 | 插件平台背景 |\n| \u003ca id=\"EXT-UA-005\"\u003e\u003c/a\u003eEXT-UA-005 | `/understand-knowledge` 引用 Karpathy-pattern LLM wiki | community fact | C | https://gist.github.com/karpathy/442a6bf555914893e9891c11519de94f | 是 | 中 | 对应 UA-016 |\n\n"},{"file":"research-review.md","label":"调研审查","content":"# 调研审查\n\n## 1. 版本固定\n\n- 已固定本地路径、remote、branch、commit 和调研日期。\n- 已记录本地版本 `2.7.5` 与远程 tag `v2.7.3` 的差异。\n\n## 2. 外部资料\n\n- 已覆盖官方 GitHub README、官方主页、Demo、Claude Code plugin 文档和 Karpathy wiki pattern。\n- 未深入第三方社区实践文章；当前结论主要依赖官方/仓库资料和本地源码。\n\n## 3. 源码覆盖\n\n已生成 `references/source-inventory.json`，覆盖 411 个文件；它用于辅助定位入口、测试、示例、构建和配置，不作为架构结论来源。\n\n已覆盖：\n\n- 顶层 workspace 和插件 manifest。\n- `/understand` 主 Skill。\n- scan/importMap/batch/extract/fingerprint/staleness。\n- core types/schema/TreeSitterPlugin/PluginRegistry/GraphBuilder。\n- Dashboard App/store/Vite middleware。\n- Chat/Explain/Onboard context builders。\n- Domain/Knowledge skills。\n\n未覆盖：\n\n- 每个语言 extractor 的完整实现和测试。\n- Dashboard 全部 React 组件布局细节。\n- homepage 实现。\n\n## 4. 研究问题状态\n\n| 问题 | 状态 |\n|---|---|\n| `/understand` 是否是多阶段多 Agent 流水线 | 已验证 |\n| Tree-sitter 和 LLM 边界是否清晰 | 已验证 |\n| `KnowledgeGraph` 是否是中心契约 | 已验证 |\n| 增量更新是否避免无意义 LLM 调用 | 部分验证，未实测 hook |\n| Dashboard 源码读取是否有安全边界 | 已验证 |\n| Domain/Knowledge 是否复用图谱契约 | 已验证 |\n\n## 5. 风险和残留问题\n\n- 本轮没有运行测试和真实 `/understand` 分析任务，因此图谱质量、性能和 LLM 输出稳定性仍需实测。\n- 本地源码存在未跟踪 `.idea/`，本轮忽略该用户/IDE 文件，没有修改目标仓库。\n- 远程发布状态需要后续确认；调研结论不代表 npm/marketplace 当前可安装版本。\n\n## 6. 质量结论\n\n本轮已满足架构级调研要求：有外部资料、研究问题、结构化源码清单、源码地图、架构、运行流程、关键抽象、扩展点、设计思想、证据索引、可视化架构图和 Dashboard 阅读入口。关键结论均绑定 evidence ID，视觉图不作为新结论来源。`validate-research.js research/understand-anything` 已通过。\n"},{"file":"references/source-inventory.json","label":"源码清单","content":"{\n  \"schemaVersion\": 1,\n  \"generatedAt\": \"2026-05-28T08:08:40.038Z\",\n  \"researchName\": \"understand-anything\",\n  \"researchDir\": \"research/understand-anything\",\n  \"status\": \"ok\",\n  \"projectRoot\": \"/Users/cheng/IdeaProjects/Understand-Anything\",\n  \"remote\": \"https://github.com/Lum1104/Understand-Anything.git\",\n  \"branch\": \"main\",\n  \"commit\": \"26edf61856fa476e466bda1814819a266a293c47\",\n  \"versionHint\": \"branch main, commit 26edf61856fa476e466bda1814819a266a293c47\",\n  \"fileCount\": 411,\n  \"languages\": [\n    {\n      \"language\": \"TypeScript\",\n      \"count\": 178\n    },\n    {\n      \"language\": \"Markdown\",\n      \"count\": 100\n    },\n    {\n      \"language\": \"TypeScript React\",\n      \"count\": 36\n    },\n    {\n      \"language\": \"JSON\",\n      \"count\": 25\n    },\n    {\n      \"language\": \"JavaScript\",\n      \"count\": 16\n    },\n    {\n      \"language\": \"ASTRO\",\n      \"count\": 10\n    },\n    {\n      \"language\": \"Other\",\n      \"count\": 7\n    },\n    {\n      \"language\": \"YAML\",\n      \"count\": 7\n    },\n    {\n      \"language\": \"Python\",\n      \"count\": 6\n    },\n    {\n      \"language\": \"XML\",\n      \"count\": 5\n    },\n    {\n      \"language\": \"WOFF2\",\n      \"count\": 4\n    },\n    {\n      \"language\": \"PNG\",\n      \"count\": 3\n    },\n    {\n      \"language\": \"CSS\",\n      \"count\": 2\n    },\n    {\n      \"language\": \"GIF\",\n      \"count\": 2\n    },\n    {\     function isBlockStart(lines, idx) {
      const line = lines[idx] || '';
      return /^\s*\x60\x60\x60/.test(line) || /^(#{1,4})\s+/.test(line) || /^\s*\|/.test(line) || /^\s*[-*]\s+/.test(line) || /^\s*\d+\.\s+/.test(line) || /^>\s?/.test(line);
    }

    function isTableStart(lines, idx) {
      return /^\s*\|/.test(lines[idx] || '') && idx + 1 < lines.length && /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[idx + 1] || '');
    }

    function renderTable(tableLines) {
      const rows = tableLines.filter((_, idx) => idx !== 1).map(splitRow);
      if (!rows.length) return '';
      const header = rows[0].map(cell => '<th>' + inline(cell) + '</th>').join('');
      const body = rows.slice(1).map(row => '<tr>' + row.map(cell => '<td>' + inline(cell) + '</td>').join('') + '</tr>').join('');
      return '<table><thead><tr>' + header + '</tr></thead><tbody>' + body + '</tbody></table>';
    }

    function splitRow(row) {
      let value = row.trim();
      if (value.startsWith('|')) value = value.slice(1);
      if (value.endsWith('|')) value = value.slice(0, -1);
      return value.split('|').map(cell => cell.trim());
    }

    function inline(value) {
      let html = escapeHtml(value);
      html = html.replace(/&lt;a\s+id=&quot;([^&]+)&quot;&gt;&lt;\/a&gt;/g, '<a id="$1"></a>');
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, text, href) => '<a href="' + escapeAttr(rewriteHref(href)) + '">' + escapeHtml(text) + '</a>');
      html = html.replace(/\x60([^\x60]+)\x60/g, '<code>$1</code>');
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      return html;
    }

    function rewriteHref(href) {
      if (/^(https?:|mailto:|#)/.test(href)) return href;
      const hashIndex = href.indexOf('#');
      const hash = hashIndex >= 0 ? href.slice(hashIndex) : '';
      const clean = hashIndex >= 0 ? href.slice(0, hashIndex) : href;
      if (docs.has(clean)) return './docs.html?doc=' + encodeURIComponent(clean) + hash;
      return href;
    }

    function stripAnchorText(value) {
      return value.replace(/<a\s+id="[^"]+"><\/a>/g, '').replace(new RegExp('[#\\x60*_]', 'g'), '').trim();
    }

    function slug(value) {
      return stripAnchorText(value).toLowerCase().replace(/\s+/g, '-').replace(/[^\w\u4e00-\u9fa5-]/g, '');
    }

    function formatJson(value) {
      try { return JSON.stringify(JSON.parse(value), null, 2); } catch { return value; }
    }

    function escapeHtml(value) {
      return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(new RegExp('\\x60', 'g'), '&#96;');
    }
  </script>
</body>
</html>
